  lang:b=>setLang(b.dataset.v),
  fullscreen:()=>toggleFs(),
  mute:()=>{MUSIC.toggle();drawMute();const tb=$('[data-act="musictoggle"]');if(tb)tb.textContent=MUSIC.isOn()?t('mus.off'):t('mus.on');const n=$('#musNow');if(n)n.textContent=MUSIC.isOn()?t('mus.waiting'):t('mus.offlead')},
  musictoggle:b=>{const on=MUSIC.toggle();drawMute();b.textContent=on?t('mus.off'):t('mus.on');const n=$('#musNow');if(n)n.textContent=on?t('mus.waiting'):t('mus.offlead')},
  musicnext:()=>{MUSIC.next();drawMute();const b=$('[data-act="musictoggle"]');if(b)b.textContent=t('mus.off')},
  exportsave:()=>exportSave(),
  adv:b=>{ADV.set(b.dataset.v==='1');showOptions();render()},
  optreset:b=>{if(!b.dataset.armed){b.dataset.armed='1';b.textContent=t('opt.sure');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t('opt.reset')}},3500);return}
    const keep={chef:state.chef,shop:state.shop};state=freshState();Object.assign(state,keep);state.seenIntro=true;save();closeModal();render();toast(t('opt.wasreset'))},
  quickstart:()=>{$('#chefName').value=DEF_CHEF;$('#shopName').value=DEF_SHOP;ACT.savechef()},
  savechef:()=>{const c=($('#chefName').value||'').trim(),sh=($('#shopName').value||'').trim();if(!c||!sh){toast(t('chef.need'));$(c?'#shopName':'#chefName').focus();return}
    state.chef=c;state.shop=sh;save();closeModal();toast(t('chef.hello',{c}));
    if(!state.seenIntro){state.seenIntro=true;save();showIntro()}},
  close:()=>closeModal(),
  tier:b=>{state.tier=+b.dataset.v;render()},
  study:()=>{if(state.studyWeek===weekOf(state.day)||state.money<STUDY_COST)return;state.money=r2(state.money-STUDY_COST);state.studyWeek=weekOf(state.day);
    const x=studyTips();state.tips=[x,...(state.tips||[])].slice(0,20);save();render();
    modal(`<h2>${t('study.title')}</h2><ul>${tipText(x).map(s=>`<li>${esc(s)}</li>`).join('')}</ul><button class="btn primary big" data-act="close">${t('rep.go')}</button>`)},
  rzoom:b=>RZ.set(RZ.z*(+b.dataset.v>0?1.5:1/1.5)),
  supplier:b=>{state.supplier=+b.dataset.v;render()},
  restock:b=>{state.restockDays=+b.dataset.v;render()},
  openfill:()=>{closeModal();ACT.stockfill({dataset:{days:3}});startDay(false)},   // asks again only if the money didn't stretch
  openauto:()=>{state.tier=2;startDay(true)},
  openanyway:()=>startDay(true),
  stockbuy:b=>{const id=b.dataset.id,d=+b.dataset.days,need=dailyNeed()[id]||0,price=r2(Math.ceil(need*d/10)*10*gramPrice(id)*(1-BULK[d]));
    if(state.money<price){toast(t('rm.nomoney'));return}state.money=r2(state.money-buyStock(id,need*d,d));toast(t('st.bought',{x:eur(price)}));render()},
  stockfill:b=>{const d=+b.dataset.days,total=fillCost(d);if(state.money<total){toast(t('rm.nomoney'));return}const c=fillStock(d,false);toast(t('st.bought',{x:eur(c)}));render()},
  install:()=>installGame(),
  instlater:()=>{try{localStorage.setItem('pm-install-asked','1')}catch(_){}hideInstallAsk()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t&&t.closest('#nav')){go(t.dataset.tab);return}
  const g=e.target.closest('[data-tab-go]');if(g){go(g.dataset.tabGo);return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b);
  const tr=TRACK[b.dataset.act];if(tr)track(typeof tr==='function'?tr(b):tr);   // after the action, so toggles report their new state
});
// the end-of-day report closes with a double click or double tap anywhere on it, without scrolling down to the button;
// buttons keep their own action and a drag (scrolling) is not a tap
const tap2={t:0,x:0,y:0,dx:0,dy:0};
document.addEventListener('pointerdown',e=>{tap2.dx=e.clientX;tap2.dy=e.clientY});
document.addEventListener('pointerup',e=>{
  const mb=e.target.closest&&e.target.closest('#mbox');if(!mb||!mb.dataset.report||e.target.closest('button,a,input,select'))return;
  if(Math.hypot(e.clientX-tap2.dx,e.clientY-tap2.dy)>10)return;
  if(e.timeStamp-tap2.t<400&&Math.hypot(e.clientX-tap2.x,e.clientY-tap2.y)<40){tap2.t=0;e.preventDefault();ACT.closereport();return}
  Object.assign(tap2,{t:e.timeStamp,x:e.clientX,y:e.clientY});
});
document.addEventListener('input',e=>{if(e.target.id==='pname'){state.draft.name=e.target.value;drawBench()}
  if(e.target.id==='chefName'||e.target.id==='shopName'){const b=$('[data-start]');if(b)b.disabled=!($('#chefName').value.trim()&&$('#shopName').value.trim())}});
document.addEventListener('input',e=>{if(e.target.id==='musVol'){const v=MUSIC.setVolume(+e.target.value);const x=$('#musVolTxt');if(x)x.textContent=t('mus.v'+v)}});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0])importSave(e.target.files[0]);
  if(e.target.id==='recFile'&&e.target.files[0])e.target.files[0].text().then(takeRecipe)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='chefName'||e.target.id==='shopName'){e.preventDefault();const b=$('[data-start]');if(!b||!b.disabled)ACT.savechef()}else if(e.target.classList&&e.target.classList.contains('brand'))showChef()});
// re-render only when the width changes: the phone keyboard changes the height, and a re-render would kill the field being typed in
let rsT,rsW=window.innerWidth;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(window.innerWidth===rsW)return;rsW=window.innerWidth;if(!anim)render()},150)});

document.addEventListener('pm-music',e=>{const n=$('#musNow');if(n)n.textContent=t('mus.now',{x:e.detail})});
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/>';
function drawSkip(){const b=$('#skip');b.title=t('mus.next');b.setAttribute('aria-label',t('mus.next'))}
function drawMute(){drawSkip();const b=$('#mute'),on=MUSIC.isOn();b.classList.toggle('off',!on);b.setAttribute('aria-label',t(on?'mus.off':'mus.on'));b.title=t(on?'mus.off':'mus.on');
  b.innerHTML=SPK+(on?'<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>':'<path d="M17 9l5 6M22 9l-5 6"/></svg>')}
// full screen: the standard API, or the webkit one on older Safari/iPad; hidden where neither exists (iPhone)
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsCan=()=>!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
function drawFs(){const b=$('#fs');document.documentElement.classList.toggle('nofs',!fsCan());if(!fsCan()){b.hidden=true;return}b.hidden=false;const on=!!fsEl();const lbl=t(on?'fs.exit':'fs.enter');b.title=lbl;b.setAttribute('aria-label',lbl);
  b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(on?'<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>':'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>')+'</svg>'}
function toggleFs(){const d=document,el=d.documentElement;
  if(fsEl())(d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else{const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(p&&p.catch)p.catch(()=>toast(t('fs.no')))}}
document.addEventListener('fullscreenchange',drawFs);document.addEventListener('webkitfullscreenchange',drawFs);
function start(data){
  drawMute();drawFs();
  MUSIC.arm();   // music starts after the first tap or key (browser rule)
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});   // static labels (nav)
  state=(data&&data.state)||load()||freshState();
  if(state.over){state=freshState();state.seenIntro=true}
  if(!state.room||!Array.isArray(state.room.items))state.room=starterRoom(state.deco||0);
  if(!state.banana2){for(const p of [...state.menu,state.draft])for(const x of p.pieces||[])if(x.i==='banana'&&!x.g)x.g=1;state.banana2=true}   // the whole banana used to be a slice: those become chopped
  if(!Array.isArray(state.hist))state.hist=[];if(!state.tips)state.tips=[];if(state.studyWeek==null)state.studyWeek=-1;
  if(!state.supplier)state.supplier=1;delete state.unlocked;   // nothing is locked any more
  if(!state.stock)state.stock={};if(!state.tier)state.tier=state.stockMode==='manual'?3:2;if(!state.restockDays)state.restockDays=3;delete state.stockMode;   // old saves keep running their own prices
  for(const p of state.menu){if(!p.from&&state.chef)p.from=meNow();if(p.from&&!p.fromSig)p.fromSig=pizzaSig(p)}   // old saves: sign the menu as it is now
  if(PHONE&&state.zoom==null)state.zoom=true;   // phones start on the big pizza; the player can still leave zoom
  if(SANDBOX){
    state.seenIntro=true;if(!['cozinha','menu'].includes(state.tab))state.tab='cozinha';
    document.querySelectorAll('#nav button').forEach(b=>{if(!['cozinha','menu'].includes(b.dataset.tab))b.hidden=true});
    $('#nav .in').style.gridTemplateColumns='repeat(2,1fr)';$('#nav .in').style.maxWidth='320px';
    document.body.classList.add('sandbox');
  }
  render();
  if(!state.chef)showChef();
  else if(!state.seenIntro){state.seenIntro=true;save();showIntro()}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!anim)render()});
  if(/[#&]p=/.test(location.hash)){const h=location.hash;history.replaceState(null,'',location.href.split('#')[0]+(SANDBOX&&!window.PM_SANDBOX?'#sandbox':''));
    readRecipe(h).then(r=>{track('open-recipe-link');state.draft={...r,fromSig:pizzaSig(r),editing:null};if(state.tab!=='cozinha')state.tab='cozinha';render();save();toast(t('rec.got',{x:r.name,c:r.from.c}))}).catch(()=>toast(t('rec.bad')))}
}
window.claude?.hot?.snapshot?.(()=>({state}));
atlasReady.then(()=>window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{}));
</script>
