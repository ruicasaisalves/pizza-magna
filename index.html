<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pizza Magna</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4a260f">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* The fonts live in assets/fonts (Google Fonts' latin and latin-ext files, SIL Open Font License),
   so the game looks the same offline, opened straight from disk */
@font-face{font-family:'Pixelify Sans';font-weight:400 700;src:url(assets/fonts/pixelify-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:'Pixelify Sans';font-weight:400 700;src:url(assets/fonts/pixelify-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF;font-display:swap}
@font-face{font-family:'Silkscreen';font-weight:400;src:url(assets/fonts/silkscreen-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:'Silkscreen';font-weight:400;src:url(assets/fonts/silkscreen-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF;font-display:swap}
@font-face{font-family:'Silkscreen';font-weight:700;src:url(assets/fonts/silkscreen-bold-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:'Silkscreen';font-weight:700;src:url(assets/fonts/silkscreen-bold-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF;font-display:swap}
@font-face{font-family:'VT323';font-weight:400;src:url(assets/fonts/vt323-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:'VT323';font-weight:400;src:url(assets/fonts/vt323-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF;font-display:swap}
/* Pixelify Sans draws 5 like an S or an 8 and 2 like a Z at small sizes: the digits 0-9 come from VT323
   (assets/digits.woff2, only those ten glyphs; VT323 by Peter Hull, SIL Open Font License) and the browser
   takes everything else from Pixelify Sans */
@font-face{font-family:'PM Digits';src:url(assets/digits.woff2) format('woff2');unicode-range:U+0030-0039;size-adjust:120%;font-display:swap}
/* Layout: 90s management-sim cabinet. Wood-panelled frames around every surface, parchment cards, a green-phosphor terminal for live numbers, brass push-buttons, pixel-art canvases scaled with nearest-neighbour */
:root{
  --wood:#7a4520; --wood-hi:#a8692f; --wood-lo:#4a260f; --wood-deep:#2a1407;
  --brass:#e3b34a; --brass-hi:#fbe39a; --brass-lo:#94661a; --brass-ink:#3a2706;
  --parch:#f3e6c6; --parch-2:#e6d3a8; --ink:#2c1a0b; --muted:#6c5233; --line:#c8ad7c; --on-wood:#e9d2a2;
  --blue:#1f4f9c; --marble:#ecebe6;
  --lcd-bg:#081008; --lcd:#8cff73; --lcd-dim:#3f7f33;
  --tomato:#c4352a; --tomato-hi:#e8705a; --tomato-lo:#7e1d14; --good:#2e7b2c; --bad:#b02a1c; --cheese:#ffcf4a;
  --f-pixel:'Silkscreen','Courier New',monospace;
  --f-lcd:'VT323','Courier New',monospace;
  --f-body:'PM Digits','Pixelify Sans','Trebuchet MS',system-ui,sans-serif;   /* digits from VT323, the rest Pixelify Sans */
  color-scheme:light;
}
html,body{height:100%}
/* inside an iframe (itch.io) the page itself may not scroll (scrolling="no"), so the body becomes the scroller */
html.embed{overflow:hidden}
html.embed body{margin:0;overflow-y:auto;overscroll-behavior:contain}
body{color:var(--on-wood);font-family:var(--f-body);font-size:15px;line-height:1.4;background-color:#4c2a13;
  background-image:repeating-linear-gradient(0deg,rgba(20,8,2,.55) 0 2px,transparent 2px 44px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 9px),linear-gradient(90deg,#4c2a13,#573117 50%,#4c2a13)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood-deep)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sandbox .stats,.sandbox .goal{display:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}
button:disabled{cursor:not-allowed;filter:grayscale(.7);opacity:.6}
h1,h2,h3{font-family:var(--f-pixel);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em;line-height:1.15}
h2{font-size:1.15rem}
h3{font-size:.92rem}
.lbl{font-family:var(--f-pixel);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sub{color:#d9bf8e;font-size:.9rem;margin:2px 0 0}
.card .sub,.box .sub{color:var(--muted)}

/* Frames */
.card{background:var(--parch);color:var(--ink);border:3px solid var(--wood-deep);border-radius:2px;padding:14px;
  box-shadow:inset 0 0 0 3px var(--parch-2),0 0 0 3px var(--wood-hi),0 0 0 6px var(--wood-lo),0 8px 0 6px rgba(0,0,0,.22)}
.frame{border:6px solid var(--wood);background:var(--wood-deep);box-shadow:inset 0 0 0 2px var(--wood-deep),0 0 0 2px var(--wood-hi),0 0 0 5px var(--wood-deep),0 8px 0 5px rgba(0,0,0,.25);position:relative}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Brass buttons */
.btn{font-family:var(--f-pixel);font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--brass-ink);
  background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;padding:8px 12px;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),inset -1px -1px 0 rgba(0,0,0,.25),0 3px 0 var(--wood-deep)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 1px 0 var(--wood-deep)}
.btn.primary{background:linear-gradient(var(--tomato-hi),var(--tomato) 45%,var(--tomato-lo));color:#fff1d2;border-color:#3a0c06}
.btn.ghost,.btn.danger{background:linear-gradient(#f6ead0,#dcc699)}
.btn.danger{color:var(--bad)}
.btn.big{font-size:.95rem;padding:12px 18px}
.btn.sm{padding:6px 9px;font-size:.66rem}

/* Header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--wood-hi),var(--wood) 30%,var(--wood-lo));border-bottom:4px solid var(--wood-deep);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.hdr-in{max-width:1040px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-pixel);font-weight:700;font-size:1.05rem;color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 50%,var(--brass-lo));border:2px solid var(--brass-ink);padding:4px 12px 4px 6px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 2px 0 var(--wood-deep)}
.brand .logo{width:32px;height:32px;image-rendering:pixelated;display:block}   /* the game's icon, drawn 32 px (tools/gen_icon.py) */
.stats{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.opt-btn{display:inline-flex;align-items:center;gap:6px;order:3}
/* mute: fixed in the top-right corner, above every screen and dialog */
#hdr{position:sticky}
#mute{position:absolute;z-index:6;top:8px;right:max(8px,env(safe-area-inset-right,0px));width:38px;height:38px;padding:0;display:grid;place-items:center;
  color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 3px 0 var(--wood-deep)}
#skip{position:absolute;z-index:6;top:8px;right:calc(max(8px,env(safe-area-inset-right,0px)) + 46px);width:38px;height:38px;padding:0;display:grid;place-items:center;
  color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 3px 0 var(--wood-deep)}
#skip svg{width:20px;height:20px}
#fs{position:absolute;z-index:6;top:8px;right:calc(max(8px,env(safe-area-inset-right,0px)) + 92px);width:38px;height:38px;padding:0;display:grid;place-items:center;
  color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 3px 0 var(--wood-deep)}
#fs svg{width:20px;height:20px}
#mute.off{background:linear-gradient(#f6ead0,#dcc699);color:var(--bad)}
#mute svg{width:22px;height:22px}
.hdr-in{padding-right:max(150px,env(safe-area-inset-right,0px))}
.sandbox .opt-btn{margin-left:auto}
@media (max-width:600px){.hdr-in{padding-right:max(16px,env(safe-area-inset-right,0px))}.brand{max-width:calc(100% - 146px);margin-right:142px;white-space:nowrap;font-size:clamp(.7rem,3.6vw,1.05rem);padding-left:6px;padding-right:8px}.hdr-in .opt-btn,.sandbox .hdr-in .opt-btn{margin-left:auto;margin-right:calc(max(8px,env(safe-area-inset-right,0px)) - max(16px,env(safe-area-inset-right,0px)))}}   /* phone: second row, right edge lined up under the corner buttons */
/* phone version (html.phone, set by PHONE): one header row, pizza icon as the brand, Options as an icon next to the corner buttons */
html.phone .hdr-in{padding-right:max(16px,env(safe-area-inset-right,0px))}
html.phone .brand{max-width:none;margin-right:0;padding:4px}
html.phone .brand-t,html.phone .opt-btn span{display:none}
html.phone .hdr-in .opt-btn{position:absolute;z-index:6;top:8px;right:calc(max(8px,env(safe-area-inset-right,0px)) + 138px);width:38px;height:38px;padding:0;margin:0;justify-content:center}
html.phone.nofs .hdr-in .opt-btn{right:calc(max(8px,env(safe-area-inset-right,0px)) + 92px)}
html.phone .opt-btn svg{width:20px;height:20px}
html.phone .stats{flex-basis:100%;margin-left:0}
html.phone #view{padding-top:8px}
html.phone .kitchen,html.phone .bench{gap:8px}
html.phone .stage{gap:6px}
.opts{display:flex;flex-direction:column;gap:14px}
.opts section{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:12px}
.stat{background:var(--marble);border:2px solid var(--wood-deep);box-shadow:inset 0 0 0 1px #fff8;padding:2px 8px;display:flex;flex-direction:column;min-width:0}
.stat .lbl{color:#4d6a96;font-size:.56rem}
.stat b{font-family:var(--f-lcd);font-weight:400;font-size:1.25rem;line-height:1;color:var(--blue);white-space:nowrap}
.stars i{font-style:normal;color:#bdb6aa}
.stars i.on{color:var(--blue)}
.goal{flex-basis:100%;display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--on-wood)}
.goal .bar{flex:1;max-width:260px;height:8px;background:var(--wood-deep);border:1px solid var(--brass-lo)}
.goal .bar span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--brass) 0 6px,var(--brass-lo) 6px 7px)}

/* Main */
#view{max-width:1040px;margin:0 auto;padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view>.stack>h2,#view>.stack>div>h2,#view>.stack>div>h3{color:var(--brass-hi);text-shadow:2px 2px 0 var(--wood-deep)}

/* Kitchen */
.kitchen{display:flex;flex-direction:column;gap:22px}
.bench{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:1000px){.bench{grid-template-columns:auto minmax(0,1fr);align-items:start}}
.stage{border:6px solid var(--wood);box-shadow:inset 0 0 0 2px var(--wood-deep),0 0 0 2px var(--wood-hi),0 0 0 5px var(--wood-deep);
  background:repeating-linear-gradient(90deg,#b98552 0 30px,#a8743f 30px 32px);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
@media (max-width:420px){.stage{padding:8px 4px}}
.stage canvas{touch-action:none;max-width:100%;display:block;cursor:crosshair;box-shadow:0 0 0 2px var(--wood-deep)}
.pantry .ings{margin-top:8px}
.pantry .cats{margin-top:8px}
.pantry .cats button small{opacity:.6}
@media (min-width:1000px){.pantry{max-height:516px;overflow:auto}}
.stage #zbar{display:grid;gap:6px;justify-items:center;width:100%}
.zrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.zname{font-family:Silkscreen,monospace;color:#fff1d2;text-shadow:1px 1px 0 var(--wood-deep)}
.zcut{display:flex;gap:6px}
.btn.ibtn{width:40px;height:40px;padding:0;display:inline-grid;place-items:center}   /* .btn.sm padding would squeeze the icon */
.ibtn svg{width:22px;height:22px}
.stage .ibtn canvas{width:32px;height:32px;box-shadow:none;cursor:inherit}
.zlcd{font-family:Silkscreen,monospace;font-size:.85rem;background:radial-gradient(ellipse at 30% 20%,#f4f2ec,#dedad0);color:#1f4f8f;border:2px solid var(--wood-deep);box-shadow:inset 1px 1px 0 #fff;padding:5px 12px;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;justify-content:center}
/* phone tools: zoom, rotate and undo in the middle; the bin alone in the right corner, away from undo */
.tools.ptools{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%}
.ptools .tc{grid-column:2;display:flex;gap:6px}
.ptools .tr{grid-column:3;justify-self:end}
/* mini pantry (phone): a row of group tabs and a strip of topping pictures, two rows high, scrolling sideways */
.pantry.mini{padding:0;display:flex;flex-direction:column;overflow:hidden}
/* the group tabs look like folder tabs on a dark strip, the open one joined to the panel, so they don't read as toppings */
.mcats{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:var(--wood-deep);padding:5px 5px 0;box-shadow:inset 0 -2px 0 var(--wood-deep)}
.mcats button{border:2px solid var(--wood-lo);border-bottom:0;border-radius:5px 5px 0 0;background:var(--wood);padding:3px 0 2px;display:grid;place-items:center;margin:5px 0 2px}
.mcats canvas{width:24px;height:24px;opacity:.75}
.mcats button.on{background:var(--parch);border-color:var(--wood-deep);margin:0;padding:5px 0 6px}
.mcats button.on canvas{width:32px;height:32px;opacity:1}
.mings{margin:6px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,50px);grid-auto-columns:50px;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:2px}
.mings .ing{padding:0;justify-content:center}
.mings .ing canvas{width:40px;height:40px}
.stage .hint{color:#fff4dc;font-size:.85rem;text-shadow:1px 1px 0 var(--wood-deep);text-align:center}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px}
.field input{border:2px solid var(--wood-lo);border-radius:0;padding:8px 10px;font:inherit;font-size:1rem;background:#fffaf0;color:var(--ink);width:100%;box-shadow:inset 2px 2px 0 rgba(0,0,0,.12)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:#fbf3df;color:var(--ink);padding:5px 10px;font-size:.88rem;border-radius:2px}
.seg button.on{background:var(--wood);border-color:var(--wood-deep);color:var(--parch)}
.seg button small{opacity:.75;margin-left:3px}
.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.ing{border:2px solid var(--line);background:#fbf3df;color:var(--ink);border-radius:2px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;line-height:1.1;text-align:center}
.ing canvas{width:48px;height:48px}
@media (min-width:820px) and (max-resolution:1.5dppx){.ing canvas{width:64px;height:64px}}
.ing small{color:var(--muted);font-size:.7rem}
.ing.on{border-color:var(--tomato);background:#fff;box-shadow:inset 0 0 0 2px var(--tomato)}
.analysis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.qbig{font-family:var(--f-lcd);font-size:3rem;line-height:.9}
.meter{height:10px;background:#dccaa0;border:1px solid var(--ink)}
.meter span{display:block;height:100%}
.segbars{display:flex;flex-direction:column;gap:5px}
.segbar{display:grid;grid-template-columns:78px 1fr 28px;align-items:center;gap:6px;font-size:.82rem}
.notes{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.inglist{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:4px}
.inglist td{padding:2px 0;border-bottom:1px dashed var(--line)}
.inglist td+td{text-align:right;white-space:nowrap;padding-left:10px;font-variant-numeric:tabular-nums}
.note{font-size:.82rem;border:1px solid var(--line);padding:3px 8px;background:#fbf3df}
.note.bad{background:#f6d7cf;border-color:#d99a8d;color:#7c1f13}
.note.good{background:#dcefd3;border-color:#9dc48d;color:#1f5a1d}
.note.combo{background:#ffe9a8;border-color:#d8b04a;color:#5d3f00}
details.book summary{cursor:pointer;font-family:var(--f-pixel);font-size:.8rem}
.book ul{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.book li{font-size:.84rem;background:#fbf3df;border:1px solid var(--line);padding:6px 9px}
.book li b{display:block}
.book li.unk{color:var(--muted)}

/* Menu */
.menu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.mcard{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:start}
.mcard canvas{width:86px;height:86px}
.mcard h3{overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto auto;justify-content:start;gap:2px 12px;font-size:.88rem;margin:6px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-lcd);font-size:1.25rem;line-height:1.05;font-variant-numeric:tabular-nums}   /* VT323: clear digits */
.price{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.price b{font-family:var(--f-lcd);font-weight:400;font-size:1.7rem;min-width:84px;text-align:center;background:var(--marble);color:var(--blue);border:2px solid var(--wood-deep);line-height:1.1}
.price button{width:32px;height:32px;padding:0;font-size:1rem}
.empty{border:3px dashed var(--brass-lo);padding:22px;text-align:center;color:var(--on-wood);background:rgba(0,0,0,.15)}

/* Day */
.dayview{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:820px){.dayview{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.room canvas{display:block;width:100%}
.frame.room{position:relative}
.rscroll{overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:thin}
.rscroll canvas{width:auto;max-width:none}
.rzoom{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:2}
.rzoom .btn{min-width:40px;font-size:1.2rem;padding:4px 0;opacity:.92}
.lcd{margin:0;background-color:var(--lcd-bg);background-image:repeating-linear-gradient(rgba(140,255,115,.05) 0 1px,transparent 1px 3px);color:var(--lcd);font-family:var(--f-lcd);font-size:19px;line-height:1.08;padding:10px 12px;white-space:pre;overflow-x:auto;text-shadow:0 0 6px rgba(140,255,115,.45);min-height:100%}
.lcd .dim{color:var(--lcd-dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.news{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.news li{border-left:4px solid var(--brass-lo);padding-left:9px}
.news li:first-child{font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--on-wood)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;background:var(--c);border:1px solid var(--wood-deep);margin-right:5px;vertical-align:-1px}
.banner{background:var(--lcd-bg);border:3px solid var(--brass);color:var(--cheese);font-family:var(--f-lcd);font-size:1.25rem;line-height:1.15;padding:8px 12px}

/* Shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.shop .card{display:flex;flex-direction:column;gap:8px}
.shop .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-family:var(--f-pixel);font-size:.62rem;background:var(--wood);color:var(--parch);padding:2px 6px}

/* Contest */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pick{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:3px solid var(--wood-lo);background:var(--parch);color:var(--ink);padding:8px}
.pick canvas{width:54px;height:54px}
.pick.on{border-color:var(--tomato);box-shadow:inset 0 0 0 2px var(--tomato)}
.pick b{display:block;overflow-wrap:anywhere}
.pick .sub{color:var(--blue)}
#view>.stack>.card>h2,#view>.stack>.card>h3,#view .card h2{color:var(--blue);text-shadow:1px 1px 0 #000}
table.rank{width:100%;border-collapse:collapse;font-size:.92rem}
table.rank td{padding:6px 4px;border-bottom:1px dashed var(--line)}
table.rank td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
table.rank tr.me td{color:var(--tomato-lo);font-weight:700}
/* sales history: profit bars by day, up for a profit and down for a loss */
.hbars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;height:150px;margin-top:8px}
.hb{display:grid;grid-template-rows:1fr 1fr 15px;min-width:0}
.hbars.nl .hb{grid-template-rows:1fr 0 15px}
.hb .u,.hb .d{display:flex;flex-direction:column;border-left:0}
.hb .u{justify-content:flex-end;border-bottom:2px solid var(--line)}
.hb i{display:block;width:100%;min-height:2px}
.hb i.pos{background:var(--good)}.hb i.neg{background:var(--bad)}
.hb span{font-size:.62rem;text-align:center;color:var(--muted);overflow:hidden}
table.sales th{font:inherit;font-size:.8rem;color:var(--muted);text-align:right;padding:0 4px;font-weight:400}
table.sales td{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.sales td:first-child{text-align:left;white-space:normal;font-weight:400}
table.sales td:first-child i{display:block;height:4px;margin-top:3px;background:var(--tomato)}

/* Nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(var(--wood-hi),var(--wood) 25%,var(--wood-lo));border-top:4px solid var(--wood-deep);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
#nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:7px}
#nav button{font-family:var(--f-pixel);font-size:.6rem;text-transform:uppercase;color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 3px 0 var(--wood-deep)}
#nav button svg{width:20px;height:20px}
#nav button.on{background:linear-gradient(var(--brass-lo),var(--brass) 60%,var(--brass-hi));transform:translateY(2px);box-shadow:inset 2px 2px 0 rgba(0,0,0,.3),0 1px 0 var(--wood-deep)}
#nav button.go{background:linear-gradient(var(--tomato-hi),var(--tomato) 45%,var(--tomato-lo));color:#fff1d2;border-color:#3a0c06}
#nav button.go.on{background:linear-gradient(var(--tomato-lo),var(--tomato))}

/* Pantry (Shop > Pantry) and the demand curve in the Menu */
.stockrows{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:#fbf3df;border:2px solid var(--line);padding:6px 8px;color:var(--ink)}
.srow canvas{width:36px;height:36px;image-rendering:pixelated}
.srow .nm{font-size:.9rem;line-height:1.15}.srow .nm small{display:block;color:var(--muted);font-size:.75rem}
.srow .bx{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;grid-column:2/-1}
.srow.low{border-color:var(--bad)}.srow.mid{border-color:#d39b12}
.modepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.modepick button{all:unset;cursor:pointer;border:2px solid var(--line);background:#fbf3df;color:var(--ink);padding:10px;display:flex;flex-direction:column;gap:4px}
.modepick button b{font-family:var(--f-pixel);font-size:.8rem}.modepick button span{font-size:.82rem;color:var(--muted)}
.modepick button[aria-pressed=true]{border-color:var(--tomato);box-shadow:0 0 0 2px var(--tomato)}
.dcurve{width:100%;height:84px;display:block;margin-top:6px;background:#fbf3df;border:1px solid var(--line)}
.dctext{font-size:.8rem;color:var(--muted);display:block;margin-top:3px}
/* Room editor (Shop > Decorate the room) */
.roomed{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
@media (min-width:1000px){.roomed{grid-template-columns:minmax(0,1fr) 360px}}
#redit{touch-action:none;cursor:crosshair}
.rhint{font-size:.85rem;color:#d9bf8e;margin:10px 2px 0}
.lcd .warn{color:#ffb04a;white-space:normal}
.segs{display:grid;grid-template-columns:auto 1fr 2.2em;gap:6px 10px;align-items:center;margin-top:12px;font-size:.85rem}
.segs h3{grid-column:1/-1;margin:0}
.segs .bar{height:12px;border:2px solid var(--ink);background:#e6d3a8}.segs .bar b{display:block;height:100%}
.segs .v{font-family:var(--f-lcd);font-size:1.2rem;text-align:right;line-height:1}
.rtabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.rtabs button{border:2px solid var(--line);background:#fbf3df;color:var(--ink);padding:5px 9px;font-family:var(--f-pixel);font-size:.6rem;text-transform:uppercase;border-radius:2px}
.rtabs button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--parch)}
.rcat{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;max-height:520px;overflow:auto;padding:2px}
.rcat .it{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);background:#fbf3df;color:var(--ink);padding:6px 4px 5px;text-align:center;font-size:.76rem;line-height:1.1}
.rcat .it[aria-pressed=true]{border-color:var(--tomato);box-shadow:0 0 0 2px var(--tomato)}
.rcat .it.poor{opacity:.55}
.rcat .it canvas{height:48px;width:auto;max-width:92px;image-rendering:pixelated}
.rcat .it .p{font-family:var(--f-lcd);font-size:1.1rem;line-height:1}
.chip{font-family:var(--f-pixel);font-size:.5rem;text-transform:uppercase;color:#fff;padding:2px 4px;line-height:1}
.selbox{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line)}
/* Install invitation: a bar just above the bottom buttons */
#instask{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  background:var(--parch);color:var(--ink);border:3px solid var(--wood-deep);box-shadow:0 0 0 2px var(--wood-hi),0 4px 0 rgba(0,0,0,.3);padding:8px 10px;font-size:.9rem;text-align:center}
/* Modal + toast */
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,8,2,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--parch);color:var(--ink);border:3px solid var(--wood-deep);box-shadow:inset 0 0 0 3px var(--parch-2),0 0 0 4px var(--wood-hi),0 0 0 9px var(--wood-lo);max-width:520px;width:calc(100% - 18px);max-height:calc(100% - 30px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
#modal ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.95rem}
.pl span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pl .tot{border-top:2px solid var(--ink);padding-top:4px;font-size:1.05rem}
.quote{background:#fbf3df;border:1px solid var(--line);padding:8px 12px;font-size:.92rem}
.quote small{display:block;font-family:var(--f-pixel);color:var(--muted);font-size:.6rem;text-transform:uppercase}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--lcd-bg);color:var(--lcd);border:3px solid var(--brass);font-family:var(--f-lcd);font-size:1.2rem;line-height:1.1;padding:8px 14px;max-width:calc(100% - 32px);text-align:center;text-shadow:0 0 6px rgba(140,255,115,.45)}
@media (prefers-reduced-motion:no-preference){#toast{animation:pop .2s steps(3)}@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}}
</style>

function analyze(p){
  // portion(): grated/chopped = 0.7 of a portion (and of the cost); a grated-cheese handful = 1.5, it covers much more.
  const cnt={};let n=0,cost0=0;for(const x of p.pieces){cnt[x.i]=(cnt[x.i]||0)+1;const w=portion(x);n+=w;cost0+=ingC(x.i)*w}
  n=Math.round(n*10)/10;
  const ids=Object.keys(cnt),d=ids.length,grated=p.pieces.filter(x=>x.g).length;
  const D=DOUGHS[p.dough],S=SAUCES[p.sauce],notes=[];
  const note=(type,k)=>notes.push([type,t('n.'+k),I18N.en['q.'+k]?t('q.'+k):undefined]);
  let q=45+{fina:3,napo:5,alta:2,integral:3,sem_gluten:1,lenta:7,recheado:3}[p.dough];
  if(p.sauce==='sem'){q-=12;note('bad','dry')}else q+={tomate:5,natas:2,pesto:4,barbecue:3,arrabbiata:5,azeite_alho:3,trufa:6,pimentos:4}[p.sauce];
  if(n<6){q-=25;note('bad','empty')}
  else if(n<14){q-=(14-n)*1.5;note('bad','few')}
  else if(n>150){q-=(n-150)*.8;note('bad','heavy')}   // demo: generous before it counts as overloaded
  else note('good','good');
  if(n>0&&!ids.some(i=>ING[i].t.includes('queijo'))){q-=10;note('bad','nocheese')}
  if(d===1){q-=5;note('bad','mono')}
  q+=Math.min(d,5)*2;
  if(p.pieces.length>=8){const qd=[0,0,0,0];for(const x of p.pieces)qd[(x.x>=0?1:0)+(x.y>=0?2:0)]+=x.g?1.4:1;const ratio=Math.min(...qd)/Math.max(...qd);q-=(1-ratio)*14;if(ratio<.4)note('bad','uneven');else if(grated>=4&&ratio>=.7)note('good','grated')}
  const has=k=>k.startsWith('s:')?p.sauce===k.slice(2):(cnt[k]||0)>=2;
  const combos=COMBOS.filter(c=>c.req.every(has));
  const segMod={estudante:0,familia:0,turista:0,gourmet:0};
  for(const c of combos){q+=c.q;for(const k in c.seg)segMod[k]+=c.seg[k];notes.push(c.q>=0?['combo',t('n.combo',{x:c.n})]:['bad',t('n.clash',{x:c.n}),c.quote])}
  if(n>0)q+=sup().q;   // the supplier's quality
  q=clamp(Math.round(q),0,100);
  const cost=D.c+S.c+cost0;
  const tags=[...ids.flatMap(i=>[...ING[i].t,...(CASA.has(i)?['casa']:[]),...(EXOTIC.has(i)?['exotico']:[])]),...S.t,...D.t];
  const appeal={};
  const wk=state?weekly():null,wb=wk?((cnt[wk.ing]||0)>=2?WEEK_BONUS.ing:0)+((cnt[wk.low]||0)>=2?WEEK_BONUS.low:0)+(combos.includes(wk.combo)?WEEK_BONUS.combo:0):0;
  for(const k in SEG){let tw=wb;for(const t of tags)tw+=SEG[k].w[t]||0;tw=clamp(tw,-20,18);let a=q+tw+SEG[k].dough[p.dough]+segMod[k];if(k==='gourmet'&&n>34)a-=8;if(k==='estudante'&&n>=24)a+=3;appeal[k]=clamp(Math.round(a),0,100)}
  return {q,cost:r2(cost),appeal,notes,combos:combos.map(c=>c.id),n,d,cnt,ids};
}

function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}
const ATL={img:new Image(),ok:false};
const atlasReady=new Promise(res=>{ATL.img.onload=()=>{ATL.ok=true;res()};ATL.img.onerror=()=>res();ATL.img.src=ATLAS.src});
const PZ=ATLAS.pizza,PR=PZ/2;
/* A turning piece is one image (<id>_n) turned by whole quarter turns, so no pixel is lost;
   the shadow is added after turning so it always falls down-right, like the generator's drop(). */
const turnedCache=new Map();
function turned(id,q){
  const key=id+q;if(turnedCache.has(key))return turnedCache.get(key);
  const f=ATLAS.frames[id+'_n'],sw=f[2],sh=f[3],w=q%2?sh:sw,h=q%2?sw:sh;
  const mk=(a,b)=>{const cv=document.createElement('canvas');cv.width=a;cv.height=b;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;return [cv,c]};
  const [rc,r]=mk(w,h);
  r.setTransform(...[[1,0,0,1,0,0],[0,1,-1,0,w,0],[-1,0,0,-1,w,h],[0,-1,1,0,0,h]][q]);
  r.drawImage(ATL.img,f[0],f[1],sw,sh,0,0,sw,sh);
  const [shc,shx]=mk(w,h);shx.drawImage(rc,0,0);shx.globalCompositeOperation='source-in';shx.fillStyle='rgba(60,10,4,.43)';shx.fillRect(0,0,w,h);
  const [oc,o]=mk(w+2,h+2);o.drawImage(shc,2,2);o.drawImage(rc,0,0);
  turnedCache.set(key,oc);return oc;
}
function sprSrc(key){
  const m=/^(.+)_q(\d)$/.exec(key);
  if(m){const cv=turned(m[1],+m[2]);return [cv,0,0,cv.width,cv.height]}
  const f=ATLAS.frames[key];return f?[ATL.img,...f]:null;
}
function spr(c,key,x,y,alpha){
  if(!ATL.ok)return;const src=sprSrc(key);if(!src)return;
  const [img,sx,sy,w,h]=src;
  if(alpha!=null)c.globalAlpha=alpha;c.drawImage(img,sx,sy,w,h,Math.round(x-w/2),Math.round(y-h/2),w,h);c.globalAlpha=1;
}
// icons and bowls: a piece bigger than the box (the whole lobster) is shrunk to fit; the rest keep their pixels
function sprFit(c,key,x,y,box){
  if(!ATL.ok)return;const src=sprSrc(key);if(!src)return;
  const [img,sx,sy,w,h]=src,k=Math.min(1,box/Math.max(w,h));if(k===1)return spr(c,key,x,y);
  c.save();c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(img,sx,sy,w,h,Math.round(x-w*k/2),Math.round(y-h*k/2),w*k,h*k);c.restore();
}
const canGrate=id=>!!ATLAS.frames[id+'_g0'];
const turns=id=>ATLAS.frames[id+'_n']?(ING[id].rot||1):1;
const canRotate=id=>turns(id)>1;
const pieceVar=x=>(x.v!=null?x.v:Math.floor(x.r*7))%3;
const pieceAng=x=>(x.a!=null?x.a:pieceVar(x))%turns(x.i);
const wholeKey=(id,v,a)=>ATLAS.frames[id+'_n']?id+'_q'+(a%turns(id)):id+'_'+v;
const pieceKey=x=>x.g&&canGrate(x.i)?x.i+'_g'+pieceVar(x):wholeKey(x.i,pieceVar(x),pieceAng(x));
/* Pizza at the logical 170 px scale: sauce, toppings, then the crust ring on top so pieces tuck under the rim. */
function composePizza(p){
  const cv=document.createElement('canvas');cv.width=cv.height=PZ;const c=cv.getContext('2d');
  spr(c,'sauce_'+p.sauce,PR,PR);
  c.save();circ(c,PR,PR,PR-1);c.clip();   // big pieces (a lobster, cheese slices) never poke out past the crust
  p.pieces.forEach(x=>spr(c,pieceKey(x),PR+x.x*PR,PR+x.y*PR));   // in the order they were put: the last one sits on top
  c.restore();
  spr(c,'crust_'+p.dough,PR,PR);
  return cv;
}
function drawMini(cv,p,size){const c=fitCanvas(cv,size,size);c.clearRect(0,0,size,size);c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(composePizza(p),0,0,size,size)}

/* ---- the pizza bench: a 320x200 logical screen, scaled by whole numbers ---- */
// normal bench 320x200 (pizza + bowls + LCD); zoom: only the pizza, as wide as the screen, with the controls as text below
let BW=320,BH=222,PX=12,PY=37,OY=22;   // OY: strip on top for the pizza's name                         // pizza top-left on the bench
let PCX=PX+PR,PCY=PY+PR;
function benchLayout(){if(state.zoom){BW=PZ+8;BH=PZ+36;PX=4;PY=32;OY=32}else{BW=320;BH=222;PX=12;PY=37;OY=22}PCX=PX+PR;PCY=PY+PR}   // zoom: same pizza size, a strip of marble on top for the pizza's name
const BOWLS=[{g:0,x:227,y:26},{g:1,x:227,y:94}];       // bowl sprite top-left (58x40)
const BOWL_W=58,BOWL_H=40;
let pz=null;
function benchScale(){
  // whole-number zoom when it fits (x1, x2); below 320 px it shrinks to fit the phone
  const st=$('.stage'),cs=getComputedStyle(st),wide=window.innerWidth>=1000;
  const avail=$('.kitchen').clientWidth-(wide?320:0)-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-12;
  if(state.zoom)return Math.min(avail,560)/BW;   // zoom: fill the width (phones), capped on big screens
  return avail<BW?avail/BW:Math.min(2,Math.floor(avail/BW));
}
function setupPizzaCanvas(){
  const cv=$('#pz');benchLayout();cv.width=BW;cv.height=BH;
  const k=benchScale();cv.style.width=BW*k+'px';cv.style.height=BH*k+'px';
  const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
  pz={cv,c,pizza:null,ghost:null};drawDraft();
  let down=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();const lx=(e.clientX-r.left)/r.width*BW,ly=(e.clientY-r.top)/r.height*BH;return {lx,ly,x:(lx-PCX)/PR,y:(ly-PCY)/PR}};
  const bowlAt=p=>!state.zoom&&BOWLS.find(b=>p.lx>=b.x-6&&p.lx<=b.x+BOWL_W+6&&p.ly-OY>=b.y-4&&p.ly-OY<=b.y+BOWL_H+16);
  cv.oncontextmenu=e=>{e.preventDefault();const p=pos(e);if(Math.hypot(p.x,p.y)<=1&&canRotate(state.sel))rotatePiece()};   // right-click: turn the next piece
  cv.onpointerdown=e=>{
    if(e.button!==0)return;
    const p=pos(e),b=bowlAt(p);
    if(b){setCut(b.g);return}
    if(Math.hypot(p.x,p.y)>1)return;
    down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}
    pz.ghost=null;if(addPiece(p))last=p;
  };
  cv.onpointermove=e=>{
    const p=pos(e);
    if(down){if(!last||Math.hypot(p.x-last.x,p.y-last.y)>.2){if(addPiece(p))last=p}return}
    if(e.pointerType==='mouse'){const g=Math.hypot(p.x,p.y)<=.8?p:null;cv.style.cursor=bowlAt(p)?'pointer':g?'none':'default';if(g||pz.ghost){pz.ghost=g;drawBench()}}
  };
  cv.onpointerup=cv.onpointercancel=()=>{down=false;last=null};
  cv.onpointerleave=()=>{if(pz&&pz.ghost){pz.ghost=null;drawBench()}};
}
function setCut(g){
  if(g&&!canGrate(state.sel)){toast(t('k.nograte.'+noCutKind(state.sel),{x:ING[state.sel].n}));return}
  if(!g&&!curCut()&&canRotate(state.sel)){rotatePiece();return}   // tapping whole again (its picture or bowl) turns the next piece
  state.cut=g?'g':'w';drawBench();save();
}
const curAng=()=>((state.rot||{})[state.sel]||0)%turns(state.sel);
/* Rotate: turns the next piece only; pieces already on the pizza stay as they were put. */
function rotatePiece(){
  const id=state.sel;
  if(!canRotate(id)){toast(t('k.norotate',{x:ING[id].n}));return false}
  state.rot={...state.rot,[id]:(curAng()+1)%turns(id)};drawBench();save();return true;
}
// why an ingredient has no chopped form: it is drizzled, it is spread, or it is already small
const noCutKind=id=>['nutella','maionese','natas_azedas','catupiry'].includes(id)?'spread':['milho','pinhoes','batata_palha','grao'].includes(id)?'small':'drizzle';
const curCut=()=>state.cut==='g'&&canGrate(state.sel)?1:0;
function benchText(c,s,x,y,col='#2c1a0b',hl='rgba(255,255,255,.55)'){c.font='8px Silkscreen, monospace';c.textAlign='center';c.textBaseline='top';c.fillStyle=hl;c.fillText(s,x,y+1);c.fillStyle=col;c.fillText(s,x,y)}
function pxRect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,1);c.fillRect(x,y+h-1,w,1);c.fillRect(x,y,1,h);c.fillRect(x+w-1,y,1,h)}
function drawBench(){
  if(!pz)return;const c=pz.c,d=state.draft,sel=state.sel,cut=curCut();
  c.clearRect(0,0,BW,BH);
  spr(c,'marble',BW/2,BH-100);if(BH>200)spr(c,'marble',BW/2,100);   // the slab is 320x200: a second copy fills a taller bench
  // pizza and its shadow on the marble
  c.fillStyle='rgba(40,30,20,.32)';c.beginPath();c.ellipse(PCX+3,PCY+4,PR+1,PR,0,0,Math.PI*2);c.fill();
  if(!pz.pizza)pz.pizza=composePizza(d);
  c.drawImage(pz.pizza,PX,PY);
  if(pz.ghost){const mid=CENTRED.has(sel)&&!cut;spr(c,cut?sel+'_g0':wholeKey(sel,0,curAng()),PCX+(mid?0:pz.ghost.x)*PR,PCY+(mid?0:pz.ghost.y)*PR,.6)}
  {   // the name of the pizza being made, dark title on the marble strip on top (like the menu cards)
    // one line at full size if it fits; otherwise two lines, shrinking only if two are still not enough
    const nm=(isNewName(d.name)?t('k.newname'):d.name).toUpperCase(),F=f=>{c.font=`bold ${f}px Silkscreen, monospace`};
    let fs=11,lines=[nm];F(fs);
    if(c.measureText(nm).width>BW-8)for(fs=10;fs>=6;fs--){F(fs);lines=wrapLines(c,nm,BW-8);if(lines.length<=2&&lines.every(l=>c.measureText(l).width<=BW-8))break}
    lines=lines.slice(0,2);
    c.textAlign='center';c.textBaseline='middle';c.fillStyle='#2c1a0b';
    lines.forEach((l,i)=>c.fillText(l,BW/2,OY/2+1+(i-(lines.length-1)/2)*(fs+1)))}
  if(state.zoom){zoomBar();return}
  c.save();c.translate(0,OY);   // the right column sits below the title strip
  // right side: ingredient name plate and two bowls (whole / grated)
  const cx=BOWLS[0].x+BOWL_W/2;
  // name plate grows with the name (long names like "Salsicha italiana"), up to the bench edge
  const label=ING[sel].n.toUpperCase();c.font='8px Silkscreen, monospace';
  const hw=Math.min(BW-cx-3,Math.max(46,Math.ceil(c.measureText(label).width/2)+6));
  c.fillStyle='#4a260f';c.fillRect(cx-hw,6,hw*2,13);c.fillStyle='#e3b34a';c.fillRect(cx-hw+1,7,hw*2-2,11);c.fillStyle='#fbe39a';c.fillRect(cx-hw+1,7,hw*2-2,1);
  benchText(c,label,cx,9,'#3a2706','rgba(251,227,154,.8)');
  for(const b of BOWLS){
    const on=b.g===cut,ok=!b.g||canGrate(sel),bx=b.x+BOWL_W/2,by=b.y+13;
    if(on){pxRect(c,b.x-5,b.y-4,BOWL_W+10,BOWL_H+18,'#3a2706');pxRect(c,b.x-4,b.y-3,BOWL_W+8,BOWL_H+16,'#e3b34a');pxRect(c,b.x-3,b.y-2,BOWL_W+6,BOWL_H+14,'#94661a')}
    spr(c,'bowl',bx,b.y+BOWL_H/2);
    if(ok){if(!b.g&&canRotate(sel))sprFit(c,wholeKey(sel,0,curAng()),bx,by+1,44);else if(b.g&&BIG_SHRED.has(sel)){c.save();c.beginPath();c.ellipse(bx,by+1,26,13,0,0,Math.PI*2);c.clip();spr(c,sel+'_g0',bx,by+2);c.restore()}   // the big cheese handful, kept inside the bowl
    else if(!b.g&&ATLAS.frames[sel+'_0'][2]>36)sprFit(c,sel+'_0',bx,by+1,40);   // one big piece (beef, a cheese slice) fills the bowl alone
    else{const k=b.g?v=>sel+'_g'+v:v=>sel+'_'+v;spr(c,k(1),bx-9,by-1);spr(c,k(2),bx+9,by);spr(c,k(0),bx,by+2)}}
    benchText(c,t(b.g?(ok?(ING[sel].t.includes('queijo')?'bench.grated':'bench.chopped'):'bench.nograte.'+noCutKind(sel)):'bench.whole'),bx,b.y+BOWL_H+3,on?'#2c1a0b':'#6c5233');
  }
  // little LCD with portions and quality
  const a=analyze(d),lx=BOWLS[0].x-13,ly=154,lw=BOWL_W+26;   // wide enough for 'PREÇO $10.00'
  c.fillStyle='#2a1407';c.fillRect(lx-2,ly-2,lw+4,44);c.fillStyle='#081008';c.fillRect(lx,ly,lw,40);
  c.font='8px Silkscreen, monospace';c.textBaseline='top';c.fillStyle='#8cff73';
  c.textAlign='left';c.fillText(t('bench.c'),lx+3,ly+3);c.fillText(t('bench.n'),lx+3,ly+15);c.fillText(t('bench.w'),lx+3,ly+27);
  c.textAlign='right';c.fillText(eur(a.cost),lx+lw-3,ly+3);c.fillText(String(d.pieces.length),lx+lw-3,ly+15);c.fillText(fmtG(pizzaGrams(d)),lx+lw-3,ly+27);c.restore();   // top line: what the pizza costs to make (dough, sauce and toppings)
}
// zoom mode: ingredient name, whole/chopped and the price/pieces line as plain HTML under the pizza
function zoomBar(){const el=$('#zbar');if(!el)return;const sel=state.sel,cut=curCut(),ok=canGrate(sel),a=analyze(state.draft);
  const cutL=t(ok?(ING[sel].t.includes('queijo')?'bench.grated':'bench.chopped'):'bench.nograte.'+noCutKind(sel));

let cleared=null;   // the pizza the bin just cleared: undo on an empty bench brings it back (same draft only)
function drawDraft(){if(!pz)return;pz.pizza=null;drawBench()}
function addPiece(p){
  if(Math.hypot(p.x,p.y)>.8)return false;
  if(state.draft.pieces.length>=300){toast(t('k.full'));return false}   // demo limit
  const mid=CENTRED.has(state.sel)&&!curCut(),ps=state.draft.pieces,lp=ps[ps.length-1];
  if(mid&&lp&&lp.i===state.sel&&!lp.g)return false;   // a drag would pile lobsters up: one at a time
  const piece={i:state.sel,x:mid?0:+p.x.toFixed(3),y:mid?0:+p.y.toFixed(3),r:+(Math.random()*6.28).toFixed(2),v:Math.floor(Math.random()*3)};

}

/* ---- simulation ---- */
/* ---- stock: toppings bought by weight and kept in the pantry (nothing spoils). The dough and the sauce are
   always there, paid pizza by pizza. In tiers 1 and 2 (see below) whatever is missing is bought on the
   spot at MANAGER_MARKUP; buying it yourself is cheaper the more days you buy at once, but a pizza whose
   toppings ran out can't be made that day. state.stock[id] = {g: grams, v: what they cost}. ---- */
const MANAGER_MARKUP=1.25,BULK={1:0,3:.15,7:.25};
/* Who runs the pizzeria (state.tier), for a game that children can play:
   1 the manager runs everything: buys toppings as needed (+25%), sets each pizza's price to the best of the
     demand curve every morning and hires pizzaiolos when the kitchen is short. Paid TIER_FEE[1] a day.
   2 a buyer keeps the pantry: every morning, when a topping has less than a day left, it is topped up for
     state.restockDays (1, 3 or 7) days at that bulk price; anything still missing is bought on the spot. The
     player runs prices, staff and the room. Paid TIER_FEE[2] a day.
   3 the player runs everything; the pantry can run out (sold out), with buttons to buy for 1, 3 or 7 days.
   (Several suppliers, cheaper or better, are an idea for later: docs/ideas.md.) */
const TIER_FEE={1:15,2:8,3:0};
const gramPrice=id=>ingC(id)/(GRAMS[id]||10);   // $ per gram, the cost per portion spread over its weight
function pizzaNeeds(p){const n={};for(const x of p.pieces)n[x.i]=(n[x.i]||0)+pieceGrams(x);return n}
const baseCostOf=p=>DOUGHS[p.dough].c+SAUCES[p.sauce].c;
// how many pizzas a day to plan for, and how they split over the menu (yesterday's sales, or an even split)
function salesPlan(){const tot=Object.values(state.lastSales||{}).reduce((a,b)=>a+b,0),E=tot||Math.min(capacity(),Math.max(20,roomA().seats*2.4));
  return state.menu.map(p=>({p,n:tot?(state.lastSales[p.id]||0)*E/tot:E/Math.max(1,state.menu.length)}))}
function dailyNeed(){const need={};for(const {p,n} of salesPlan())for(const [id,g] of Object.entries(pizzaNeeds(p)))need[id]=(need[id]||0)+g*n;return need}
function fillStock(d,onlyLow){   // buy every topping the menu uses up to d days; onlyLow: only those under a day
  const need=dailyNeed();let cost=0;
  for(const id in need){const have=(state.stock[id]||{}).g||0;if(onlyLow&&have>=need[id])continue;const g=Math.max(0,need[id]*d-have),c=r2(Math.ceil(g/10)*10*gramPrice(id)*(1-(BULK[d]||0)));
    if(g<=0||state.money<c)continue;state.money=r2(state.money-buyStock(id,g,d));cost+=c}
  return r2(cost)}
const fillCost=d=>{const need=dailyNeed();return r2(Object.keys(need).reduce((a,id)=>a+Math.ceil(Math.max(0,need[id]*d-((state.stock[id]||{}).g||0))/10)*10*gramPrice(id)*(1-BULK[d]),0))};
// the morning, before the doors open: what the manager or the buyer does on their own (news lines)
function managerMorning(){
  const s=state,news=[];
  if(s.tier===1){
    const was=s.menu.map(p=>p.price);
    for(let pass=0;pass<2;pass++)for(const p of s.menu){const pts=demandCurve(p),best=pts.reduce((a,b)=>b.profit>a.profit?b:a),np=Math.max(r2(analyze(p).cost+1),Math.round(best.price*2)/2);
      p.price=np}
    s.menu.forEach((p,i)=>{if(p.price!==was[i])news.push(t('mg.price',{x:p.name,p:eur(p.price)}))});
    const want=Math.min(expectedCustomers()*.85,roomA().seats*2.6);
    while(s.cooks<5&&capacity()<want&&s.cooks*COOK_CAP<s.ovens*OVEN_CAP&&s.money>=100){s.cooks++;s.money=r2(s.money-100);news.push(t('mg.hire'))}
  }
  if(s.tier===2){const c=fillStock(s.restockDays||3,true);if(c)news.push(t('mg.stock',{x:eur(c),d:s.restockDays}))}
  if(news.length)s.news=[...news,...s.news].slice(0,8);
  return news;
}
const stockDays=id=>{const d=dailyNeed()[id];return d?((state.stock[id]||{}).g||0)/d:Infinity};
function buyStock(id,grams,days){const g=Math.ceil(grams/10)*10;if(g<=0)return 0;const cost=r2(g*gramPrice(id)*(1-(BULK[days]||0)));
  const st=state.stock[id]||(state.stock[id]={g:0,v:0});st.g+=g;st.v=r2(st.v+cost);return cost}

function simulateDay(){
  const s=state,menuA=s.menu.map(p=>({p,a:analyze(p),need:pizzaNeeds(p),base:baseCostOf(p)})),mix=segMix(),cap=capacity(),r=s.rival;
  const N=expectedCustomers();const TH=4.2,REGULARS=.45,CURIOUS=.2,SLACK=3;const events=[];
  // the room: seats at the tables a waiter can reach, and how much each group likes it
  const RM=roomA(),atm=RM.atm,EAT=.18,WAIT=.04,seatFree=Array(RM.seats).fill(0);let noseat=0;
  // the pantry for today (a copy: the day is applied in finishDay)
  const manual=s.tier===3,stock={};for(const [id,st] of Object.entries(s.stock||{}))stock[id]={g:st.g,v:st.v};
  const canMake=m=>{if(!manual)return true;for(const id in m.need)if(((stock[id]||{}).g||0)<m.need[id]-1e-6)return false;return true};
  let paidBefore=0,bought=0;   // toppings taken from the pantry (already paid) / bought on the spot by the manager
  const useStock=m=>{let v=0;for(const id in m.need){const st=stock[id],want=m.need[id],have=st?Math.min(st.g,want):0;
    if(have>0){const val=st.v*have/st.g;st.v-=val;st.g-=have;v+=val;paidBefore+=val}
    if(want-have>1e-6){const b=(want-have)*gramPrice(id)*MANAGER_MARKUP;v+=b;bought+=b}}return v};
  // customers come in two rushes, lunch and dinner, and a few in between
  const g=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
  const arrivals=Array.from({length:N},()=>{const x=Math.random();return clamp(x<.45?.27+g()*.06:x<.9?.66+g()*.07:Math.random()*.9,.02,.9)}).sort((a,b)=>a-b);
  let served=0,toRival=0,full=0,nostock=0,passed=0,revenue=0,ingCost=0,repDelta=0,happy=0,unhappy=0;const sales={},quotes=[];
  const pickSeg=()=>{let x=Math.random();for(const k in mix){x-=mix[k];if(x<=0)return k}return 'familia'};
  for(let i=0;i<N;i++){
    const seg=pickSeg(),ps=SEG[seg].ps,t=arrivals[i];
    const deco=(atm[seg]-35)/25+(s.rep-2.5)*.3;   // the room's atmosphere for this group, and the reputation
    const opts=menuA.map(m=>{const ap=m.a.appeal[seg];return {m,u:custU(seg,ap,m.p.price,m.a.cost)+noise()+deco}}).sort((a,b)=>b.u-a.u);
    const best=opts.length?opts[0].m:null,bu=opts.length?opts[0].u:-1e9;
    const ra=clamp(r.q+RIVAL_BIAS[seg],0,100);const ru=custU(seg,ra,r.price,baseCost()+1)+noise()+(r.promo?1.5:0);
    const e={t,seg};
    // regulars: about half the street knows you and comes back unless the pizza is poor or overpriced,
    // whatever the rival does; this keeps a beginner's day steady (stable profit on the starter room)
    const regular=Math.random()<REGULARS,bar=regular?TH-2.5:Math.max(ru,TH);
    if(best&&bu>=bar){
      e.target='ours';
      let pk=opts.find(o=>o.u>=bar&&canMake(o.m));   // their favourite, or the next one they'd still have
      // new customers don't know which pizza is the best one: some are curious and pick any pizza that is not far
      // below what they'd accept (CURIOUS of the newcomers, SLACK points under the bar), so a pizza nobody
      // would 'logically' choose still gets a customer or two now and then
      if(!regular&&Math.random()<CURIOUS){const pool=opts.filter(o=>o.u>=bar-SLACK&&canMake(o.m));if(pool.length>1)pk=pool[Math.floor(Math.random()*pool.length)]}
      const m=pk&&pk.m;
      let k=-1;for(let j=0;j<seatFree.length;j++)if(k<0||seatFree[j]<seatFree[k])k=j;   // the seat that frees up first
      if(!m){nostock++;repDelta-=.006;e.out='nostock';if(Math.random()<.3)quotes.push([seg,tx('qt.nostock')])}
      else if(served<cap&&(k<0||seatFree[k]>t+WAIT)){noseat++;repDelta-=.012;e.out='noseat';if(Math.random()<.3)quotes.push([seg,tx('qt.noseat')])}
      else if(served<cap){
        seatFree[k]=Math.max(t,seatFree[k])+EAT;
        served++;revenue+=m.p.price;ingCost+=m.base+useStock(m);sales[m.p.id]=(sales[m.p.id]||0)+1;e.price=m.p.price;
        const ap=m.a.appeal[seg],over=m.p.price-fairPrice(ap,m.a.cost);const sat=ap+noise()*5-Math.max(0,over)*7+(atm[seg]-35)/7;
        if(sat>=62){happy++;repDelta+=.008;e.out='happy';if(Math.random()<.25)quotes.push([seg,happyQuote(seg,m.p.name)])}
        else{unhappy++;repDelta-=.03;e.out='meh';const bad=m.a.notes.find(n=>n[0]==='bad'&&n[2]);quotes.push([seg,over>1.5?tx('qt.dear',{p:eur(m.p.price)}):bad?bad[2]:tx('qt.meh')])}
      }else{full++;repDelta-=.012;e.out='full';if(Math.random()<.3)quotes.push([seg,tx('qt.full')])}
    }else if(ru>=TH){e.target='rival';toRival++;if(best&&Math.random()<.12)quotes.push([seg,tx(r.promo?'qt.promo':best.p.price>r.price+1.5?'qt.cheaper':'qt.taste',{r:r.name})])}
    else{e.target='none';passed++}
    events.push(e);
  }
  events.sort((a,b)=>a.t-b.t);
  for(const id in stock)if(stock[id].g<.5)delete stock[id];
  return {events,served,toRival,full,noseat,nostock,seats:RM.seats,passed,revenue:r2(revenue),ingCost:r2(ingCost),paidBefore:r2(paidBefore),bought:r2(bought),stockAfter:stock,repDelta,happy,unhappy,sales,quotes,N,cap};
}
const QH_N=12;   // happy quotes per customer group: qh.<group>1 … qh.<group>12
function happyQuote(seg,name){return tx('qh.'+seg+(1+Math.floor(Math.random()*QH_N)),{x:name})}

function resolveContest(){
  const day=state.day,th=themeFor(day),p=state.menu.find(x=>x.id===state.contestEntry);if(!p)return null;
  const mine=contestScore(th,p);const base=Math.min(92,50+day*1.1);
  const names=NPCS.filter(n=>n!==state.rival.name).sort(()=>Math.random()-.5).slice(0,3).concat([state.rival.name]);
  const rows=names.map(n=>({n,s:Math.round(base+Math.random()*16-8)}));rows.push({n:'Pizza Magna · '+p.name,s:Math.round(mine.s),me:true,dq:mine.dq});
  rows.sort((a,b)=>b.s-a.s);const pos=rows.findIndex(x=>x.me)+1;
  const prize=[600,250,80][pos-1]||0,rep=[.4,.2,.1][pos-1]||0;
  state.money+=prize;state.rep=clamp(state.rep+rep,0,5);
  state.contestLog.unshift({day,theme:th.id,pizza:p.name,pos,prize});
  return {th,rows,pos,prize,rep,dq:mine.dq};
}
function finishDay(res){
  const s=state,r=s.rival,sal=s.cooks*SALARY;
  const fee=TIER_FEE[s.tier]||0,profit=r2(res.revenue-res.ingCost-RENT-sal-fee);
  s.money=r2(s.money+profit+(res.paidBefore||0));   // toppings from the pantry were paid when bought
  if(res.stockAfter)s.stock=res.stockAfter;const repBefore=s.rep;s.rep=clamp(s.rep+clamp(res.repDelta,-.4,.25),0,5);
  s.lastSales=res.sales;
  // the day goes into the history (HIST_DAYS days kept): pizzas by name, so a pizza taken off the menu keeps its past
  s.hist=[...(s.hist||[]),{d:s.day,n:res.served,N:res.N,rv:res.toRival,p:profit,v:res.revenue,r:+s.rep.toFixed(2),
    s:Object.entries(res.sales).map(([id,n])=>{const m=s.menu.find(x=>x.id===id);return m?[m.name,n,r2(n*m.price)]:null}).filter(Boolean)}].slice(-HIST_DAYS);
  let contest=null;if(s.day%5===0){if(s.contestEntry)contest=resolveContest();s.contestEntry=null}
  s.ads=false;const news=[];
  r.promo=false;
  if(res.served>res.toRival*1.3&&res.served>8){if(Math.random()<.5&&r.price>5){r.price=r2(r.price-.5);news.push(t('nw.cut',{r:r.name,p:eur(r.price)}))}else if(r.q<85){r.q+=4;news.push(t('nw.cook',{r:r.name}))}}
  else if(res.toRival>res.served*1.5&&r.price<9.5){r.price=r2(r.price+.5);news.push(t('nw.raise',{r:r.name,p:eur(r.price)}))}
  if(s.day%4===0&&r.q<85)r.q+=1;
  s.day++;
  if(s.day%6===0){r.promo=true;news.push(t('nw.promo',{r:r.name}))}
  if(s.day%5===0)news.push(t('nw.ct',{x:themeFor(s.day).n}));
  else if(s.day%5===4)news.push(t('nw.ct1',{x:themeFor(s.day+1).n}));
  if(s.day%7===1){const w=weekly(s.day);news.push(t('wk.news',{x:ING[w.ing].n,c:w.combo.n}));news.push(t('wk.newslow',{x:ING[w.low].n}))}
  if(!news.length)news.push(t('nw.q'+(s.day%3+1)));
  s.news=[...news,...s.news].slice(0,8);
  if(s.money<-500)s.over=true;
  const q=res.quotes.sort(()=>Math.random()-.5).filter((x,i,A)=>A.findIndex(y=>y[1]===x[1])===i).slice(0,3);   // no line twice
  return {...res,profit,sal,fee,repBefore,repAfter:s.rep,contest,quotes:q,day:s.day-1};
}

function roomAnalyse(room){

    let ok=false;for(let j=-1;j<=d.h&&!ok;j++)for(let i=-1;i<=d.w&&!ok;i++){const inside=i>=0&&j>=0&&i<d.w&&j<d.h;if(inside&&d.mask[j][i]==='#')continue;if(seen.has((it.r+j)*COLS+it.c+i))ok=true}

  const addApp=(d,w=1)=>{d.app.forEach((v,i)=>sum[i]+=v*w);byStyle[d.style]+=Math.max(30,d.price);spent+=d.price};
  addApp(FLOORS[room.floor],2);addApp(WALLS[room.wall],2);
  for(const it of room.items)addApp(ITEMS[it.id]);for(const w of room.walls)if(w)addApp(ITEMS[w]);

function buildMap(){
  const solid=new Uint8Array(COLS*ROWS),S=(c,r)=>{solid[r*COLS+c]=1};
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(r<2||(r===14&&c!==DOOR[0]&&c!==DOOR[0]+1)||r>15||(r===15&&c!==DOOR[0]&&c!==DOOR[0]+1))S(c,r);
    if(c>=12&&r>=2&&r<=7)S(c,r);
  }
  const room=state.room,RM=roomA(),L_=ROOM_ART.layout.items,seats=[],tables=[];
  for(const it of room.items){const d=ITEMS[it.id];d.mask.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch==='#')S(it.c+i,it.r+j)}));
    if(d.cat!=='table'||RM.blocked.has(it))continue;tables.push(it);
    // each seat of the piece: where its sitter is drawn (atlas layout) and the tile they walk to
    for(const st of L_[it.id].seats)seats.push({t:it,s:st,face:st.d,occ:null,cx:it.c+clamp(Math.floor((st.p[0]+16)/T),0,d.w-1),cy:it.r+clamp(Math.floor((st.p[1]+40)/T),0,d.h-1)});

function bfs(map,from,to){
  const key=(c,r)=>r*COLS+c,goal=key(to[0],to[1]),start=key(from[0],from[1]);

  while(q.length){const k=q.shift();if(k===goal)break;const c=k%COLS,r=(k/COLS)|0;
    for(const [dc,dr] of [[0,1],[1,0],[0,-1],[-1,0]]){const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=COLS||nr>=ROWS)continue;const nk=key(nc,nr);if(prev[nk]!==-1)continue;if(map.solid[nk]&&nk!==goal)continue;prev[nk]=k;q.push(nk)}}
  if(prev[goal]===-1)return [[to[0],to[1]]];
  const out=[];for(let k=goal;k!==start;k=prev[k])out.push([k%COLS,(k/COLS)|0]);return out.reverse();
}

/* Room zoom (the day and the room editor share it): 1 to 3, with the − / + buttons or two fingers. The canvas grows
   inside its scroller (.rscroll), which pans with one finger or the scroll bars; the point under the fingers or
   the middle of the view stays where it is. While pinching only the CSS size changes; the canvas is redrawn sharp
   at the end. */
const RZ={z:1,MIN:1,MAX:3,
  redraw(){if(state.tab==='sala')drawEditor();else if(!anim)drawRoom()},
  set(z,cx,cy){const cv=$('#redit')||$('#room');if(!cv)return;const sc=cv.parentElement,b=sc.getBoundingClientRect();
    z=clamp(Math.round(z*100)/100,RZ.MIN,RZ.MAX);if(z===RZ.z)return;
    const px=cx===undefined?b.width/2:cx-b.left,py=cy===undefined?b.height/2:cy-b.top,k=z/RZ.z;
    const fx=sc.scrollLeft+px,fy=sc.scrollTop+py;RZ.z=z;
    if(state.tab==='sala')edSize();else roomSize();RZ.redraw();
    sc.scrollLeft=fx*k-px;sc.scrollTop=fy*k-py},
  bind(cv){const sc=cv.parentElement;if(sc.dataset.rz)return;sc.dataset.rz=1;let pin=null;
    requestAnimationFrame(()=>{sc.scrollLeft=RZ.sx||0;sc.scrollTop=RZ.sy||0});sc.addEventListener('scroll',()=>{RZ.sx=sc.scrollLeft;RZ.sy=sc.scrollTop},{passive:true});   // keep the view when the screen is redrawn
    const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),
      mid=e=>[(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2];
    sc.addEventListener('touchstart',e=>{if(e.touches.length===2){pin={d:dist(e),z:RZ.z};ED.tap=null}},{passive:true});
    sc.addEventListener('touchmove',e=>{if(!pin||e.touches.length!==2)return;e.preventDefault();const [mx,my]=mid(e);RZ.set(pin.z*dist(e)/pin.d,mx,my)},{passive:false});
    sc.addEventListener('touchend',e=>{if(e.touches.length<2)pin=null});
    sc.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();RZ.set(RZ.z*(e.deltaY<0?1.15:1/1.15),e.clientX,e.clientY)},{passive:false})}};
function roomSize(){
  const cv=$('#room');if(!cv)return null;const b=cv.parentElement.clientWidth;if(!b)return null;cv.parentElement.style.height=Math.round(b*RH/RW)+'px';const w=Math.round(b*RZ.z),h=Math.round(w*RH/RW);
  if(!room||room.cv!==cv||room.w!==w){const low=document.createElement('canvas');low.width=RW;low.height=RH;room={cv,w,h,c:fitCanvas(cv,w,h,3200),low,lc:low.getContext('2d')};RZ.bind(cv)}

}
function spawn(e){
  const left=e.target==='rival'?true:Math.random()<.5,y=STREET_ROW*T+(e.target==='ours'?0:Math.round(Math.random()*16));
  const p={e,x:left?-T:RW,y,look:{body:SEG[e.seg].col,hair:pick(HAIR),skin:pick(SKIN),long:Math.random()<.4},rlook:Math.floor(Math.random()*21),v:88+Math.random()*24,st:'street',path:[],dir:left?'right':'left',ph:Math.random()*4};
  p.path=[{x:e.target==='ours'?DOOR[0]*T:e.target==='rival'?RW+T:(left?RW+T:-T),y}];
  anim.people.push(p);
}
function moveAlong(o,dt,v){
  let d=v*dt;o.walking=false;
  while(d>0&&o.path.length){const t=o.path[0],dx=t.x-o.x,dy=t.y-o.y,L=Math.hypot(dx,dy);o.walking=true;
    if(Math.abs(dx)>.01||Math.abs(dy)>.01)o.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
    if(L<=d){o.x=t.x;o.y=t.y;o.path.shift();d-=L}else{o.x+=dx/L*d;o.y+=dy/L*d;d=0}}
  if(o.walking)o.ph=(o.ph||0)+dt*8;return !o.path.length;
}
function step(dt){
  anim.t+=dt;const ev=anim.res.events,map=anim.map;
  while(anim.next<ev.length&&ev[anim.next].t*DAY_SECONDS<=anim.t){spawn(ev[anim.next]);anim.next++}
  let qi=0;
  for(const p of anim.people){
    if(p.st!=='queue')continue;
    const s=anim.seats.find(s=>!s.occ);
    if(s){s.occ=p;p.seat=s;p.st='toSeat';p.path=toPx(bfs(map,tileOf(p),[s.cx,s.cy]));continue}
    const Q=map.queue.length?map.queue:[DOOR_IN],spot=Q[Math.min(qi++,Q.length-1)];
    if(!p.spot||p.spot[0]!==spot[0]||p.spot[1]!==spot[1]){p.spot=spot;p.path=toPx(bfs(map,tileOf(p),spot))}
    moveAlong(p,dt,p.v);
  }
  for(const p of anim.people){
    switch(p.st){
      case 'street':if(moveAlong(p,dt,p.v)){
        if(p.e.target==='ours'){
          if(p.e.out==='full'||p.e.out==='noseat'||p.e.out==='nostock'){anim.cnt.left++;bubble(p.x+16,p.y-36,p.e.out==='full'?'FILA!':p.e.out==='noseat'?'SEM MESA!':'ESGOTADO!','#ff6a4a');p.st='leave';p.path=[{x:p.x<RW/2?-T:RW+T,y:p.y}]}
          else{p.st='queue';p.spot=null}
        }else{if(p.e.target==='rival'){anim.cnt.rival++;if(Math.random()<.5)bubble(RW-60,p.y-36,'→ RIVAL','#ffb04a')}p.gone=true}
      }break;
      case 'toSeat':if(moveAlong(p,dt,p.v)){p.st='wait';p.dir=p.seat.face;anim.jobs.push(p)}break;
      case 'wait':if(p.served){p.st='eat';p.timer=2.6}break;
      case 'eat':p.timer-=dt;if(p.timer<=0){
        anim.cnt.served++;anim.cnt.rev+=p.e.price;const h=p.e.out==='happy';bubble(p.x+16,p.y-44,'+'+eur(p.e.price)+(h?' ★':''),h?'#8cff73':'#ffd36a');
        const s=p.seat;s.occ=null;p.st='exit';p.path=[...toPx(bfs(map,[s.cx,s.cy],[DOOR[0],STREET_ROW])),{x:Math.random()<.5?-T:RW+T,y:STREET_ROW*T}];
      }break;
      case 'exit':case 'leave':if(moveAlong(p,dt,p.v))p.gone=true;break;
    }
  }
  anim.people=anim.people.filter(p=>!p.gone);
  for(const w of anim.waiters){
    if(anim.jobs.length&&(!w.job||w.phase==='back')){w.job=anim.jobs.shift();w.phase='pick';w.path=toPx(bfs(map,tileOf(w),PICK))}
    if(!w.job){w.walking=false;if(w.dir!=='down'&&!w.path.length)w.dir='down';continue}
    if(w.pause>0){w.pause-=dt;continue}
    if(moveAlong(w,dt,164*(1+Math.min(1.2,anim.jobs.length*.15)))){   // they hurry when tables are waiting: up to 2.2x with 8 or more
      const s=w.job.seat;
      if(w.phase==='pick'){w.carry=true;w.phase='go';w.dir='up';w.pause=.25;w.path=toPx(bfs(map,PICK,[s.cx,s.cy]).slice(0,-1))}
      else if(w.phase==='go'){w.job.served=true;w.carry=false;w.phase='back';w.path=toPx(bfs(map,tileOf(w),w.home))}
      else{w.job=null;w.dir='down'}
    }
  }
  for(const b of anim.bubbles){b.life-=dt;b.y-=dt*18}
  anim.bubbles=anim.bubbles.filter(b=>b.life>0);
  // night falls only once the doors are closed and everyone left inside is on the way out
  const closing=anim.next>=ev.length&&anim.t>=DAY_SECONDS&&anim.people.every(p=>p.st==='exit'||p.st==='leave'||(p.st==='street'&&p.e.target!=='ours'));
  if(closing)anim.dusk=Math.min(1,(anim.dusk||0)+dt/1.5);
  if(closing&&!anim.people.length&&anim.dusk>=1)anim.done=true;
}
function bubble(x,y,text,col){anim.bubbles.push({x,y,text,col,life:1.6})}
function loop(ts){
  if(!anim)return;
  const dt=anim.last?Math.min(.05,(ts-anim.last)/1000):0;anim.last=ts;
  // after closing the clock keeps its pace (anim.after) while the room plays fast, faster the fuller it is,
  // so the last customers are gone around one in the morning instead of hours later
  let k=1;if(anim.t>=DAY_SECONDS){anim.after=(anim.after||0)+dt*anim.speed;k=Math.min(16,3+anim.people.filter(p=>p.st!=='exit'&&p.st!=='leave'&&p.st!=='street').length*.8)}
  step(dt*anim.speed*k);drawRoom();
  if(ts-anim.lcdT>120){anim.lcdT=ts;const l=$('#lcd');if(l)l.innerHTML=lcdText()}
  if(anim.done){endAnim();return}
  requestAnimationFrame(loop);
}

    sc.onload=()=>{RA.img.onload=()=>{if(!anim)drawRoom();if(state.tab==='sala')setupRoomEditor()};RA.img.src=ROOM_ART.src};document.head.append(sc)}

/* ================= DEMAND CURVE (Menu) ================= */
/* The day's choice model run on a fixed sample of customers, moving only this pizza's price: how many would
   pick it, and the profit a day, capped by what the kitchen and the seats can serve. */
function demandCurve(p){
  const menuA=state.menu.map(q=>({p:q,a:analyze(q)})),me=menuA.find(m=>m.p===p),mix=segMix(),atm=roomA().atm,rv=state.rival,N=expectedCustomers(),TH=4.2,REG=.45;
  let sd=12345;const rnd=()=>{sd=sd+0x6D2B79F5|0;let x=Math.imul(sd^sd>>>15,1|sd);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296};
  const nz=()=>(rnd()+rnd()+rnd()-1.5)*1.6,cust=[];
  for(let i=0;i<300;i++){let x=rnd(),seg='familia';for(const k in mix){x-=mix[k];if(x<=0){seg=k;break}}cust.push({seg,n:menuA.map(nz),rn:nz(),reg:rnd()<REG})}
  const cap=Math.min(capacity(),roomA().seats*2.6);   // what the kitchen and the seats can serve in a day
  const lo=Math.max(1,r2(me.a.cost)),hi=Math.max(lo+3,suggestPrice(me.a)*2),pts=[];
  // profit is the whole menu's: a cheaper pizza also takes customers from the other pizzas, and they share the kitchen
  for(let k=0;k<=30;k++){const price=lo+(hi-lo)*k/30,n=menuA.map(()=>0);
    for(const c of cust){const ps=SEG[c.seg].ps,deco=(atm[c.seg]-35)/25+(state.rep-2.5)*.3;let bu=-1e9,bj=-1;
      menuA.forEach((m,j)=>{const pr=m===me?price:m.p.price,ap=m.a.appeal[c.seg],u=custU(c.seg,ap,pr,m.a.cost)+c.n[j]+deco;if(u>bu){bu=u;bj=j}});

/* ================= RECIPES: LINK, FILE, IMPORT ================= */
/* A recipe travels as a code: JSON {n,d,s,c,h,p} (name, dough, sauce, original chef and pizzeria, packed pieces),
   deflated when the browser can, then base64url. "1…" = deflated, "0…" = plain. In a link: …/#p=<code>. */
async function zip(bytes,mode){const st=new Blob([bytes]).stream().pipeThrough(mode?new CompressionStream('deflate-raw'):new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(st).arrayBuffer())}
async function recipeCode(p,name){
  const from=authorOf(p);   // the author stays until someone changes the recipe
  const raw=new TextEncoder().encode(JSON.stringify({n:name,d:p.dough,s:p.sauce,c:from.c,h:from.s,p:packPieces(p.pieces)}));
  if(window.CompressionStream)try{return '1'+b64u.enc(await zip(raw,1))}catch(_){}
  return '0'+b64u.enc(raw)}
async function readRecipe(text){
  text=String(text||'').trim();const m=text.match(/[#&?]p=([0-9A-Za-z_-]+)/);let code=m?m[1]:text;
  if(code.startsWith('{')){const o=JSON.parse(code);code=o.code||''}   // a .pizza file
  let raw=b64u.dec(code.slice(1));if(code[0]==='1')raw=await zip(raw,0);else if(code[0]!=='0')throw 0;
  const o=JSON.parse(new TextDecoder().decode(raw));
  const pieces=unpackPieces(o.p,300);if(!pieces.length)throw 0;
  return {name:String(o.n||'Pizza').slice(0,28),dough:DOUGHS[o.d]?o.d:'napo',sauce:SAUCES[o.s]?o.s:'tomate',pieces,
    from:{c:String(o.c||'?').slice(0,24),s:String(o.h||'').slice(0,32)}}}
const recipeLink=code=>location.href.split('#')[0]+'#p='+code;
const slug=n=>(n.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'pizza');

  if(!p.pieces.length){toast(t('k.needmore'));return}
  const code=await recipeCode(p,name),link=recipeLink(code);shareRecipe.last={code,name,link};
  modal(`<h2>${t('rec.title')}</h2><p class="sub" style="margin:0">${t('rec.lead',{x:esc(name)})}</p>
    <input id="recLink" readonly value="${esc(link)}" style="width:100%" onclick="this.select()">
    <div class="row">${navigator.share?`<button class="btn primary" data-act="recsend">${t('rec.send')}</button>`:''}<button class="btn" data-act="reccopy">${t('rec.copy')}</button><button class="btn" data-act="recfile">${t('rec.file')}</button><button class="btn ghost" data-act="close">${t('share.close')}</button></div>`)}

/* A 1080x1350 card (portrait, fits phone feeds): the pizza in pixel art at x3, the recipe and the site. */
const SITE='www.pizzamagna.xyz';
function recipeIngs(p){const cnt={};for(const x of p.pieces)cnt[x.i]=(cnt[x.i]||0)+1;return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(i=>ING[i].n)}
function wrapLines(c,text,maxW){const out=[];let line='';for(const w of text.split(' ')){const tryL=line?line+' '+w:w;if(c.measureText(tryL).width>maxW&&line){out.push(line);line=w}else line=tryL}if(line)out.push(line);return out}
function shareCard(p,name){
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  for(let y=0;y<H;y+=44){c.fillStyle=(y/44)%2?'#573117':'#4c2a13';c.fillRect(0,y,W,44);c.fillStyle='rgba(20,8,2,.55)';c.fillRect(0,y,W,3)}  // wood planks
  c.fillStyle='#2a1407';c.fillRect(48,48,W-96,H-96);c.fillStyle='#f3e6c6';c.fillRect(60,60,W-120,H-120);c.fillStyle='#e6d3a8';c.fillRect(60,60,W-120,8);
  c.imageSmoothingEnabled=false;
  c.fillStyle='rgba(40,25,10,.25)';c.beginPath();c.ellipse(W/2+10,320+268,262,258,0,0,Math.PI*2);c.fill();
  c.drawImage(composePizza(p),W/2-255,320,510,510);
  c.textAlign='center';
  c.fillStyle='#2c1a0b';c.font='bold 60px Silkscreen, monospace';
  const tl=wrapLines(c,name.toUpperCase(),W-200).slice(0,2);tl.forEach((l,i)=>c.fillText(l,W/2,(tl.length>1?175:205)+i*66));   // recipe name is the headline
  c.font='34px "PM Digits", "Pixelify Sans", sans-serif';c.fillStyle='#6c5233';
  c.fillText(DOUGHS[p.dough].n+' · '+SAUCES[p.sauce].n,W/2,900);
  c.fillStyle='#2c1a0b';c.font='38px "PM Digits", "Pixelify Sans", sans-serif';
  wrapLines(c,recipeIngs(p).join(' · '),W-200).slice(0,3).forEach((l,i)=>c.fillText(l,W/2,970+i*50));
  const by=chefLine(p);if(by){c.fillStyle='#7a4520';c.font='bold 36px "PM Digits", "Pixelify Sans", sans-serif';c.fillText(by,W/2,1138)}
  c.fillStyle='#c4352a';c.fillRect(60,H-170,W-120,110);c.fillStyle='#fff1d2';c.font='bold 40px Silkscreen, monospace';c.fillText(SITE.toUpperCase(),W/2,H-100);
  return cv;
}
async function sharePizza(p,name){
  if(!p.pieces.length){toast(t('k.needmore'));return}
  try{await document.fonts.ready}catch(_){}
  const cv=shareCard(p,name);
  const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
  const file=new File([blob],(name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'pizza')+'.png',{type:'image/png'});
  const url=URL.createObjectURL(blob);
  // on the site: download the photo straight away
  if(window.top===window){const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();toast(t('share.saved',{f:file.name}));return}
  // inside a frame (the Claude bench) downloads are blocked: show the photo so it can be saved by hand
  modal(`<h2>${esc(name)}</h2><img src="${url}" alt="${esc(name)}" style="width:100%;image-rendering:pixelated;border:3px solid var(--wood-deep)">
    <p class="sub" style="margin:0">${t('share.manual')}</p><div class="row"><button class="btn ghost" data-act="close">${t('share.close')}</button></div>`);
}

// the day's sales by pizza: how many, takings and what each one left after its ingredients (best seller first)
function salesTable(r){
  if(!state.menu.length)return '';
  const rows=state.menu.map(p=>{const n=r.sales[p.id]||0,c=analyze(p).cost;return {p,n,v:n*p.price,m:n*(p.price-c)}}).sort((a,b)=>b.n-a.n);
  const top=Math.max(1,rows[0].n);
  return `<h3 style="margin:4px 0 0">${t('rep.sales')}</h3><table class="rank sales"><tr><th></th><th>${t('rep.n')}</th><th>${t('rep.v')}</th><th>${t('rep.m')}</th></tr>${rows.map(x=>`<tr><td>${esc(x.p.name)}<i style="width:${Math.round(x.n/top*100)}%"></i></td><td>${x.n}</td><td>${eur(x.v)}</td><td style="color:${x.m>=0?'var(--good)':'var(--bad)'}">${eur(x.m)}</td></tr>`).join('')}</table>`}

  ${(r.nostock||0)>3?`<p class="sub">${t('st.tip.soldout')}</p>`:(r.noseat||0)>3?`<p class="sub">${t('rep.tip.seats')}</p>`:r.full>3?`<p class="sub">${t('rep.tip.queue')}</p>`:r.toRival>r.served?`<p class="sub">${t('rep.tip.rival')}</p>`:''}

  renderHeader();

  if(anim)state.tab='dia';

  document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===state.tab||((state.tab==='sala'||state.tab==='stock')&&b.dataset.tab==='loja')||(state.tab==='hist'&&b.dataset.tab==='menu'));b.disabled=!!anim&&b.dataset.tab!=='dia'});

   Events show up in GoatCounter as paths like "ev/save-pizza". No personal data: no names, no recipes. */
const TRACK={zoom:a=>state.zoom?'zoom-on':'zoom-off',share:'photo-download',recshare:'recipe-share',recsend:'recipe-send',reccopy:'recipe-copy-link',
  recfile:'recipe-file',recimport:'import-open',options:'options',chef:'change-names',savechef:'start-names',quickstart:'start-quick',
  mute:()=>MUSIC.isOn()?'music-on':'music-mute',musictoggle:()=>MUSIC.isOn()?'music-on':'music-off',musicnext:'music-next',
  lang:b=>'lang-'+b.dataset.v,fullscreen:'fullscreen',exportsave:'save-download',optreset:'reset',newdraft:'new-pizza',tier:b=>'tier-'+b.dataset.v,study:'study',supplier:b=>'supplier-'+b.dataset.v,restock:b=>'restock-'+b.dataset.v,stockfill:b=>'stock-fill-'+b.dataset.days,install:'install',instlater:'install-later',
  clear:'clear',undo:'undo',rotate:'rotate',edit:'edit-pizza',rm:'remove-pizza',open:'open-day',buy:'shop-buy',enter:'contest-enter'};
function track(ev,tries=0){try{if(window.goatcounter&&goatcounter.count)goatcounter.count({path:'ev/'+ev,title:ev,event:true});
  else if(tries<20)setTimeout(()=>track(ev,tries+1),500)}catch(_){}}   // the script loads async: early events wait for it
function go(tab){if(tab!==state.tab)track('tab-'+tab);if(anim||(SANDBOX&&!['cozinha','menu'].includes(tab)))return;state.tab=tab;render();window.scrollTo(0,0);document.body.scrollTop=0}
