<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pizza Magna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: 90s management-sim cabinet. Wood-panelled frames around every surface, parchment cards, a green-phosphor terminal for live numbers, brass push-buttons, pixel-art canvases scaled with nearest-neighbour */
:root{
  --wood:#7a4520; --wood-hi:#a8692f; --wood-lo:#4a260f; --wood-deep:#2a1407;
  --brass:#e3b34a; --brass-hi:#fbe39a; --brass-lo:#94661a; --brass-ink:#3a2706;
  --parch:#f3e6c6; --parch-2:#e6d3a8; --ink:#2c1a0b; --muted:#6c5233; --line:#c8ad7c; --on-wood:#e9d2a2;
  --lcd-bg:#081008; --lcd:#8cff73; --lcd-dim:#3f7f33;
  --tomato:#c4352a; --tomato-hi:#e8705a; --tomato-lo:#7e1d14; --good:#2e7b2c; --bad:#b02a1c; --cheese:#ffcf4a;
  --f-pixel:'Silkscreen','Courier New',monospace;
  --f-lcd:'VT323','Courier New',monospace;
  --f-body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{color:var(--on-wood);font-family:var(--f-body);font-size:15px;line-height:1.4;background-color:#4c2a13;
  background-image:repeating-linear-gradient(0deg,rgba(20,8,2,.55) 0 2px,transparent 2px 44px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 9px),linear-gradient(90deg,#4c2a13,#573117 50%,#4c2a13)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood-deep)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sandbox .stats,.sandbox .goal{display:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}
button:disabled{cursor:not-allowed;filter:grayscale(.7);opacity:.6}
h1,h2,h3{font-family:var(--f-pixel);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em;line-height:1.15}
h2{font-size:1.15rem}
h3{font-size:.92rem}
.lbl{font-family:var(--f-pixel);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sub{color:#d9bf8e;font-size:.9rem;margin:2px 0 0}
.card .sub,.box .sub{color:var(--muted)}

/* Frames */
.card{background:var(--parch);color:var(--ink);border:3px solid var(--wood-deep);border-radius:2px;padding:14px;
  box-shadow:inset 0 0 0 3px var(--parch-2),0 0 0 3px var(--wood-hi),0 0 0 6px var(--wood-lo),0 8px 0 6px rgba(0,0,0,.22)}
.frame{border:6px solid var(--wood);background:var(--wood-deep);box-shadow:inset 0 0 0 2px var(--wood-deep),0 0 0 2px var(--wood-hi),0 0 0 5px var(--wood-deep),0 8px 0 5px rgba(0,0,0,.25);position:relative}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Brass buttons */
.btn{font-family:var(--f-pixel);font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--brass-ink);
  background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;padding:8px 12px;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),inset -1px -1px 0 rgba(0,0,0,.25),0 3px 0 var(--wood-deep)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 1px 0 var(--wood-deep)}
.btn.primary{background:linear-gradient(var(--tomato-hi),var(--tomato) 45%,var(--tomato-lo));color:#fff1d2;border-color:#3a0c06}
.btn.ghost,.btn.danger{background:linear-gradient(#f6ead0,#dcc699)}
.btn.danger{color:var(--bad)}
.btn.big{font-size:.95rem;padding:12px 18px}
.btn.sm{padding:6px 9px;font-size:.66rem}

/* Header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--wood-hi),var(--wood) 30%,var(--wood-lo));border-bottom:4px solid var(--wood-deep);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.hdr-in{max-width:1040px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-pixel);font-weight:700;font-size:1.05rem;color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 50%,var(--brass-lo));border:2px solid var(--brass-ink);padding:4px 12px 4px 6px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 2px 0 var(--wood-deep)}
.brand canvas{width:30px;height:30px}
.stats{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.opt-btn{display:inline-flex;align-items:center;gap:6px;order:3}
/* mute: fixed in the top-right corner, above every screen and dialog */
#mute{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(8px,env(safe-area-inset-right,0px));width:38px;height:38px;padding:0;display:grid;place-items:center;
  color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 3px 0 var(--wood-deep)}
#mute.off{background:linear-gradient(#f6ead0,#dcc699);color:var(--bad)}
#mute svg{width:22px;height:22px}
.hdr-in{padding-right:max(58px,env(safe-area-inset-right,0px))}
.sandbox .opt-btn{margin-left:auto}
.opts{display:flex;flex-direction:column;gap:14px}
.opts section{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:12px}
.stat{background:var(--lcd-bg);border:2px solid var(--wood-deep);box-shadow:inset 0 0 0 1px #1d331a;padding:2px 8px;display:flex;flex-direction:column;min-width:0}
.stat .lbl{color:var(--lcd-dim);font-size:.56rem}
.stat b{font-family:var(--f-lcd);font-weight:400;font-size:1.25rem;line-height:1;color:var(--lcd);white-space:nowrap;text-shadow:0 0 5px rgba(140,255,115,.4)}
.stars i{font-style:normal;color:#244a1f}
.stars i.on{color:var(--lcd)}
.goal{flex-basis:100%;display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--on-wood)}
.goal .bar{flex:1;max-width:260px;height:8px;background:var(--wood-deep);border:1px solid var(--brass-lo)}
.goal .bar span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--brass) 0 6px,var(--brass-lo) 6px 7px)}

/* Main */
#view{max-width:1040px;margin:0 auto;padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view>.stack>h2,#view>.stack>div>h2,#view>.stack>div>h3{color:var(--brass-hi);text-shadow:2px 2px 0 var(--wood-deep)}

/* Kitchen */
.kitchen{display:flex;flex-direction:column;gap:22px}
.bench{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:1000px){.bench{grid-template-columns:auto minmax(0,1fr);align-items:start}}
.stage{border:6px solid var(--wood);box-shadow:inset 0 0 0 2px var(--wood-deep),0 0 0 2px var(--wood-hi),0 0 0 5px var(--wood-deep);
  background:repeating-linear-gradient(90deg,#b98552 0 30px,#a8743f 30px 32px);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
@media (max-width:420px){.stage{padding:8px 4px}}
.stage canvas{touch-action:none;max-width:100%;display:block;cursor:crosshair;box-shadow:0 0 0 2px var(--wood-deep)}
.pantry .ings{margin-top:8px}
.pantry .cats{margin-top:8px}
.pantry .cats button small{opacity:.6}
@media (min-width:1000px){.pantry{max-height:516px;overflow:auto}}
.stage .hint{color:#fff4dc;font-size:.85rem;text-shadow:1px 1px 0 var(--wood-deep);text-align:center}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px}
.field input{border:2px solid var(--wood-lo);border-radius:0;padding:8px 10px;font:inherit;font-size:1rem;background:#fffaf0;color:var(--ink);width:100%;box-shadow:inset 2px 2px 0 rgba(0,0,0,.12)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:#fbf3df;color:var(--ink);padding:5px 10px;font-size:.88rem;border-radius:2px}
.seg button.on{background:var(--wood);border-color:var(--wood-deep);color:var(--parch)}
.seg button small{opacity:.75;margin-left:3px}
.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.ing{border:2px solid var(--line);background:#fbf3df;color:var(--ink);border-radius:2px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;line-height:1.1;text-align:center}
.ing canvas{width:48px;height:48px}
@media (min-width:820px) and (max-resolution:1.5dppx){.ing canvas{width:64px;height:64px}}
.ing small{color:var(--muted);font-size:.7rem}
.ing.on{border-color:var(--tomato);background:#fff;box-shadow:inset 0 0 0 2px var(--tomato)}
.ing.locked{opacity:.45}
.analysis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.qbig{font-family:var(--f-lcd);font-size:3rem;line-height:.9}
.meter{height:10px;background:#dccaa0;border:1px solid var(--ink)}
.meter span{display:block;height:100%}
.segbars{display:flex;flex-direction:column;gap:5px}
.segbar{display:grid;grid-template-columns:78px 1fr 28px;align-items:center;gap:6px;font-size:.82rem}
.notes{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.note{font-size:.82rem;border:1px solid var(--line);padding:3px 8px;background:#fbf3df}
.note.bad{background:#f6d7cf;border-color:#d99a8d;color:#7c1f13}
.note.good{background:#dcefd3;border-color:#9dc48d;color:#1f5a1d}
.note.combo{background:#ffe9a8;border-color:#d8b04a;color:#5d3f00}
details.book summary{cursor:pointer;font-family:var(--f-pixel);font-size:.8rem}
.book ul{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.book li{font-size:.84rem;background:#fbf3df;border:1px solid var(--line);padding:6px 9px}
.book li b{display:block}
.book li.unk{color:var(--muted)}

/* Menu */
.menu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.mcard{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:start}
.mcard canvas{width:86px;height:86px}
.mcard h3{overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto auto;justify-content:start;gap:2px 12px;font-size:.88rem;margin:6px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.price{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.price b{font-family:var(--f-lcd);font-weight:400;font-size:1.7rem;min-width:84px;text-align:center;background:var(--lcd-bg);color:var(--lcd);border:2px solid var(--wood-deep);line-height:1.1}
.price button{width:32px;height:32px;padding:0;font-size:1rem}
.empty{border:3px dashed var(--brass-lo);padding:22px;text-align:center;color:var(--on-wood);background:rgba(0,0,0,.15)}

/* Day */
.dayview{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:820px){.dayview{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.room canvas{display:block;width:100%}
.lcd{margin:0;background-color:var(--lcd-bg);background-image:repeating-linear-gradient(rgba(140,255,115,.05) 0 1px,transparent 1px 3px);color:var(--lcd);font-family:var(--f-lcd);font-size:19px;line-height:1.08;padding:10px 12px;white-space:pre;overflow-x:auto;text-shadow:0 0 6px rgba(140,255,115,.45);min-height:100%}
.lcd .dim{color:var(--lcd-dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.news{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.news li{border-left:4px solid var(--brass-lo);padding-left:9px}
.news li:first-child{font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--on-wood)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;background:var(--c);border:1px solid var(--wood-deep);margin-right:5px;vertical-align:-1px}
.banner{background:var(--lcd-bg);border:3px solid var(--brass);color:var(--cheese);font-family:var(--f-lcd);font-size:1.25rem;line-height:1.15;padding:8px 12px}

/* Shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.shop .card{display:flex;flex-direction:column;gap:8px}
.shop .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-family:var(--f-pixel);font-size:.62rem;background:var(--wood);color:var(--parch);padding:2px 6px}

/* Contest */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pick{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:3px solid var(--wood-lo);background:var(--parch);color:var(--ink);padding:8px}
.pick canvas{width:54px;height:54px}
.pick.on{border-color:var(--tomato);box-shadow:inset 0 0 0 2px var(--tomato)}
.pick b{display:block;overflow-wrap:anywhere}
table.rank{width:100%;border-collapse:collapse;font-size:.92rem}
table.rank td{padding:6px 4px;border-bottom:1px dashed var(--line)}
table.rank td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
table.rank tr.me td{color:var(--tomato-lo);font-weight:700}

/* Nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(var(--wood-hi),var(--wood) 25%,var(--wood-lo));border-top:4px solid var(--wood-deep);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
#nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:7px}
#nav button{font-family:var(--f-pixel);font-size:.6rem;text-transform:uppercase;color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 3px 0 var(--wood-deep)}
#nav button svg{width:20px;height:20px}
#nav button.on{background:linear-gradient(var(--brass-lo),var(--brass) 60%,var(--brass-hi));transform:translateY(2px);box-shadow:inset 2px 2px 0 rgba(0,0,0,.3),0 1px 0 var(--wood-deep)}
#nav button.go{background:linear-gradient(var(--tomato-hi),var(--tomato) 45%,var(--tomato-lo));color:#fff1d2;border-color:#3a0c06}
#nav button.go.on{background:linear-gradient(var(--tomato-lo),var(--tomato))}

/* Modal + toast */
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,8,2,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--parch);color:var(--ink);border:3px solid var(--wood-deep);box-shadow:inset 0 0 0 3px var(--parch-2),0 0 0 4px var(--wood-hi),0 0 0 9px var(--wood-lo);max-width:520px;width:calc(100% - 18px);max-height:calc(100% - 30px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
#modal ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.95rem}
.pl span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pl .tot{border-top:2px solid var(--ink);padding-top:4px;font-size:1.05rem}
.quote{background:#fbf3df;border:1px solid var(--line);padding:8px 12px;font-size:.92rem}
.quote small{display:block;font-family:var(--f-pixel);color:var(--muted);font-size:.6rem;text-transform:uppercase}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--lcd-bg);color:var(--lcd);border:3px solid var(--brass);font-family:var(--f-lcd);font-size:1.2rem;line-height:1.1;padding:8px 14px;max-width:calc(100% - 32px);text-align:center;text-shadow:0 0 6px rgba(140,255,115,.45)}
@media (prefers-reduced-motion:no-preference){#toast{animation:pop .2s steps(3)}@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}}
</style>

<header id="hdr"></header>
<main id="view"></main>
<nav id="nav"><div class="in">
  <button data-tab="cozinha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1.4"/><circle cx="14.5" cy="9" r="1.2"/><circle cx="13" cy="15" r="1.4"/></svg><span data-i18n="nav.cozinha">Cozinha</span></button>
  <button data-tab="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span data-i18n="nav.menu">Menu</span></button>
  <button data-tab="dia" class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1.5-5h-13z"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg><span data-i18n="nav.dia">Abrir</span></button>
  <button data-tab="loja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 7H6.3"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><span data-i18n="nav.loja">Loja</span></button>
  <button data-tab="concurso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8"/></svg><span data-i18n="nav.concurso">Concurso</span></button>
</div></nav>
<div id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="toast" hidden></div>

<script src="assets/ingredients.js"></script>
<script src="music.js"></script>
<script src="sprites.js"></script>
<script>
/* ================= LANGUAGE =================
   English by default, Portuguese when the browser or phone is set to pt, pt-PT or pt-BR.
   Visible text comes from this table. Screens are being moved here one at a time:
   the kitchen and all names of ingredients, doughs, sauces, combos and customers already are. */
const LANG=((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase().startsWith('pt')?'pt':'en';
document.documentElement.lang=LANG;
const I18N={
en:{
  'ing.mozzarella':'Mozzarella','ing.fiambre':'Ham','ing.pepperoni':'Pepperoni','ing.cogumelos':'Mushrooms','ing.azeitonas':'Olives',
  'ing.pimento':'Green pepper','ing.cebola':'Onion','ing.ananas':'Pineapple','ing.manjericao':'Basil','ing.atum':'Tuna',
  'ing.bacon':'Bacon','ing.tomate':'Tomato','ing.chourico':'Chouriço','ing.piripiri':'Piri-piri','ing.ovo':'Egg',
  'ing.bacalhau':'Salt cod','ing.queijo_serra':'Serra cheese','ing.presunto':'Presunto','ing.mel':'Honey','ing.rucula':'Rocket',
  'ing.milho':'Sweetcorn','ing.frango':'Chicken','ing.salame':'Salami','ing.alheira':'Alheira','ing.gorgonzola':'Gorgonzola',
  'ing.figo':'Fig','ing.espargos':'Asparagus','ing.camarao':'Prawns',
  'ing.espinafres':'Spinach','ing.tomate_cherry':'Cherry tomato','ing.jalapenos':'Jalapeños','ing.anchovas':'Anchovies','ing.ricotta':'Ricotta','ing.pera':'Pear',

/* ================= PIZZA ANALYSIS ================= */
function analyze(p){
  // Grated/chopped pieces weigh less (0.7 of a portion, 0.7 of the cost) but cover more area, so they even out the spread.
  const cnt={};let n=0,cost0=0;for(const x of p.pieces){cnt[x.i]=(cnt[x.i]||0)+1;const w=x.g?.7:1;n+=w;cost0+=ING[x.i].c*w}
  n=Math.round(n*10)/10;
  const ids=Object.keys(cnt),d=ids.length,grated=p.pieces.filter(x=>x.g).length;
  const D=DOUGHS[p.dough],S=SAUCES[p.sauce],notes=[];
  const note=(type,k)=>notes.push([type,t('n.'+k),I18N.en['q.'+k]?t('q.'+k):undefined]);
  let q=45+{fina:3,napo:5,alta:2,integral:3,sem_gluten:1,lenta:7,recheado:3}[p.dough];
  if(p.sauce==='sem'){q-=12;note('bad','dry')}else q+={tomate:5,natas:2,pesto:4,barbecue:3,arrabbiata:5,azeite_alho:3,trufa:6,pimentos:4}[p.sauce];
  if(n<6){q-=25;note('bad','empty')}
  else if(n<14){q-=(14-n)*1.5;note('bad','few')}
  else if(n>40){q-=(n-40)*.8;note('bad','heavy')}
  else note('good','good');
  if(n>0&&!ids.some(i=>ING[i].t.includes('queijo'))){q-=10;note('bad','nocheese')}
  if(d===1){q-=5;note('bad','mono')}
  q+=Math.min(d,5)*2;
  if(d>6){q-=(d-6)*4;note('bad','many')}
  if(p.pieces.length>=8){const qd=[0,0,0,0];for(const x of p.pieces)qd[(x.x>=0?1:0)+(x.y>=0?2:0)]+=x.g?1.4:1;const ratio=Math.min(...qd)/Math.max(...qd);q-=(1-ratio)*14;if(ratio<.4)note('bad','uneven');else if(grated>=4&&ratio>=.7)note('good','grated')}
  const has=k=>k.startsWith('s:')?p.sauce===k.slice(2):(cnt[k]||0)>=2;
  const combos=COMBOS.filter(c=>c.req.every(has));
  const segMod={estudante:0,familia:0,turista:0,gourmet:0};
  for(const c of combos){q+=c.q;for(const k in c.seg)segMod[k]+=c.seg[k];notes.push(c.q>=0?['combo',t('n.combo',{x:c.n})]:['bad',t('n.clash',{x:c.n}),c.quote])}
  q=clamp(Math.round(q),0,100);
  const cost=D.c+S.c+cost0;
  const tags=[...ids.flatMap(i=>ING[i].t),...S.t,...D.t];
  const appeal={};
  for(const k in SEG){let tw=0;for(const t of tags)tw+=SEG[k].w[t]||0;tw=clamp(tw,-20,18);let a=q+tw+SEG[k].dough[p.dough]+segMod[k];if(k==='gourmet'&&n>34)a-=8;if(k==='estudante'&&n>=24)a+=3;appeal[k]=clamp(Math.round(a),0,100)}
  return {q,cost:r2(cost),appeal,notes,combos:combos.map(c=>c.id),n,d,cnt,ids};
}
function segMix(){const m={estudante:.36,familia:.32,turista:.18+state.deco*.04,gourmet:.14+state.deco*.04};const t=Object.values(m).reduce((a,b)=>a+b,0);for(const k in m)m[k]/=t;return m}
function suggestPrice(a){const m=segMix();let f=0;for(const k in m)f+=m[k]*fairPrice(a.appeal[k]);return Math.max(3,Math.round(f*2)/2)}
const capacity=()=>Math.min(state.ovens*28,state.cooks*20);
const expectedCustomers=()=>Math.round((20+state.rep*8)*WK_MUL[(state.day-1)%7]*(state.ads?1.45:1));

    case 'classica':return {s:a.q+tagCount(a,'classico')*4+(a.combos.includes('margherita')?10:0)+(p.sauce==='tomate'?3:0)};
    case 'portugal':return {s:a.q+tagCount(a,'portugues')*7};
    case 'veg':if(a.ids.some(i=>ING[i].t.includes('carne')||ING[i].t.includes('peixe')))return {s:0,dq:'Tem carne ou peixe'};return {s:a.q+tagCount(a,'vegetal')*3};

function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}
const ATL={img:new Image(),ok:false};
const atlasReady=new Promise(res=>{ATL.img.onload=()=>{ATL.ok=true;res()};ATL.img.onerror=()=>res();ATL.img.src=ATLAS.src});
const PZ=ATLAS.pizza,PR=PZ/2;
/* A turning piece is one image (<id>_n) turned by whole quarter turns, so no pixel is lost;
   the shadow is added after turning so it always falls down-right, like the generator's drop(). */
const turnedCache=new Map();
function turned(id,q){
  const key=id+q;if(turnedCache.has(key))return turnedCache.get(key);
  const f=ATLAS.frames[id+'_n'],sw=f[2],sh=f[3],w=q%2?sh:sw,h=q%2?sw:sh;
  const mk=(a,b)=>{const cv=document.createElement('canvas');cv.width=a;cv.height=b;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;return [cv,c]};
  const [rc,r]=mk(w,h);
  r.setTransform(...[[1,0,0,1,0,0],[0,1,-1,0,w,0],[-1,0,0,-1,w,h],[0,-1,1,0,0,h]][q]);
  r.drawImage(ATL.img,f[0],f[1],sw,sh,0,0,sw,sh);
  const [shc,shx]=mk(w,h);shx.drawImage(rc,0,0);shx.globalCompositeOperation='source-in';shx.fillStyle='rgba(60,10,4,.43)';shx.fillRect(0,0,w,h);
  const [oc,o]=mk(w+2,h+2);o.drawImage(shc,2,2);o.drawImage(rc,0,0);
  turnedCache.set(key,oc);return oc;
}
function spr(c,key,x,y,alpha){
  if(!ATL.ok)return;let src;
  const m=/^(.+)_q(\d)$/.exec(key);
  if(m){const cv=turned(m[1],+m[2]);src=[cv,0,0,cv.width,cv.height]}
  else{const f=ATLAS.frames[key];if(!f)return;src=[ATL.img,...f]}
  const [img,sx,sy,w,h]=src;
  if(alpha!=null)c.globalAlpha=alpha;c.drawImage(img,sx,sy,w,h,Math.round(x-w/2),Math.round(y-h/2),w,h);c.globalAlpha=1;
}
const canGrate=id=>!!ATLAS.frames[id+'_g0'];
const turns=id=>ATLAS.frames[id+'_n']?(ING[id].rot||1):1;
const canRotate=id=>turns(id)>1;
const pieceVar=x=>(x.v!=null?x.v:Math.floor(x.r*7))%3;
const pieceAng=x=>(x.a!=null?x.a:pieceVar(x))%turns(x.i);
const wholeKey=(id,v,a)=>ATLAS.frames[id+'_n']?id+'_q'+(a%turns(id)):id+'_'+v;
const pieceKey=x=>x.g&&canGrate(x.i)?x.i+'_g'+pieceVar(x):wholeKey(x.i,pieceVar(x),pieceAng(x));
const LAYER={brie:0,catupiry:.5,emmental:0,flamengo:0,pimenta:2.7,tomilho:2.6,trufa:2.9,sao_jorge:0,chocolate:2.5,natas_azedas:2.8,salsa:2.6,provolone:0,batata_palha:2.8,alecrim:2.6,nutella:0,maionese:.5,azeite:3,balsamico:3.1,cheddar:0,oregaos:2.6,mozzarella:0,queijo_serra:0,gorgonzola:0,ricotta:0,cabra:0,burrata:1.2,nozes:2.5,pinhoes:2.5,parmesao:2.6,espinafres:.5,manjericao:2,rucula:2,mel:3,ovo:1.5};
/* Pizza at the logical 170 px scale: sauce, toppings, then the crust ring on top so pieces tuck under the rim. */
function composePizza(p){
  const cv=document.createElement('canvas');cv.width=cv.height=PZ;const c=cv.getContext('2d');
  spr(c,'sauce_'+p.sauce,PR,PR);
  [...p.pieces].map((x,k)=>({x,k,l:(LAYER[x.i]??1)-(x.g?.5:0)})).sort((a,b)=>a.l-b.l||a.k-b.k).forEach(({x})=>spr(c,pieceKey(x),PR+x.x*PR,PR+x.y*PR));
  spr(c,'crust_'+p.dough,PR,PR);
  return cv;
}
function drawMini(cv,p,size){const c=fitCanvas(cv,size,size);c.clearRect(0,0,size,size);c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(composePizza(p),0,0,size,size)}

/* ---- the pizza bench: a 320x200 logical screen, scaled by whole numbers ---- */
const BW=320,BH=200,PX=12,PY=15;                       // pizza top-left on the bench
const PCX=PX+PR,PCY=PY+PR;
const BOWLS=[{g:0,x:227,y:26},{g:1,x:227,y:94}];       // bowl sprite top-left (58x40)
const BOWL_W=58,BOWL_H=40;
let pz=null;
function benchScale(){
  // whole-number zoom when it fits (x1, x2); below 320 px it shrinks to fit the phone
  const st=$('.stage'),cs=getComputedStyle(st),wide=window.innerWidth>=1000;
  const avail=$('.kitchen').clientWidth-(wide?320:0)-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-12;
  return avail<BW?avail/BW:Math.min(2,Math.floor(avail/BW));
}
function setupPizzaCanvas(){
  const cv=$('#pz');
  const k=benchScale();cv.style.width=BW*k+'px';cv.style.height=BH*k+'px';
  const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
  pz={cv,c,pizza:null,ghost:null};drawDraft();
  let down=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();const lx=(e.clientX-r.left)/r.width*BW,ly=(e.clientY-r.top)/r.height*BH;return {lx,ly,x:(lx-PCX)/PR,y:(ly-PCY)/PR}};
  const bowlAt=p=>BOWLS.find(b=>p.lx>=b.x-6&&p.lx<=b.x+BOWL_W+6&&p.ly>=b.y-4&&p.ly<=b.y+BOWL_H+16);
  cv.oncontextmenu=e=>{e.preventDefault();const p=pos(e);if(Math.hypot(p.x,p.y)<=1)rotatePiece(p)};
  cv.onpointerdown=e=>{
    if(e.button!==0)return;
    const p=pos(e),b=bowlAt(p);
    if(b){setCut(b.g);return}
    if(Math.hypot(p.x,p.y)>1)return;
    down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}
    pz.ghost=null;if(addPiece(p))last=p;
  };
  cv.onpointermove=e=>{
    const p=pos(e);
    if(down){if(!last||Math.hypot(p.x-last.x,p.y-last.y)>.2){if(addPiece(p))last=p}return}
    if(e.pointerType==='mouse'){const g=Math.hypot(p.x,p.y)<=.8?p:null;cv.style.cursor=bowlAt(p)?'pointer':g?'none':'default';if(g||pz.ghost){pz.ghost=g;drawBench()}}
  };
  cv.onpointerup=cv.onpointercancel=()=>{down=false;last=null};
  cv.onpointerleave=()=>{if(pz&&pz.ghost){pz.ghost=null;drawBench()}};
}
function setCut(g){
  if(g&&!canGrate(state.sel)){toast(t('k.nograte',{x:ING[state.sel].n}));return}
  state.cut=g?'g':'w';drawBench();save();
}
const curAng=()=>((state.rot||{})[state.sel]||0)%turns(state.sel);
/* Rotate: the piece under the pointer if there is one; otherwise the next piece (and the last one, if it was just put down). */
function rotatePiece(p){
  const id=state.sel,ps=state.draft.pieces;
  const isRot=x=>!x.g&&canRotate(x.i);
  let hit=null;
  if(p)for(let k=ps.length-1;k>=0;k--){const x=ps[k];if(isRot(x)&&Math.hypot(x.x-p.x,x.y-p.y)<.14){hit=x;break}}
  if(!hit&&!p){const last=ps[ps.length-1];if(last&&last.i===id&&isRot(last))hit=last}
  if(hit){hit.a=(pieceAng(hit)+1)%turns(hit.i);state.rot={...state.rot,[hit.i]:hit.a};drawDraft();save();return true}
  if(!canRotate(id)){if(!p)toast(t('k.norotate',{x:ING[id].n}));return false}
  state.rot={...state.rot,[id]:(curAng()+1)%turns(id)};drawBench();save();return true;
}
const curCut=()=>state.cut==='g'&&canGrate(state.sel)?1:0;
function benchText(c,s,x,y,col='#2c1a0b',hl='rgba(255,255,255,.55)'){c.font='8px Silkscreen, monospace';c.textAlign='center';c.textBaseline='top';c.fillStyle=hl;c.fillText(s,x,y+1);c.fillStyle=col;c.fillText(s,x,y)}
function pxRect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,1);c.fillRect(x,y+h-1,w,1);c.fillRect(x,y,1,h);c.fillRect(x+w-1,y,1,h)}
function drawBench(){
  if(!pz)return;const c=pz.c,d=state.draft,sel=state.sel,cut=curCut();
  c.clearRect(0,0,BW,BH);
  spr(c,'marble',BW/2,BH/2);
  // pizza and its shadow on the marble
  c.fillStyle='rgba(40,30,20,.32)';c.beginPath();c.ellipse(PCX+3,PCY+4,PR+1,PR,0,0,Math.PI*2);c.fill();
  if(!pz.pizza)pz.pizza=composePizza(d);
  c.drawImage(pz.pizza,PX,PY);
  if(pz.ghost)spr(c,cut?sel+'_g0':wholeKey(sel,0,curAng()),PCX+pz.ghost.x*PR,PCY+pz.ghost.y*PR,.6);
  // right side: ingredient name plate and two bowls (whole / grated)
  const cx=BOWLS[0].x+BOWL_W/2;
  // name plate grows with the name (long names like "Salsicha italiana"), up to the bench edge
  const label=ING[sel].n.toUpperCase();c.font='8px Silkscreen, monospace';
  const hw=Math.min(BW-cx-3,Math.max(46,Math.ceil(c.measureText(label).width/2)+6));
  c.fillStyle='#4a260f';c.fillRect(cx-hw,6,hw*2,13);c.fillStyle='#e3b34a';c.fillRect(cx-hw+1,7,hw*2-2,11);c.fillStyle='#fbe39a';c.fillRect(cx-hw+1,7,hw*2-2,1);
  benchText(c,label,cx,9,'#3a2706','rgba(251,227,154,.8)');
  for(const b of BOWLS){
    const on=b.g===cut,ok=!b.g||canGrate(sel),bx=b.x+BOWL_W/2,by=b.y+13;
    if(on){pxRect(c,b.x-5,b.y-4,BOWL_W+10,BOWL_H+18,'#3a2706');pxRect(c,b.x-4,b.y-3,BOWL_W+8,BOWL_H+16,'#e3b34a');pxRect(c,b.x-3,b.y-2,BOWL_W+6,BOWL_H+14,'#94661a')}
    spr(c,'bowl',bx,b.y+BOWL_H/2);
    if(ok){if(!b.g&&canRotate(sel))spr(c,wholeKey(sel,0,curAng()),bx,by+1);else{const k=b.g?v=>sel+'_g'+v:v=>sel+'_'+v;spr(c,k(1),bx-9,by-1);spr(c,k(2),bx+9,by);spr(c,k(0),bx,by+2)}}
    benchText(c,t(b.g?(ok?(ING[sel].t.includes('queijo')?'bench.grated':'bench.chopped'):'bench.nograte'):'bench.whole'),bx,b.y+BOWL_H+3,on?'#2c1a0b':'#6c5233');
  }
  // little LCD with portions and quality
  const a=analyze(d),lx=BOWLS[0].x-13,ly=164,lw=BOWL_W+26;   // wide enough for 'PREÇO 10,00 €'
  c.fillStyle='#2a1407';c.fillRect(lx-2,ly-2,lw+4,32);c.fillStyle='#081008';c.fillRect(lx,ly,lw,28);
  c.font='8px Silkscreen, monospace';c.textBaseline='top';c.fillStyle='#8cff73';
  c.textAlign='left';c.fillText(t('bench.q'),lx+3,ly+3);c.fillText(t('bench.n'),lx+3,ly+15);
  c.textAlign='right';c.fillText(eur(suggestPrice(a)),lx+lw-3,ly+3);c.fillText(String(d.pieces.length),lx+lw-3,ly+15);   // top line: suggested price, not quality
}
function drawDraft(){if(!pz)return;pz.pizza=null;drawBench()}
function addPiece(p){
  if(Math.hypot(p.x,p.y)>.8)return false;
  if(!state.unlocked.includes(ING[state.sel].pack)){toast(t('k.locked',{i:ING[state.sel].n,p:PACKS[ING[state.sel].pack]}));return false}
  if(state.draft.pieces.length>=70){toast(t('k.full'));return false}
  const piece={i:state.sel,x:+p.x.toFixed(3),y:+p.y.toFixed(3),r:+(Math.random()*6.28).toFixed(2),v:Math.floor(Math.random()*3)};
  if(curCut())piece.g=1;else if(canRotate(state.sel))piece.a=curAng();
  state.draft.pieces.push(piece);
  drawDraft();updateAnalysis();return true;
}
function updateAnalysis(){
  const el=$('#analysis');if(!el)return;
  const a=analyze(state.draft);
  for(const id of a.combos)if(!state.discovered.includes(id)){state.discovered.push(id);const c=COMBOS.find(x=>x.id===id);toast(c.q>=0?t('k.found',{x:c.n}):t('k.foundbad',{x:c.n}));const s=document.querySelector('details.book summary');if(s)s.textContent=t('k.book',{n:state.discovered.length,t:COMBOS.length})}
  const qc=a.q>=70?'var(--good)':a.q>=45?'#d39b12':'var(--bad)';
  el.innerHTML=`<div class="analysis">
    <div><span class="lbl">${t('k.q')}</span><div class="qbig num" style="color:${qc}">${a.q}</div><div class="meter"><span style="width:${a.q}%;background:${qc}"></span></div></div>
    <div><span class="lbl">${t('k.cost')}</span><div class="qbig num" style="font-size:1.7rem">${eur(a.cost)}</div><span class="sub">${t('k.portions',{n:LANG==='pt'?String(a.n).replace('.',','):a.n,p:eur(suggestPrice(a))})}</span></div>

    <div class="notes">${a.n===0?`<span class="note">${t('k.empty')}</span>`:a.notes.map(n=>`<span class="note ${n[0]}">${esc(n[1])}</span>`).join('')}</div>
  </div>`;
  save();
}

/* ---- simulation ---- */
function simulateDay(){
  const s=state,menuA=s.menu.map(p=>({p,a:analyze(p)})),mix=segMix(),cap=capacity(),r=s.rival;
  const N=expectedCustomers();const TH=4.2;const events=[];
  let served=0,toRival=0,full=0,passed=0,revenue=0,ingCost=0,repDelta=0,happy=0,unhappy=0;const sales={},quotes=[];
  const pickSeg=()=>{let x=Math.random();for(const k in mix){x-=mix[k];if(x<=0)return k}return 'familia'};
  for(let i=0;i<N;i++){
    const seg=pickSeg(),ps=SEG[seg].ps,t=(i+Math.random())/N*.9;
    const deco=s.deco*(seg==='turista'||seg==='gourmet'?.6:.3)+(s.rep-2.5)*.3;
    let best=null,bu=-1e9;
    for(const m of menuA){const ap=m.a.appeal[seg];const u=ap/10-ps*(m.p.price-fairPrice(ap))+noise()+deco;if(u>bu){bu=u;best=m}}
    const ra=clamp(r.q+RIVAL_BIAS[seg],0,100);const ru=ra/10-ps*(r.price-fairPrice(ra))+noise()+(r.promo?2.5:0);
    const e={t,seg};
    if(best&&bu>=Math.max(ru,TH)){
      e.target='ours';
      if(served<cap){
        served++;revenue+=best.p.price;ingCost+=best.a.cost;sales[best.p.id]=(sales[best.p.id]||0)+1;e.price=best.p.price;
        const ap=best.a.appeal[seg],over=best.p.price-fairPrice(ap);const sat=ap+noise()*5-Math.max(0,over)*7+s.deco*2;
        if(sat>=62){happy++;repDelta+=.011;e.out='happy';if(Math.random()<.25)quotes.push([seg,happyQuote(seg,best.p.name)])}
        else{unhappy++;repDelta-=.03;e.out='meh';const bad=best.a.notes.find(n=>n[0]==='bad'&&n[2]);quotes.push([seg,over>1.5?`Boa, mas ${eur(best.p.price)} é caro para o que é.`:bad?bad[2]:'Comível, mas nada de especial.'])}
      }else{full++;repDelta-=.012;e.out='full';if(Math.random()<.3)quotes.push([seg,'Esperei imenso e desisti.'])}
    }else if(ru>=TH){e.target='rival';toRival++;if(best&&Math.random()<.12)quotes.push([seg,r.promo?`Hoje a ${r.name} faz 2 por 1, não resisti.`:best.p.price>r.price+1.5?`A ${r.name} é mais barata.`:`Prefiro o sabor da ${r.name}.`])}
    else{e.target='none';passed++}
    events.push(e);
  }
  events.sort((a,b)=>a.t-b.t);
  return {events,served,toRival,full,passed,revenue:r2(revenue),ingCost:r2(ingCost),repDelta,happy,unhappy,sales,quotes,N,cap};
}
function happyQuote(seg,name){const q={estudante:[`A ${name} encheu-me a barriga por um bom preço.`,`Volto amanhã com a malta!`],familia:[`Os miúdos adoraram a ${name}.`,`Boa pizza, bom ambiente.`],turista:[`Best pizza in Lisbon! A ${name} é incrível.`,`Muito autêntico, adorei.`],gourmet:[`A ${name} tem equilíbrio de sabores notável.`,`Massa bem trabalhada. Recomendo.`]}[seg];return q[Math.floor(Math.random()*q.length)]}

function resolveContest(){
  const day=state.day,th=themeFor(day),p=state.menu.find(x=>x.id===state.contestEntry);if(!p)return null;
  const mine=contestScore(th,p);const base=Math.min(92,50+day*1.1);
  const names=NPCS.filter(n=>n!==state.rival.name).sort(()=>Math.random()-.5).slice(0,3).concat([state.rival.name]);
  const rows=names.map(n=>({n,s:Math.round(base+Math.random()*16-8)}));rows.push({n:'Pizza Magna · '+p.name,s:Math.round(mine.s),me:true,dq:mine.dq});
  rows.sort((a,b)=>b.s-a.s);const pos=rows.findIndex(x=>x.me)+1;

function finishDay(res){

  s.lastSales=res.sales;
  let contest=null;if(s.day%5===0){if(s.contestEntry)contest=resolveContest();s.contestEntry=null}
  s.ads=false;const news=[];
  r.promo=false;

  else if(res.toRival>res.served*1.5&&r.price<9.5){r.price=r2(r.price+.5);news.push(`A ${r.name} está confiante e subiu os preços para ${eur(r.price)}.`)}

  s.day++;

  else if(s.day%5===4)news.push(`Amanhã há concurso: ${themeFor(s.day+1).n}. Inscreve uma pizza.`);
  if(!news.length)news.push(['Dia calmo no bairro.','O bairro comenta as pizzas da rua.','Choveu de manhã, mas a tarde promete.'][s.day%3]);
  s.news=[...news,...s.news].slice(0,8);
  if(s.money<-500)s.over=true;

/* ---- restaurant room: 16px tile engine (sprites in sprites.js) ---- */
const T=16,COLS=20,ROWS=17,RW=COLS*T,RH=ROWS*T,STREET_ROW=15;
const DOOR=[10,14],PICK=[16,8];
const TABLES=[[1,3],[6,3],[1,7],[6,7],[13,9],[1,11],[6,11],[13,12]];
const QUEUE=[[11,13],[10,13],[11,12],[10,12],[11,11],[10,11],[11,10],[10,10],[11,9],[10,9],[11,8],[10,8]];
const WAITER_HOME=[[18,8],[19,8],[18,9],[19,9]];
const COOK_POS=[[13,4],[15,4],[17,4],[14,5],[16,5]];
const HAIR=['#2b1b10','#5a3a1e','#c9a24a','#151515','#8a3b1c','#d8d0c0','#6b6b6b'];
const SKIN=['#f1c7a0','#d9a477','#a8714a','#f6d6b8','#7a4d2e'];
const tableCount=()=>Math.min(TABLES.length,5+state.deco);
const waiterCount=()=>Math.min(4,state.cooks+1);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const plantsFor=d=>[...(d>=1?[[0,2],[19,13]]:[]),...(d>=2?[[0,13],[11,2]]:[])];

function buildMap(){
  const solid=new Uint8Array(COLS*ROWS),S=(c,r)=>{solid[r*COLS+c]=1};
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(r<2||(r===14&&c!==DOOR[0]&&c!==DOOR[0]+1)||r>15||(r===15&&c!==DOOR[0]&&c!==DOOR[0]+1))S(c,r);
    if(c>=12&&r>=2&&r<=7)S(c,r);
  }
  const seats=[],tables=TABLES.slice(0,tableCount()).map(([c,r])=>{
    for(let dc=1;dc<=2;dc++)for(let dr=0;dr<2;dr++)S(c+dc,r+dr);
    S(c,r+1);S(c+3,r+1);
    const t={c:c+1,r};
    seats.push({cx:c,cy:r+1,face:'right',t,occ:null},{cx:c+3,cy:r+1,face:'left',t,occ:null});
    return t;
  });
  const plants=plantsFor(state.deco);plants.forEach(([c,r])=>S(c,r));
  return {solid,seats,tables,plants};
}
function bfs(map,from,to){
  const key=(c,r)=>r*COLS+c,goal=key(to[0],to[1]),start=key(from[0],from[1]);
  if(start===goal)return [];
  const prev=new Int16Array(COLS*ROWS).fill(-1),q=[start];prev[start]=start;
  while(q.length){const k=q.shift();if(k===goal)break;const c=k%COLS,r=(k/COLS)|0;
    for(const [dc,dr] of [[0,1],[1,0],[0,-1],[-1,0]]){const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=COLS||nr>=ROWS)continue;const nk=key(nc,nr);if(prev[nk]!==-1)continue;if(map.solid[nk]&&nk!==goal)continue;prev[nk]=k;q.push(nk)}}
  if(prev[goal]===-1)return [[to[0],to[1]]];
  const out=[];for(let k=goal;k!==start;k=prev[k])out.push([k%COLS,(k/COLS)|0]);return out.reverse();
}
const tileOf=a=>[Math.round(a.x/T),Math.round(a.y/T)];
const toPx=p=>p.map(([c,r])=>({x:c*T,y:r*T}));
function makeScene(){
  const map=buildMap();
  const waiters=Array.from({length:waiterCount()},(_,i)=>{const [c,r]=WAITER_HOME[i];return {x:c*T,y:r*T,home:[c,r],path:[],job:null,carry:false,dir:'down',ph:0,look:{body:'#2a2a33',role:'waiter',hair:pick(HAIR),skin:pick(SKIN),long:i%2===1}}});
  const cooks=COOK_POS.slice(0,state.cooks).map(([c,r],i)=>({x:c*T,y:r*T,dir:'down',look:{body:'#f4efe4',hat:true,role:'cook',hair:HAIR[i%HAIR.length],skin:SKIN[(i+1)%SKIN.length]}}));
  return {map,seats:map.seats,waiters,cooks};
}
let anim=null,room=null,idleScene=null;
function startDay(){
  if(!state.menu.length){toast('Precisas de pelo menos uma pizza no menu.');return}
  const res=simulateDay();
  anim={res,t:0,speed:1,next:0,people:[],bubbles:[],jobs:[],cnt:{served:0,rival:0,left:0,rev:0},last:0,lcdT:0,...makeScene()};
  render();requestAnimationFrame(loop);
}
function roomSize(){
  const cv=$('#room');if(!cv)return null;const w=cv.parentElement.clientWidth;if(!w)return null;const h=Math.round(w*RH/RW);
  if(!room||room.cv!==cv||room.w!==w){const low=document.createElement('canvas');low.width=RW;low.height=RH;room={cv,w,h,c:fitCanvas(cv,w,h),low,lc:low.getContext('2d')}}
  return room;
}
function spawn(e){
  const left=e.target==='rival'?true:Math.random()<.5,y=STREET_ROW*T+(e.target==='ours'?0:Math.round(Math.random()*8));
  const p={e,x:left?-T:RW,y,look:{body:SEG[e.seg].col,hair:pick(HAIR),skin:pick(SKIN),long:Math.random()<.4},v:44+Math.random()*12,st:'street',path:[],dir:left?'right':'left',ph:Math.random()*4};
  p.path=[{x:e.target==='ours'?DOOR[0]*T:e.target==='rival'?RW+T:(left?RW+T:-T),y}];
  anim.people.push(p);
}
function moveAlong(o,dt,v){
  let d=v*dt;o.walking=false;
  while(d>0&&o.path.length){const t=o.path[0],dx=t.x-o.x,dy=t.y-o.y,L=Math.hypot(dx,dy);o.walking=true;
    if(Math.abs(dx)>.01||Math.abs(dy)>.01)o.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
    if(L<=d){o.x=t.x;o.y=t.y;o.path.shift();d-=L}else{o.x+=dx/L*d;o.y+=dy/L*d;d=0}}
  if(o.walking)o.ph=(o.ph||0)+dt*8;return !o.path.length;
}
function step(dt){
  anim.t+=dt;const ev=anim.res.events,map=anim.map;
  while(anim.next<ev.length&&ev[anim.next].t*DAY_SECONDS<=anim.t){spawn(ev[anim.next]);anim.next++}
  let qi=0;
  for(const p of anim.people){
    if(p.st!=='queue')continue;
    const s=anim.seats.find(s=>!s.occ);
    if(s){s.occ=p;p.seat=s;p.st='toSeat';p.path=toPx(bfs(map,tileOf(p),[s.cx,s.cy]));continue}
    const spot=QUEUE[Math.min(qi++,QUEUE.length-1)];
    if(!p.spot||p.spot[0]!==spot[0]||p.spot[1]!==spot[1]){p.spot=spot;p.path=toPx(bfs(map,tileOf(p),spot))}
    moveAlong(p,dt,p.v);
  }
  for(const p of anim.people){
    switch(p.st){
      case 'street':if(moveAlong(p,dt,p.v)){
        if(p.e.target==='ours'){
          if(p.e.out==='full'){anim.cnt.left++;bubble(p.x+8,p.y-18,'FILA!','#ff6a4a');p.st='leave';p.path=[{x:p.x<RW/2?-T:RW+T,y:p.y}]}
          else{p.st='queue';p.spot=null}
        }else{if(p.e.target==='rival'){anim.cnt.rival++;if(Math.random()<.5)bubble(RW-30,p.y-18,'→ RIVAL','#ffb04a')}p.gone=true}
      }break;
      case 'toSeat':if(moveAlong(p,dt,p.v)){p.st='wait';p.dir=p.seat.face;anim.jobs.push(p)}break;
      case 'wait':if(p.served){p.st='eat';p.timer=2.6}break;
      case 'eat':p.timer-=dt;if(p.timer<=0){
        anim.cnt.served++;anim.cnt.rev+=p.e.price;const h=p.e.out==='happy';bubble(p.x+8,p.y-22,'+'+eur(p.e.price)+(h?' ★':''),h?'#8cff73':'#ffd36a');
        const s=p.seat;s.occ=null;p.st='exit';p.path=[...toPx(bfs(map,[s.cx,s.cy],[DOOR[0],STREET_ROW])),{x:Math.random()<.5?-T:RW+T,y:STREET_ROW*T}];
      }break;
      case 'exit':case 'leave':if(moveAlong(p,dt,p.v))p.gone=true;break;
    }
  }
  anim.people=anim.people.filter(p=>!p.gone);
  for(const w of anim.waiters){
    if(anim.jobs.length&&(!w.job||w.phase==='back')){w.job=anim.jobs.shift();w.phase='pick';w.path=toPx(bfs(map,tileOf(w),PICK))}
    if(!w.job){w.walking=false;if(w.dir!=='down'&&!w.path.length)w.dir='down';continue}
    if(w.pause>0){w.pause-=dt;continue}
    if(moveAlong(w,dt,82)){
      const s=w.job.seat;
      if(w.phase==='pick'){w.carry=true;w.phase='go';w.dir='up';w.pause=.25;w.path=toPx(bfs(map,PICK,[s.cx,s.cy]).slice(0,-1))}
      else if(w.phase==='go'){w.job.served=true;w.carry=false;w.phase='back';w.path=toPx(bfs(map,tileOf(w),w.home))}
      else{w.job=null;w.dir='down'}
    }
  }
  for(const b of anim.bubbles){b.life-=dt;b.y-=dt*9}
  anim.bubbles=anim.bubbles.filter(b=>b.life>0);
  if(anim.next>=ev.length&&!anim.people.length&&anim.t>=DAY_SECONDS)anim.done=true;
}
function bubble(x,y,text,col){anim.bubbles.push({x,y,text,col,life:1.6})}
function loop(ts){
  if(!anim)return;
  const dt=anim.last?Math.min(.05,(ts-anim.last)/1000):0;anim.last=ts;
  step(dt*anim.speed);drawRoom();
  if(ts-anim.lcdT>120){anim.lcdT=ts;const l=$('#lcd');if(l)l.innerHTML=lcdText()}
  if(anim.done){endAnim();return}
  requestAnimationFrame(loop);
}
function endAnim(){const res=anim.res;anim=null;idleScene=null;const rep=finishDay(res);save();render();showReport(rep)}

const FRAMES=['a','idle','b','idle'];
function drawChar(c,a,extra){

function drawRoom(){

    const ready=anim?Math.min(3,anim.jobs.length):0;for(let k=0;k<ready;k++)c.drawImage(SPR.pizza(),15*T+2+k*9,7*T-10)});

      if(p.st==='wait')c.drawImage(SPR.plate(),dx,dy);else if(p.st==='eat')c.drawImage(p.timer>1?SPR.pizza():SPR.crumbs(),dx,dy-2)}})}
  for(const s of sc.seats)add((s.cy+1)*T-1,0,()=>c.drawImage(SPR.chair(s.face),s.cx*T,s.cy*T-2));

  const fs=Math.max(9,Math.round(k*7));m.font=`700 ${fs}px Silkscreen, monospace`;m.textBaseline='middle';m.textAlign='right';

/* A 1080x1350 card (portrait, fits phone feeds): the pizza in pixel art at x3, the recipe and the site. */
const SITE='www.pizzamagna.xyz';
function recipeIngs(p){const cnt={};for(const x of p.pieces)cnt[x.i]=(cnt[x.i]||0)+1;return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(i=>ING[i].n)}
function wrapLines(c,text,maxW){const out=[];let line='';for(const w of text.split(' ')){const tryL=line?line+' '+w:w;if(c.measureText(tryL).width>maxW&&line){out.push(line);line=w}else line=tryL}if(line)out.push(line);return out}
function shareCard(p,name){
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  for(let y=0;y<H;y+=44){c.fillStyle=(y/44)%2?'#573117':'#4c2a13';c.fillRect(0,y,W,44);c.fillStyle='rgba(20,8,2,.55)';c.fillRect(0,y,W,3)}  // wood planks
  c.fillStyle='#2a1407';c.fillRect(48,48,W-96,H-96);c.fillStyle='#f3e6c6';c.fillRect(60,60,W-120,H-120);c.fillStyle='#e6d3a8';c.fillRect(60,60,W-120,8);
  c.imageSmoothingEnabled=false;
  c.fillStyle='rgba(40,25,10,.25)';c.beginPath();c.ellipse(W/2+10,320+268,262,258,0,0,Math.PI*2);c.fill();
  c.drawImage(composePizza(p),W/2-255,320,510,510);
  c.textAlign='center';
  c.fillStyle='#2c1a0b';c.font='bold 60px Silkscreen, monospace';
  const tl=wrapLines(c,name.toUpperCase(),W-200).slice(0,2);tl.forEach((l,i)=>c.fillText(l,W/2,(tl.length>1?175:205)+i*66));   // recipe name is the headline
  c.font='34px "Pixelify Sans", sans-serif';c.fillStyle='#6c5233';
  c.fillText(DOUGHS[p.dough].n+' · '+SAUCES[p.sauce].n,W/2,900);
  c.fillStyle='#2c1a0b';c.font='38px "Pixelify Sans", sans-serif';
  wrapLines(c,recipeIngs(p).join(' · '),W-200).slice(0,3).forEach((l,i)=>c.fillText(l,W/2,970+i*50));
  const by=chefLine();if(by){c.fillStyle='#7a4520';c.font='bold 36px "Pixelify Sans", sans-serif';c.fillText(by,W/2,1138)}
  c.fillStyle='#c4352a';c.fillRect(60,H-170,W-120,110);c.fillStyle='#fff1d2';c.font='bold 40px Silkscreen, monospace';c.fillText(SITE.toUpperCase(),W/2,H-100);
  return cv;
}
async function sharePizza(p,name){
  if(!p.pieces.length){toast(t('k.needmore'));return}
  try{await document.fonts.ready}catch(_){}
  const cv=shareCard(p,name),text=`${name}\n${DOUGHS[p.dough].n} · ${SAUCES[p.sauce].n}\n${recipeIngs(p).join(', ')}\n${chefLine()?chefLine()+'\n':''}${t('share.make')} ${SITE}`;
  const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
  const file=new File([blob],(name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'pizza')+'.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name,text});return}}catch(e){if(e&&e.name==='AbortError')return}
  // no system share sheet (desktop, some browsers): show the card with download and copy
  const url=URL.createObjectURL(blob);
  modal(`<h2>${esc(name)}</h2><img src="${url}" alt="${esc(name)}" style="width:100%;image-rendering:pixelated;border:3px solid var(--wood-deep)">
    <div class="row"><a class="btn primary" href="${url}" download="${file.name}">${t('share.download')}</a><button class="btn" data-act="copyshare">${t('share.copy')}</button><button class="btn ghost" data-act="close">${t('share.close')}</button></div>`);
  $('[data-act="copyshare"]').dataset.text=text;
}

document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0])importSave(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='chefName'||e.target.id==='shopName'){e.preventDefault();ACT.savechef()}else if(e.target.classList&&e.target.classList.contains('brand'))showChef()});
let rsT;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(!anim)render()},150)});

document.addEventListener('pm-music',e=>{const n=$('#musNow');if(n)n.textContent=t('mus.now',{x:e.detail})});
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/>';
function drawMute(){const b=$('#mute'),on=MUSIC.isOn();b.classList.toggle('off',!on);b.setAttribute('aria-label',t(on?'mus.off':'mus.on'));b.title=t(on?'mus.off':'mus.on');
  b.innerHTML=SPK+(on?'<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>':'<path d="M17 9l5 6M22 9l-5 6"/></svg>')}
function start(data){
  drawMute();
  MUSIC.arm();   // music starts after the first tap or key (browser rule)
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});   // static labels (nav)
  state=(data&&data.state)||load()||freshState();
  if(state.over){state=freshState();state.seenIntro=true}
  if(SANDBOX){
    state.unlocked=['base',...Object.keys(PACKS)];state.seenIntro=true;if(!['cozinha','menu'].includes(state.tab))state.tab='cozinha';
    document.querySelectorAll('#nav button').forEach(b=>{if(!['cozinha','menu'].includes(b.dataset.tab))b.hidden=true});
    $('#nav .in').style.gridTemplateColumns='repeat(2,1fr)';$('#nav .in').style.maxWidth='320px';
    document.body.classList.add('sandbox');
  }
  render();
  if(!state.chef)showChef();
  else if(!state.seenIntro){state.seenIntro=true;save();showIntro()}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!anim)render()});
}
window.claude?.hot?.snapshot?.(()=>({state}));
atlasReady.then(()=>window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{}));
</script>
