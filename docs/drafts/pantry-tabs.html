<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Magna · Pantry tabs draft</title>
<!-- Draft: the phone pantry's category tabs. A player read the top row (one topping per category) as more
     toppings. Shows the current tabs next to two proposals:
       A) the tabs look like folder tabs (shorter, darker, the open one joined to the panel);
       B) the same, with symbolic category icons drawn here (16x16, shown at 2x) instead of a topping.
     Standalone: it reads only assets/ingredients.js and the fonts, and saves nothing. -->
<style>
@font-face{font-family:'Pixelify Sans';font-weight:400 700;src:url(../../assets/fonts/pixelify-latin.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-weight:400;src:url(../../assets/fonts/silkscreen-latin.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-weight:700;src:url(../../assets/fonts/silkscreen-bold-latin.woff2) format('woff2')}
:root{
  --wood:#7a4520; --wood-hi:#a8692f; --wood-lo:#4a260f; --wood-deep:#2a1407;
  --brass:#e3b34a; --brass-hi:#fbe39a; --brass-lo:#94661a; --brass-ink:#3a2706;
  --parch:#f3e6c6; --parch-2:#e6d3a8; --ink:#2c1a0b; --muted:#6c5233; --line:#c8ad7c; --on-wood:#e9d2a2;
  --tomato:#c4352a;
  --f-pixel:'Silkscreen','Courier New',monospace;
  --f-body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;color:var(--on-wood);font-family:var(--f-body);font-size:15px;line-height:1.4;background-color:#4c2a13;
  background-image:repeating-linear-gradient(0deg,rgba(20,8,2,.55) 0 2px,transparent 2px 44px),linear-gradient(90deg,#4c2a13,#573117 50%,#4c2a13);padding:16px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2{font-family:var(--f-pixel);font-weight:700;margin:0;color:var(--brass-hi);text-shadow:2px 2px 0 var(--wood-deep)}
h1{font-size:1.1rem}h2{font-size:.9rem;margin-bottom:6px}
.lead{max-width:760px;margin:6px 0 18px}
.wrap{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.col{width:340px;max-width:100%}
.col p{font-size:.85rem;margin:8px 0 0}
.card{background:var(--parch);color:var(--ink);border:3px solid var(--wood-deep);border-radius:2px;padding:10px;
  box-shadow:inset 0 0 0 3px var(--parch-2),0 0 0 3px var(--wood-hi),0 0 0 6px var(--wood-lo),0 8px 0 6px rgba(0,0,0,.22);margin:6px}
.mings{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,50px);grid-auto-columns:50px;gap:4px;overflow-x:auto;padding-bottom:2px}
.mings button{border:2px solid var(--line);background:#fbf3df;border-radius:2px;padding:0;display:grid;place-items:center}
.mings button.on{border-color:var(--tomato);box-shadow:inset 0 0 0 2px var(--tomato)}
.mings canvas{width:40px;height:40px}

/* current */
.mcats{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.mcats button{border:2px solid var(--line);background:#fbf3df;border-radius:2px;padding:2px 0;display:grid;place-items:center}
.mcats button.on{background:var(--wood);border-color:var(--wood-deep)}
.mcats canvas{width:32px;height:32px}

/* proposals: folder tabs on a dark strip, the open one joined to the panel below */
.card.tabbed{padding:0;overflow:hidden}
.ftabs{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:var(--wood-deep);padding:5px 5px 0}
.ftabs button{border:2px solid var(--wood-lo);border-bottom:0;border-radius:5px 5px 0 0;background:var(--wood);
  padding:3px 0 2px;display:grid;place-items:center;margin-top:5px}
.ftabs button canvas{width:24px;height:24px;opacity:.75}
.ftabs button.on{background:var(--parch);border-color:var(--wood-deep);margin-top:0;padding:5px 0 6px;margin-bottom:-2px;position:relative}
.ftabs button.on canvas{width:32px;height:32px;opacity:1}
.panel{padding:8px 10px 10px;border-top:2px solid var(--wood-deep)}
.lang{margin-bottom:14px}
.lang button{font-family:var(--f-pixel);font-size:.7rem;color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;padding:5px 9px}
</style>
</head>
<body>
<h1>Pantry tabs · draft</h1>
<p class="lead" id="lead"></p>
<div class="lang"><button data-l="pt">Português</button> <button data-l="en">English</button></div>
<div class="wrap">
  <div class="col"><h2 id="h0"></h2><div class="card" id="cur"></div><p id="p0"></p></div>
  <div class="col"><h2 id="h1"></h2><div class="card tabbed" id="pa"></div><p id="p1"></p></div>
  <div class="col"><h2 id="h2"></h2><div class="card tabbed" id="pb"></div><p id="p2"></p></div>
</div>
<script src="../../assets/ingredients.js"></script>
<script>
const TX={
  en:{lead:'A player read the top row as more toppings. Tap the tabs to try each version (phone layout).',
    h0:'Now',h1:'A · folder tabs',h2:'B · A + symbolic icons',
    p0:'Tabs and toppings share the same box: the row reads as seven more toppings.',
    p1:'Same pictures, but the tabs sit on a dark strip, and the open one joins the panel.',
    p2:'As A, with icons that stand for a group instead of being one topping.',
    cat:{queijo:'Cheese',carne:'Meat',peixe:'Fish & seafood',vegetal:'Vegetables',ervas:'Herbs & spices',doce:'Sweet & fruit',extras:'Extras'}},
  pt:{lead:'Um jogador leu a fila de cima como mais ingredientes. Toca nos separadores para experimentar cada versão (formato telemóvel).',
    h0:'Atual',h1:'A · separadores',h2:'B · A + ícones simbólicos',
    p0:'Separadores e ingredientes usam a mesma caixa: a fila parece mais sete ingredientes.',
    p1:'Mesmas imagens, mas os separadores ficam numa faixa escura, e o aberto liga-se ao painel.',
    p2:'Como A, com ícones que representam um grupo em vez de serem um ingrediente.',
    cat:{queijo:'Queijo',carne:'Carne',peixe:'Peixe e marisco',vegetal:'Legumes',ervas:'Ervas e especiarias',doce:'Doce e fruta',extras:'Extras'}}};
let L=(navigator.language||'').startsWith('pt')?'pt':'en';
const CATS=['queijo','carne','peixe','vegetal','ervas','doce','extras'];
const CAT_ICON={queijo:'cheddar',carne:'coxa',peixe:'sardinha',vegetal:'cogumelos',ervas:'manjericao',doce:'banana',extras:'ovo'};   // as in the game
const ITEMS={   // a sample of each category, for the mock only
  queijo:['mozzarella','cheddar','provolone','parmesao','feta','gorgonzola','emmental','flamengo','brie','cabra','ricotta','sao_jorge','queijo_serra','burrata','catupiry'],
  carne:['fiambre','coxa','bacon','frango','pepperoni','salame','salsicha','frankfurt','vaca','ribs','carne_picada','kebab','calabresa','chourico','alheira','presunto','prosciutto','leitao'],
  peixe:['atum','sardinha','anchovas','polvo','lulas','ameijoas','bacalhau','camarao','salmao','mejillones','lagosta'],
  vegetal:['tomate','cogumelos','azeitonas','pimento','cebola','milho','espinafres','tomate_cherry','jalapenos','beringela','batata','curgete','rucula','espargos','alcachofra','grelos','padron'],
  ervas:['manjericao','oregaos','alecrim','tomilho','salsa','coentros','pimenta','piripiri'],
  doce:['banana','nutella','amora','mirtilo','framboesa','chocolate','mel','figo','pera','maca','marmelada','ananas'],
  extras:['azeite','balsamico','maionese','natas_azedas','ovo','nozes','pinhoes','batata_palha']};

/* Symbolic category icons, 16x16, one letter per pixel (palette below) */
const PAL={O:'#2a1407',
  Y:'#ffcf4a',y:'#ffe9a0',h:'#b8860f',H:'#fff3c4',d:'#e0a82a',                 // cheese: face, top, hole, hole's lit edge, shade
  R:'#b8322a',r:'#e05a50',M:'#7e1d14',F:'#f2c8b8',w:'#f4ecd8',W:'#ffffff',     // steak: meat, light, dark, fat, bone
  B:'#4f7fb0',b:'#cfe0ee',l:'#a8cdee',k:'#2e5680',                             // fish
  C:'#e8781e',c:'#b5520f',e:'#ffb25a',                                         // carrot
  G:'#3e8f2e',g:'#7cc24a',V:'#235a1c',S:'#4b6b22',T:'#9cbc4c',                 // greens, stems, the cherries' light stems
  X:'#ffb0a0',D:'#6e1018',                                                     // cherry light and dark (red is R)
  J:'#6a4220',K:'#a8743a',P:'#f3e6c6',Q:'#6b7a1a',q:'#a9b33a',Z:'#3e4a0e'};    // bottle: cork, label, oil
const SYM={
  queijo:['................','................','..........OO....','........OOyyO...','......OOyyyyOO..','....OOyyyyhyyyO.','..OOyyyyyyyyyyyO',
    '.OYYYYYYYYYYYYYO','.OYhhYYYYYYYYYdO','.OYhHYYYYYhhYYdO','.OYYYYYYYYYhHYdO','.OYYYYhhYYYYYYdO','.OYYYYhHYYYYYYdO','.OdddddddddddddO','..OOOOOOOOOOOOO.','................'],
  carne:['................','................','................','....OOOOOOO.....','..OOFFFFFFFOO...','.OFFRRRRRRRFFOO.','.OFRrrRRRRRRRFFO','OFRrRRRwwRRRRRFO',
    'OFRrRRWwwwRRRRFO','OFRRRRwwwwRRRRFO','OFRRRRRwwRRRMRO.','.OFRRRRRRRMMRO..','.OFFMRRRRRRRO...','..OOFFFFFFOO....','....OOOOOO......','................'],
  peixe:['................','................','......OOO.......','.....OkkkO....OO','...OOBBBBBOO.OBO','..OBBlBlBBBBOOBO','.OBWOBkBBlBBBBO.','OBBBBBkBBBBBBBO.',
    'ObbbbbkbbbbbbbO.','.ObbbbbbbbbbOOBO','..OObbbbbbOO.OBO','....OOkkOO....OO','......OO........','................','................','................'],
  vegetal:['....G..g..G.....','.....GggGgG.....','......GGGG......','....OOOOOOOO....','....OeCCCCcO....','....OeCcCCCO....','.....OeCCCCO....','.....OCCccO.....',
    '......OeCCO.....','......OCcCO.....','......OeCO......','.......OCO......','.......OO.......','................','................','................'],
  ervas:['................','.......OO.......','......OggO......','.....OggVgO.....','.....OgVGgO.....','.OOO..OVGO..OOO.','OggVO..SS..OVgGO','OgVGGO.SS.OGVGGO',
    '.OGGGGOSSOGGGGO.','..OOOOOSSOOOOO..','.......SS.......','......SS........','.....SS.........','................','................','................'],
  doce:['...........gG...','..........TgGG..','.........T.T....','........T...T...','.......T....T...','......T.....T...','...OOTOO...OTOO.','..ORXRRO..ORXRRO',
    '..OXRRRO..OXRRRO','..ORRRDO..ORRRDO','..ODRDDO..ODRDDO','...OOOO....OOOO.','................','................','................','................'],
  extras:['......OOO.......','......OKO.......','......OJO.......','......OOO.......','......OQO.......','.....OQqQO......','....OQqQQQO.....','....OqQQQZO.....',
    '....OPPPPPO.....','....OPYGYPO.....','....OPPPPPO.....','....OqQQQZO.....','....OqQQQZO.....','....OOOOOOO.....','................','................']};
function drawSym(cv,cat){const c=cv.getContext('2d');c.clearRect(0,0,32,32);
  const rows=SYM[cat],h=rows.length,top=Math.round((16-h)/2);
  // centre the drawing vertically and horizontally from its painted bounds
  let x0=16,x1=-1,y0=16,y1=-1;rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch!=='.'){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}}));
  const dx=Math.floor((16-(x1-x0+1))/2)-x0,dy=Math.floor((16-(y1-y0+1))/2)-y0;
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(PAL[ch]){c.fillStyle=PAL[ch];c.fillRect((x+dx)*2,(y+dy+top)*2,2,2)}}));}

const img=new Image();img.src=ATLAS.src;
function key(id){const f=ATLAS.frames;return f[id+'_n']?id+'_n':f[id+'_0']?id+'_0':null}
function drawIng(cv,id){const c=cv.getContext('2d');c.clearRect(0,0,32,32);const k=key(id);if(!k)return;
  const [sx,sy,w,h]=ATLAS.frames[k],s=Math.min(1,31/Math.max(w,h));c.imageSmoothingEnabled=s<1;
  c.drawImage(img,sx,sy,w,h,Math.round(16-w*s/2),Math.round(16-h*s/2),w*s,h*s)}

const st={cur:'queijo',pa:'queijo',pb:'queijo'},sel={};
function grid(cat,id){const ids=ITEMS[cat].filter(key);sel[id]=sel[id]&&ids.includes(sel[id])?sel[id]:ids[0];
  return `<div class="mings">${ids.map(k=>`<button class="${sel[id]===k?'on':''}" data-ing="${k}" title="${k}"><canvas data-i="${k}" width="32" height="32"></canvas></button>`).join('')}</div>`}
function render(){
  const T=TX[L];document.documentElement.lang=L;
  for(const k of ['lead','h0','h1','h2','p0','p1','p2'])document.getElementById(k).textContent=T[k];
  const c=st.cur;
  document.getElementById('cur').innerHTML=`<div class="mcats">${CATS.map(x=>`<button class="${x===c?'on':''}" data-cat="${x}" title="${T.cat[x]}"><canvas data-i="${CAT_ICON[x]}" width="32" height="32"></canvas></button>`).join('')}</div>${grid(c,'cur')}`;
  for(const id of ['pa','pb']){const c=st[id];
    document.getElementById(id).innerHTML=`<div class="ftabs" role="tablist">${CATS.map(x=>`<button role="tab" aria-selected="${x===c}" class="${x===c?'on':''}" data-cat="${x}" title="${T.cat[x]}" aria-label="${T.cat[x]}"><canvas ${id==='pb'?`data-s="${x}"`:`data-i="${CAT_ICON[x]}"`} width="32" height="32"></canvas></button>`).join('')}</div>
      <div class="panel">${grid(c,id)}</div>`}
  document.querySelectorAll('canvas[data-i]').forEach(cv=>drawIng(cv,cv.dataset.i));
  document.querySelectorAll('canvas[data-s]').forEach(cv=>drawSym(cv,cv.dataset.s));
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const box=b.closest('.card');
  if(b.dataset.l){L=b.dataset.l;return render()}
  if(b.dataset.cat){st[box.id]=b.dataset.cat;return render()}
  if(b.dataset.ing){sel[box.id]=b.dataset.ing;render()}});
img.onload=render;render();
</script>
</body>
</html>
