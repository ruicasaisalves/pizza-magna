<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Magna · City draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Pixelify+Sans:wght@400;600;700&display=swap">
<!-- Draft of the city screen (see docs/roadmap.md, "City and property").
     Standalone: it does not read or write the game's save.
     The city is a 6x5 grid of square blocks drawn in code into one 904x704 logical map: perimeter blocks
     (buildings around an inner courtyard, hipped roofs, shopfronts on the street), square houses, villas,
     landmarks and a river. The screen shows part of it, scaled up with nearest-neighbour; drag to move. -->
<style>
:root{
  --wood:#7a4520; --wood-hi:#a8692f; --wood-lo:#4a260f; --wood-deep:#2a1407;
  --brass:#e3b34a; --brass-hi:#fbe39a; --brass-lo:#94661a; --brass-ink:#3a2706;
  --parch:#f3e6c6; --parch-2:#e6d3a8; --ink:#2c1a0b; --muted:#6c5233; --line:#c8ad7c; --on-wood:#e9d2a2;
  --tomato:#c4352a; --tomato-hi:#e8705a; --tomato-lo:#7e1d14; --cheese:#ffcf4a;
  --lcd-bg:#081008; --lcd:#8cff73; --lcd-dim:#3f7f33;
  --f-pixel:'Silkscreen','Courier New',monospace;
  --f-lcd:'VT323','Courier New',monospace;
  --f-body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;color:var(--on-wood);font-family:var(--f-body);font-size:15px;line-height:1.4;background-color:#4c2a13;
  background-image:repeating-linear-gradient(0deg,rgba(20,8,2,.55) 0 2px,transparent 2px 44px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 9px),linear-gradient(90deg,#4c2a13,#573117 50%,#4c2a13)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}
button:disabled{cursor:not-allowed;filter:grayscale(.7);opacity:.6}
h1,h2,h3{font-family:var(--f-pixel);font-weight:700;margin:0;letter-spacing:.01em;line-height:1.15;text-wrap:balance}
h2{font-size:1.1rem}h3{font-size:.92rem}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(var(--wood-hi),var(--wood) 30%,var(--wood-lo));border-bottom:4px solid var(--wood-deep);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.brand{font-family:var(--f-pixel);font-weight:700;font-size:1rem;color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 50%,var(--brass-lo));padding:6px 10px;border:2px solid var(--brass-ink);border-radius:3px;white-space:nowrap}
.crumb{font-family:var(--f-pixel);font-size:.8rem;color:var(--brass-hi);flex:1;min-width:0}
.btn{font-family:var(--f-pixel);font-size:.74rem;font-weight:700;text-transform:uppercase;color:var(--brass-ink);
  background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;padding:8px 12px;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),inset -1px -1px 0 rgba(0,0,0,.25),0 3px 0 var(--wood-deep)}
.btn.primary{background:linear-gradient(var(--tomato-hi),var(--tomato) 45%,var(--tomato-lo));color:#fff1d2;border-color:#3a0c06}
.btn.ghost{background:linear-gradient(#f6ead0,#dcc699)}
.btn.sm{padding:6px 9px;font-size:.66rem}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;max-width:1280px;margin:22px auto;padding:0 16px;align-items:start}
@media(max-width:880px){.wrap{grid-template-columns:1fr;gap:22px}}
.frame{position:relative;border:6px solid var(--wood);background:var(--wood-deep);box-shadow:inset 0 0 0 2px var(--wood-deep),0 0 0 2px var(--wood-hi),0 0 0 5px var(--wood-deep),0 8px 0 5px rgba(0,0,0,.25)}
#map{width:100%;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:36px;height:36px;padding:0;font-size:1rem}
.side{display:flex;flex-direction:column;gap:26px}
.card{background:var(--parch);color:var(--ink);border:3px solid var(--wood-deep);border-radius:2px;padding:14px;
  box-shadow:inset 0 0 0 3px var(--parch-2),0 0 0 3px var(--wood-hi),0 0 0 6px var(--wood-lo),0 8px 0 6px rgba(0,0,0,.22)}
.lcd{background:var(--lcd-bg);border:3px solid #000;padding:6px;box-shadow:inset 0 0 0 2px #1d2a1d}
#mini{width:100%;cursor:crosshair;touch-action:none}
.lcdline{display:flex;justify-content:space-between;font-family:var(--f-lcd);font-size:1.2rem;color:var(--lcd);line-height:1;padding:4px 2px 0;text-shadow:0 0 5px rgba(140,255,115,.4)}
.lcdline span:last-child{color:var(--lcd-dim)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:2px solid #120a04;display:inline-block}
.tag{font-family:var(--f-pixel);font-size:.6rem;text-transform:uppercase;padding:3px 6px;border:2px solid var(--ink);background:#fbf3df;white-space:nowrap}
.status{display:inline-block;font-family:var(--f-pixel);font-size:.66rem;text-transform:uppercase;color:#fff;padding:3px 7px;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0}
.kv dt{font-family:var(--f-pixel);font-size:.62rem;text-transform:uppercase;color:var(--muted);align-self:center}
.kv dd{margin:0;font-family:var(--f-lcd);font-size:1.3rem;line-height:1.05;font-variant-numeric:tabular-nums;text-align:right}
.mix{display:flex;height:14px;border:2px solid var(--ink);margin:6px 0 4px}
.mix b{display:block;height:100%}
.mixkey{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.78rem;color:var(--muted)}
.mixkey i{display:inline-block;width:8px;height:8px;margin-right:4px;border:1px solid var(--ink)}
.hoods{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.hoods button{all:unset;cursor:pointer;display:block;padding:8px;border:2px solid var(--line);background:#fbf3df}
.hoods button[aria-pressed=true]{border-color:var(--ink);background:#fff7e2}
.hoods button:hover,.hoods button:focus-visible{border-color:var(--ink)}
.hoods h3{display:flex;justify-content:space-between;gap:8px}
.hoods h3 small{font-family:var(--f-lcd);font-size:1.1rem;font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.close{float:right}
</style>
</head>
<body>
<header class="hdr">
  <span class="brand">PIZZA MAGNA</span>
  <span class="crumb" data-i18n="title"></span>
  <button class="btn sm ghost" id="lang"></button>
</header>
<main class="wrap">
  <section>
    <div class="frame">
      <canvas id="map" aria-label="City map"></canvas>
      <div class="zoom"><button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">−</button></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>
  <div class="side">
    <div class="card"><div class="lcd"><canvas id="mini"></canvas><div class="lcdline"><span id="lcdcity"></span><span id="lcdhint"></span></div></div></div>
    <aside class="card" id="info" aria-live="polite"></aside>
  </div>
</main>
<script>
/* ================= LANGUAGE ================= */
const I18N={
  en:{title:'City · draft',lang:'PT',city:'PORTO MAGNO',hint:'DRAG TO MOVE',
    intro:'Choose where to open the next pizzeria. Each neighbourhood draws different customers; busier streets cost more.',
    pick:'Drag the map to look around and tap a building to see it.',avgrent:'from $%/day',
    'hood.uni':'University','hood.baixa':'Old Town','hood.resid':'Residential','hood.chique':'Riverside',
    'seg.est':'Students','seg.fam':'Families','seg.tur':'Tourists','seg.gou':'Gourmets',
    'k.mine':'Your pizzeria','k.rival':'Rival','k.rent':'For rent','k.sale':'For sale','k.taken':'Occupied','k.land':'Landmark',
    'pin.mine':'YOU','pin.rival':'VS','pin.rent':'RENT','pin.sale':'SALE',
    tables:'Tables',traffic:'Foot traffic',cond:'Condition',rent:'Rent',price:'Price',perday:'/day',mix:'Customers here',
    'c.new':'Like new','c.good':'Good','c.works':'Needs work (%)',
    bRent:'Rent',bBuy:'Buy',bSpy:'See their menu',bManage:'Manage',back:'Back',
    note:'Draft: renting and buying are not wired to the game yet.',
    'land.campus':'University','d.campus':'Brings students all year, except in August.',
    'land.sports':'Sports ground','d.sports':'Students in the week, families at the weekend.',
    'land.church':'Cathedral','d.church':'Tour groups stop here every morning.',
    'land.square':'Main square','d.square':'The busiest spot in town: everyone walks through.',
    'land.park':'City park','d.park':'Full of families at the weekend.',
    'land.market':'Market hall','d.market':'Fresh produce every morning; cheaper suppliers nearby.',
    'b.cafe':'Café','b.books':'Bookshop','b.bakery':'Bakery','b.bank':'Bank','b.laundry':'Laundry','b.flats':'Flats','b.gym':'Gym','b.florist':'Florist',
    'b.cinema':'Cinema','b.hotel':'Hotel','b.pharmacy':'Pharmacy','b.shoes':'Shoe shop','b.bar':'Bar','b.home':'Home','b.villa':'Villa'},
  pt:{title:'Cidade · rascunho',lang:'EN',city:'PORTO MAGNO',hint:'ARRASTA O MAPA',
    intro:'Escolhe onde abrir a próxima pizzaria. Cada bairro atrai clientes diferentes; as ruas com mais movimento são mais caras.',
    pick:'Arrasta o mapa para veres a cidade e toca num edifício.',avgrent:'desde $%/dia',
    'hood.uni':'Universidade','hood.baixa':'Baixa','hood.resid':'Residencial','hood.chique':'Beira-Rio',
    'seg.est':'Estudantes','seg.fam':'Famílias','seg.tur':'Turistas','seg.gou':'Gourmets',
    'k.mine':'A tua pizzaria','k.rival':'Rival','k.rent':'Para arrendar','k.sale':'À venda','k.taken':'Ocupado','k.land':'Ponto de interesse',
    'pin.mine':'TU','pin.rival':'VS','pin.rent':'ARRENDA','pin.sale':'VENDE',
    tables:'Mesas',traffic:'Movimento',cond:'Estado',rent:'Renda',price:'Preço',perday:'/dia',mix:'Clientes aqui',
    'c.new':'Como novo','c.good':'Bom','c.works':'Precisa de obras (%)',
    bRent:'Arrendar',bBuy:'Comprar',bSpy:'Ver o menu',bManage:'Gerir',back:'Voltar',
    note:'Rascunho: arrendar e comprar ainda não estão ligados ao jogo.',
    'land.campus':'Universidade','d.campus':'Traz estudantes o ano todo, menos em agosto.',
    'land.sports':'Campo de jogos','d.sports':'Estudantes durante a semana, famílias ao fim de semana.',
    'land.church':'Sé','d.church':'Os grupos de turistas param aqui todas as manhãs.',
    'land.square':'Praça principal','d.square':'O sítio com mais movimento da cidade: toda a gente passa por aqui.',
    'land.park':'Parque da cidade','d.park':'Cheio de famílias ao fim de semana.',
    'land.market':'Mercado','d.market':'Produtos frescos todas as manhãs; fornecedores mais baratos perto.',
    'b.cafe':'Café','b.books':'Livraria','b.bakery':'Padaria','b.bank':'Banco','b.laundry':'Lavandaria','b.flats':'Apartamentos','b.gym':'Ginásio','b.florist':'Florista',
    'b.cinema':'Cinema','b.hotel':'Hotel','b.pharmacy':'Farmácia','b.shoes':'Sapataria','b.bar':'Bar','b.home':'Moradia','b.villa':'Vivenda'}
};
let LANG=(()=>{try{const p=localStorage.getItem('pm-lang');if(p==='en'||p==='pt')return p}catch(_){}return /^pt\b/i.test(navigator.language||'')?'pt':'en'})();
const t=(k,v)=>{const s=(I18N[LANG][k]??I18N.en[k]??k);return v===undefined?s:s.replace('%',v)};

/* ================= CITY LAYOUT ================= */
const ROAD=24,BLK=112,STEP=BLK+ROAD,NBX=6,NBY=5,RIVER=64;
const LW=ROAD+NBX*STEP+RIVER, LH=ROAD+NBY*STEP;          // 904 x 704
const RX=ROAD+NBX*STEP;                                   // where the river starts
// customer mix (students, families, tourists, gourmets), rent factor, base foot traffic (1-5), roof colours
const HOODS={
  uni:{mix:[60,15,10,15],rent:1,traffic:3},
  baixa:{mix:[15,20,45,20],rent:1.5,traffic:4},
  resid:{mix:[8,67,10,15],rent:.8,traffic:2},
  chique:{mix:[5,22,18,55],rent:2.2,traffic:2}
};
const SEGS=[['est','#f08a3b'],['fam','#3d8ee0'],['tur','#24a067'],['gou','#8a55d0']];
const KCOL={mine:'#c4352a',rival:'#e0861e',rent:'#2e8b3a',sale:'#2f68c8',taken:'#7a6a55',land:'#94661a'};
const U='uni',B='baixa',S='resid',C='chique';
const HMAP=[[U,U,B,B,C,C],[U,U,B,B,B,C],[S,S,B,B,C,C],[S,S,S,B,S,C],[S,S,S,S,S,C]];
const SPECIAL={'1,0':'campus','0,1':'sports','3,0':'church','2,1':'square','1,3':'park','3,2':'market'};
const HSTREET=['Rua do Sol','Rua Larga','Avenida Central','Rua das Flores','Rua Nova','Rua do Mar'];
const VSTREET=['Rua das Escolas','Rua da Sé','Rua Direita','Avenida da Ribeira','Rua Velha','Rua do Cais','Rua do Rio'];
const AVENUE_H=2,AVENUE_V=3;
function rngOf(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let r=Math.imul(seed^seed>>>15,1|seed);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
const D=28,FH=14,RH=BLK-FH;   // perimeter wing depth, façade height, roof height of a perimeter block

/* ================= LOTS ================= */
const LOTS=[],BLOCKS=[];
function split(len,rnd){const out=[];let left=len;while(left>0){let w=left<=40?left:[26,30,34,38][Math.floor(rnd()*4)];if(left-w<24&&left-w>0)w=left;out.push(w);left-=w}return out}
for(let cy=0;cy<NBY;cy++)for(let cx=0;cx<NBX;cx++){
  const hood=HMAP[cy][cx],sp=SPECIAL[cx+','+cy],bx=ROAD+cx*STEP,by=ROAD+cy*STEP,rnd=rngOf(cx*97+cy*13+5);
  const blk={cx,cy,bx,by,hood,type:sp?'land':hood==='resid'?'houses':hood==='chique'?'villas':'perim',land:sp,lots:[]};
  BLOCKS.push(blk);
  const add=(x,y,w,h,side,extra={})=>{const l={blk,x:bx+x,y:by+y,w,h,side,hood,seed:Math.floor(rnd()*1e6),...extra};blk.lots.push(l);LOTS.push(l);return l};
  if(sp){add(0,0,BLK,BLK,'all',{land:sp});continue}
  if(blk.type==='perim'){
    let x=0;for(const w of split(BLK,rnd)){add(x,RH-D,w,D+FH,'S');x+=w}       // south wing: shopfronts on the street
    x=0;for(const w of split(BLK,rnd)){add(x,0,w,D,'N');x+=w}
    let y=D;for(const h of split(RH-2*D,rnd)){add(0,y,D,h,'W');add(BLK-D,y,D,h,'E');y+=h}
  }else if(blk.type==='houses'){
    for(let i=0;i<4;i++){add(2+i*27,2,26,30,'N');add(2+i*27,BLK-32,26,30,'S')}
    add(2,41,26,30,'W');add(BLK-28,41,26,30,'E');
  }else{
    for(let j=0;j<2;j++)for(let i=0;i<2;i++)add(i*56,j*56,56,56,j?'S':'N');
  }
}
// the player's first shop and the five rivals: [block x, block y, nth lot of the block, kind, name]
const PLACES=[[1,1,1,'mine'],[0,0,0,'rival','Pizza Rápida'],[3,1,1,'rival','Trattoria Bella'],[2,3,5,'rival','Forno do Zé'],[4,0,3,'rival','Casa Nápoles'],[2,2,0,'rival','La Brasa']];
const BIZ={uni:['cafe','books','bar','laundry','flats','gym','pharmacy'],baixa:['cafe','hotel','cinema','bakery','shoes','bank','florist','bar'],resid:['home'],chique:['villa']};
for(const l of LOTS){
  const r=rngOf(l.seed);
  if(l.land){l.kind='land';continue}
  const p=PLACES.find(p=>p[0]===l.blk.cx&&p[1]===l.blk.cy&&l.blk.lots[p[2]]===l);
  const shop=l.blk.type==='perim';
  l.kind=p?p[3]:r()<(shop?.17:.06)?'rent':r()<(shop?.12:.07)?'sale':'taken';
  if(p&&p[4])l.name=p[4];
  const pool=BIZ[l.hood];l.biz=pool[Math.floor(r()*pool.length)];
  const H=HOODS[l.hood];
  l.tables=Math.max(6,Math.min(30,Math.round(l.w*l.h/64*.8)));
  // the street in front: south side faces the road below, north the road above, west/east the side roads
  const {cx,cy}=l.blk;
  const hi=l.side==='S'?cy+1:l.side==='N'?cy:null, vi=l.side==='W'?cx:l.side==='E'?cx+1:null;
  l.street=hi!=null?HSTREET[hi]:VSTREET[vi];
  const onAvenue=hi===AVENUE_H||vi===AVENUE_V;
  const nearSquare=Math.abs(cx-2)+Math.abs(cy-1)===1;
  l.traffic=Math.max(1,Math.min(5,H.traffic+(onAvenue?1:0)+(nearSquare?1:0)-(r()<.3?1:0)-(shop?0:1)));
  l.rent=Math.round(H.rent*l.tables*3.5*(.7+l.traffic*.15));
  l.price=Math.round(l.rent*90/500)*500;
  const c=r();l.cond=c<.3?'new':c<.7?'good':'works';l.works=Math.round((300+r()*900)/50)*50;
  l.addr=`${l.street}, ${2+Math.floor(((l.side==='W'||l.side==='E'?l.y:l.x)%STEP)/6)*2+(l.side==='N'||l.side==='E'?1:0)}`;
  l.paint=Math.floor(r()*5);l.tone=Math.floor(r()*3);
}
const lotAt=(x,y)=>LOTS.find(l=>x>=l.x&&x<l.x+l.w&&y>=l.y&&y<l.y+l.h)||null;

/* ================= DRAWING ================= */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const [BG,bg]=mk(LW,LH),[LOW,low]=mk(LW,LH);
let X=bg;const R=(col,a,b,w=1,h=1)=>{X.fillStyle=col;X.fillRect(a,b,w,h)};
function disc(cx,cy,r,col){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.8)R(col,cx+x,cy+y)}
function tree(x,y,s=5,dark){R('rgba(0,0,0,.28)',x-s+3,y+2,s*2,s);disc(x,y,s,dark?'#1f4d22':'#2a6328');disc(x-1,y-1,s-1,dark?'#2a6328':'#3f8f3a');disc(x-2,y-2,Math.max(1,s-3),'#7cc35a')}
function cypress(x,y){R('rgba(0,0,0,.28)',x+1,y+2,5,9);for(let i=0;i<10;i++){const w=i<2?1:i<4?2:i<8?3:2;R('#1f4d22',x-Math.floor(w/2),y-8+i,w+1,1)}R('#3f8f3a',x-1,y-5,1,5)}
function palm(x,y){R('rgba(0,0,0,.25)',x,y+8,7,2);for(let i=0;i<9;i++)R('#8a6236',x+(i>5?1:0),y+i,2,1);
  for(const [dx,dy] of [[-5,-1],[-4,-2],[-3,-3],[4,-1],[3,-2],[2,-3],[-2,1],[3,1],[0,-4],[1,-4]])R('#3f8f3a',x+dx,y+dy,2,1);R('#7cc35a',x-1,y-2,4,2)}

// Hipped roof, seen from above: every pixel belongs to the slope of its nearest edge, so ridges and hips
// appear by themselves. With `hole`, it is a ring of wings around a courtyard (the inner slopes face it).
const ROOFS={
  terra:['#4e1a0e','#94361c','#bb4d29','#d9683a','#f39a62'],
  terra2:['#4a1a10','#8a3a22','#ad5230','#c96a40','#e8946a'],
  brick:['#3a1810','#73301f','#90402c','#ab573f','#c9775b'],
  slate:['#1d2129','#363d49','#4a5260','#5f6979','#8a96a8'],
  marble:['#5c5850','#8f8a80','#aaa59a','#c9c3b8','#e6e1d6'],
  green:['#18301f','#2f5a3a','#3f7349','#558e5e','#7fb886']
};
function hip(w,h,ramp,hole){
  const [c,x]=mk(w,h),id=x.createImageData(w,h),a=id.data,P=ramp.map(hex);
  const LV={N:3,W:2,E:1,S:1};
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){
    const cand=[[y,'N'],[h-1-y,'S'],[i,'W'],[w-1-i,'E']];
    if(hole){const [hx,hy,hw,hh]=hole;if(i>=hx&&i<hx+hw&&y>=hy&&y<hy+hh)continue;
      const dx1=hx-i,dx2=i-(hx+hw-1),dy1=hy-y,dy2=y-(hy+hh-1),m=Math.max(dx1,dx2,dy1,dy2);
      cand.push([m-1,m===dy1?'S':m===dy2?'N':m===dx1?'E':'W',1])}
    cand.sort((p,q)=>p[0]-q[0]);
    const [d,f,inner]=cand[0];
    let lv=LV[f];
    if(d%3===2)lv-=1;                                    // rows of tiles

function zoom(d){const cx=cam.x+viewW()/2,cy=cam.y+viewH()/2;zi=Math.max(0,Math.min(ZOOMS.length-1,zi+d));fit();centerOn(cx,cy)}
function ribbon(ctx,text,x,y,fs,fg,bgc,align='left'){ctx.font=`700 ${fs}px Silkscreen, monospace`;const tw=ctx.measureText(text).width+fs*.9;const bx=Math.round(align==='center'?x-tw/2:x);
  ctx.fillStyle='#120a04';ctx.fillRect(bx-2,Math.round(y-2),Math.round(tw+4),Math.round(fs*1.5+4));ctx.fillStyle=bgc;ctx.fillRect(bx,Math.round(y),Math.round(tw),Math.round(fs*1.5));
  ctx.fillStyle=fg;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(text,bx+fs*.45,y+fs*.8)}
const HOOD_AT={uni:[0,0],baixa:[2,0],resid:[0,2],chique:[4,0]};
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  low.drawImage(BG,0,0);drawLife(dt);
  if(focusHood){low.fillStyle='rgba(18,10,4,.55)';for(const b of BLOCKS)if(b.hood!==focusHood)low.fillRect(b.bx-6,b.by-6,BLK+12,BLK+12)}
  const sx=Math.round(cam.x*s)/s,sy=Math.round(cam.y*s)/s;
  m.imageSmoothingEnabled=false;m.fillStyle='#2a1407';m.fillRect(0,0,cv.width,cv.height);
  m.drawImage(LOW,sx,sy,viewW(),viewH(),0,0,cv.width,cv.height);
  const P=(x,y)=>[(x-sx)*s,(y-sy)*s],dpr=cv.width/cv.clientWidth;
  const fs=Math.round(Math.max(8*dpr,Math.min(13*dpr,s*4.2)));
  for(const b of BLOCKS)if(b.land){const [x,y]=P(b.bx+BLK/2,b.by+3);ribbon(m,t('land.'+b.land).toUpperCase(),x,y,fs*.85,'#fbe39a','rgba(42,20,7,.85)','center')}
  for(const h in HOOD_AT){const b=BLOCKS.find(b=>b.cx===HOOD_AT[h][0]&&b.cy===HOOD_AT[h][1]);const [x,y]=P(b.bx-4,b.by-ROAD+4);ribbon(m,t('hood.'+h).toUpperCase(),x,y,fs,'#ffcf4a','rgba(42,20,7,.92)')}
  const far=ZOOMS[zi]<1.5;      // zoomed out: only your pizzeria and the rivals get a pin
  for(const l of LOTS){if(!['mine','rival','rent','sale'].includes(l.kind)||(far&&(l.kind==='rent'||l.kind==='sale')))continue;
    const [x,y]=P(l.x+l.w/2,l.y+(l.side==='S'?D*.45:l.h*.38));ribbon(m,t('pin.'+l.kind),x,y-fs*.75,fs*.8,'#fff',KCOL[l.kind],'center')}
  const box=(l,col,wd)=>{const [x,y]=P(l.x,l.y);m.strokeStyle=col;m.lineWidth=wd;m.strokeRect(x+wd/2,y+wd/2,l.w*s-wd,l.h*s-wd)};
  if(hover&&hover!==sel&&!drag.moved)box(hover,'rgba(255,241,210,.85)',Math.max(2,dpr*2));
  if(sel){box(sel,'#120a04',Math.max(4,dpr*4));box(sel,Math.floor(now/400)%2?'#ffcf4a':'#fbe39a',Math.max(2,dpr*2))}
  drawMini();
  requestAnimationFrame(frame);
}
function drawMini(){
  const k=mini.width/LW;mm.imageSmoothingEnabled=true;mm.drawImage(BG,0,0,mini.width,mini.height);
  mm.fillStyle='rgba(8,16,8,.35)';mm.fillRect(0,0,mini.width,mini.height);
  for(const l of LOTS){if(!['mine','rival','rent','sale'].includes(l.kind))continue;mm.fillStyle=KCOL[l.kind];const r=Math.max(2,k*6);mm.fillRect((l.x+l.w/2)*k-r,(l.y+l.h/2)*k-r,r*2,r*2)}
  mm.strokeStyle='#8cff73';mm.lineWidth=Math.max(1,k*3);mm.strokeRect(cam.x*k,cam.y*k,viewW()*k,viewH()*k);
}
// drag to move, tap to pick; the minimap moves the camera too
const drag={on:false,moved:false,x:0,y:0,cx:0,cy:0};
const toMap=e=>{const r=cv.getBoundingClientRect();return[cam.x+(e.clientX-r.left)/r.width*viewW(),cam.y+(e.clientY-r.top)/r.height*viewH()]};
cv.addEventListener('pointerdown',e=>{drag.on=true;drag.moved=false;drag.x=e.clientX;drag.y=e.clientY;drag.cx=cam.x;drag.cy=cam.y;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{
  if(drag.on){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5){drag.moved=true;cv.classList.add('drag')}
    if(drag.moved){const k=viewW()/cv.getBoundingClientRect().width;cam.x=drag.cx-dx*k;cam.y=drag.cy-dy*k;clampCam()}}
  else hover=lotAt(...toMap(e));
});
cv.addEventListener('pointerup',e=>{if(drag.on&&!drag.moved){sel=lotAt(...toMap(e));focusHood=null;info()}drag.on=false;cv.classList.remove('drag')});
cv.addEventListener('pointerleave',()=>{hover=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1:-1)},{passive:false});
const miniMove=e=>{const r=mini.getBoundingClientRect();centerOn((e.clientX-r.left)/r.width*LW,(e.clientY-r.top)/r.height*LH)};
mini.addEventListener('pointerdown',e=>{mini.setPointerCapture(e.pointerId);miniMove(e)});
mini.addEventListener('pointermove',e=>{if(e.buttons)miniMove(e)});
document.getElementById('zin').onclick=()=>zoom(1);document.getElementById('zout').onclick=()=>zoom(-1);
addEventListener('keydown',e=>{const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(k&&document.activeElement===document.body){cam.x+=k[0]*40;cam.y+=k[1]*40;clampCam();e.preventDefault()}});

/* ================= INFO PANEL ================= */
const $=q=>document.querySelector(q);
const money=v=>'$'+v.toLocaleString('en-US');
function mixHTML(mix){return `<div class="mix">${mix.map((v,i)=>`<b style="width:${v}%;background:${SEGS[i][1]}" title="${t('seg.'+SEGS[i][0])} ${v}%"></b>`).join('')}</div>
  <div class="mixkey">${mix.map((v,i)=>`<span><i style="background:${SEGS[i][1]}"></i>${t('seg.'+SEGS[i][0])} ${v}%</span>`).join('')}</div>`}
const dots=n=>'●'.repeat(n)+'○'.repeat(5-n);
function info(){
  const el=$('#info'),l=sel;
  if(!l){
    el.innerHTML=`<h2>${t('title')}</h2><p class="sub">${t('intro')}</p><p class="sub">${t('pick')}</p>
    <div class="hoods">${Object.keys(HOODS).map(h=>{const min=Math.min(...LOTS.filter(l=>l.hood===h&&l.rent).map(l=>l.rent));
      return `<button data-hood="${h}" aria-pressed="${focusHood===h}"><h3>${t('hood.'+h)}<small>${t('avgrent',min)}</small></h3>${mixHTML(HOODS[h].mix)}</button>`}).join('')}</div>`;
    el.querySelectorAll('[data-hood]').forEach(b=>b.onclick=()=>{focusHood=focusHood===b.dataset.hood?null:b.dataset.hood;
      if(focusHood){const bl=BLOCKS.filter(x=>x.hood===focusHood);centerOn(bl.reduce((a,x)=>a+x.bx,0)/bl.length+BLK/2,bl.reduce((a,x)=>a+x.by,0)/bl.length+BLK/2)}info()});
    return;
  }
  const head=`<button class="btn sm ghost close" data-back>${t('back')}</button><span class="tag">${t('hood.'+l.hood)}</span>`;
  if(l.kind==='land'){
    el.innerHTML=`${head}<h2 style="margin-top:12px">${t('land.'+l.land)}</h2><span class="status" style="background:${KCOL.land}">${t('k.land')}</span><p class="sub">${t('d.'+l.land)}</p><h3 style="margin-top:14px">${t('mix')}</h3>${mixHTML(HOODS[l.hood].mix)}`;
  }else{
    const title=l.kind==='rival'?l.name:l.kind==='taken'?t('b.'+l.biz):l.kind==='mine'?'Pizza Magna':l.addr;
    const cond=l.cond==='works'?t('c.works',money(l.works)):t('c.'+l.cond);
    const btns=l.kind==='rent'?`<button class="btn primary" disabled>${t('bRent')} · ${money(l.rent)}${t('perday')}</button>`
      :l.kind==='sale'?`<button class="btn primary" disabled>${t('bBuy')} · ${money(l.price)}</button>`
      :l.kind==='rival'?`<button class="btn" disabled>${t('bSpy')}</button>`:l.kind==='mine'?`<button class="btn" disabled>${t('bManage')}</button>`:'';
    el.innerHTML=`${head}<h2 style="margin-top:12px">${title}</h2>${l.kind!=='rent'&&l.kind!=='sale'?`<p class="sub">${l.addr}</p>`:''}
      <span class="status" style="background:${KCOL[l.kind]}">${t('k.'+l.kind)}</span>
      <dl class="kv"><dt>${t('tables')}</dt><dd>${l.tables}</dd><dt>${t('traffic')}</dt><dd>${dots(l.traffic)}</dd>
      ${l.kind==='rent'||l.kind==='sale'?`<dt>${t('cond')}</dt><dd style="font-size:1.1rem">${cond}</dd>`:''}
      ${l.kind==='sale'?`<dt>${t('price')}</dt><dd>${money(l.price)}</dd>`:`<dt>${t('rent')}</dt><dd>${money(l.rent)}${t('perday')}</dd>`}</dl>
      <h3>${t('mix')}</h3>${mixHTML(HOODS[l.hood].mix)}
      ${btns?`<div class="row" style="margin-top:14px">${btns}</div><p class="note">${t('note')}</p>`:''}`;
  }
  el.querySelector('[data-back]').onclick=()=>{sel=null;info()};
}
function legend(){$('#legend').innerHTML=['mine','rival','rent','sale'].map(k=>`<span><i style="background:${KCOL[k]}"></i>${t('k.'+k)}</span>`).join('')}
function texts(){document.documentElement.lang=LANG;document.title='Pizza Magna · '+t('title');document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  $('#lang').textContent=t('lang');$('#lcdcity').textContent=t('city');$('#lcdhint').textContent=t('hint');legend();info()}
$('#lang').onclick=()=>{LANG=LANG==='pt'?'en':'pt';try{localStorage.setItem('pm-lang',LANG)}catch(_){}texts()};

drawBG();fit();texts();
{const me=LOTS.find(l=>l.kind==='mine');centerOn(me.x+me.w/2,me.y+me.h/2)}
addEventListener('resize',fit);
requestAnimationFrame(frame);
</script>
</body>
</html>
