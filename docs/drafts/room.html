<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Magna · Room draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Pixelify+Sans:wght@400;600;700&display=swap">
<!-- Draft of the room decoration editor (see docs/roadmap.md, "Room decoration").
     Standalone: it does not read or write the game's save (its layout is kept under pm-room-draft).
     Same room as the game: 20x17 tiles of 16 px, kitchen top right, door at the bottom. It reuses sprites.js
     for the characters, the kitchen and the checked table; the new furniture is drawn in code below.
     Furniture comes in four styles (tasca, trattoria, modern, luxury); the room's atmosphere for each
     customer group depends on what is in it, on how consistent the style is and on free space. -->
<style>
:root{
  --wood:#7a4520; --wood-hi:#a8692f; --wood-lo:#4a260f; --wood-deep:#2a1407;
  --brass:#e3b34a; --brass-hi:#fbe39a; --brass-lo:#94661a; --brass-ink:#3a2706;
  --parch:#f3e6c6; --parch-2:#e6d3a8; --ink:#2c1a0b; --muted:#6c5233; --line:#c8ad7c; --on-wood:#e9d2a2;
  --tomato:#c4352a; --tomato-hi:#e8705a; --tomato-lo:#7e1d14; --cheese:#ffcf4a; --bad:#b02a1c; --good:#2e7b2c;
  --lcd-bg:#081008; --lcd:#8cff73; --lcd-dim:#3f7f33;
  --f-pixel:'Silkscreen','Courier New',monospace;
  --f-lcd:'VT323','Courier New',monospace;
  --f-body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;color:var(--on-wood);font-family:var(--f-body);font-size:15px;line-height:1.4;background-color:#4c2a13;
  background-image:repeating-linear-gradient(0deg,rgba(20,8,2,.55) 0 2px,transparent 2px 44px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 9px),linear-gradient(90deg,#4c2a13,#573117 50%,#4c2a13)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}
h1,h2,h3{font-family:var(--f-pixel);font-weight:700;margin:0;letter-spacing:.01em;line-height:1.15;text-wrap:balance}
h2{font-size:1.05rem}h3{font-size:.86rem}
.sub{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(var(--wood-hi),var(--wood) 30%,var(--wood-lo));border-bottom:4px solid var(--wood-deep);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.brand{font-family:var(--f-pixel);font-weight:700;font-size:1rem;color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 50%,var(--brass-lo));padding:6px 10px;border:2px solid var(--brass-ink);border-radius:3px;white-space:nowrap}
.crumb{font-family:var(--f-pixel);font-size:.8rem;color:var(--brass-hi);flex:1;min-width:0}
.btn{font-family:var(--f-pixel);font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--brass-ink);
  background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;padding:8px 11px;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),inset -1px -1px 0 rgba(0,0,0,.25),0 3px 0 var(--wood-deep)}
.btn.primary{background:linear-gradient(var(--tomato-hi),var(--tomato) 45%,var(--tomato-lo));color:#fff1d2;border-color:#3a0c06}
.btn.ghost{background:linear-gradient(#f6ead0,#dcc699)}
.btn.sm{padding:6px 8px;font-size:.62rem}
.btn[aria-pressed=true]{background:linear-gradient(var(--tomato-hi),var(--tomato) 45%,var(--tomato-lo));color:#fff1d2;border-color:#3a0c06}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;max-width:1300px;margin:22px auto;padding:0 16px;align-items:start}
@media(max-width:960px){.wrap{grid-template-columns:1fr;gap:22px}}
.frame{border:6px solid var(--wood);background:var(--wood-deep);box-shadow:inset 0 0 0 2px var(--wood-deep),0 0 0 2px var(--wood-hi),0 0 0 5px var(--wood-deep),0 8px 0 5px rgba(0,0,0,.25)}
#room{width:100%;height:auto;touch-action:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.tools .lbl{font-family:var(--f-pixel);font-size:.62rem;color:var(--brass-hi);text-transform:uppercase;margin-left:6px}
.side{display:flex;flex-direction:column;gap:26px}
.card{background:var(--parch);color:var(--ink);border:3px solid var(--wood-deep);border-radius:2px;padding:14px;
  box-shadow:inset 0 0 0 3px var(--parch-2),0 0 0 3px var(--wood-hi),0 0 0 6px var(--wood-lo),0 8px 0 6px rgba(0,0,0,.22)}
.lcd{background:var(--lcd-bg);border:3px solid #000;padding:8px 10px;box-shadow:inset 0 0 0 2px #1d2a1d;font-family:var(--f-lcd);font-size:1.25rem;line-height:1.05;color:var(--lcd);text-shadow:0 0 5px rgba(140,255,115,.4)}
.lcd div{display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
.lcd .dim{color:var(--lcd-dim)}
.lcd .warn{color:#ffb04a;white-space:normal}
.segs{display:grid;grid-template-columns:auto 1fr 2.2em;gap:6px 10px;align-items:center;margin-top:12px;font-size:.85rem}
.segs .bar{height:12px;border:2px solid var(--ink);background:#e6d3a8}
.segs .bar b{display:block;height:100%}
.segs .v{font-family:var(--f-lcd);font-size:1.2rem;text-align:right;line-height:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.tabs button{border:2px solid var(--line);background:#fbf3df;color:var(--ink);padding:5px 9px;font-family:var(--f-pixel);font-size:.6rem;text-transform:uppercase;border-radius:2px}
.tabs button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--parch)}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-height:560px;overflow:auto;padding:2px}
.it{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);background:#fbf3df;padding:6px 4px 5px;text-align:center;font-size:.78rem;line-height:1.1;position:relative}
.it:hover{border-color:var(--muted)}
.it:focus-visible{outline:3px solid var(--cheese)}
.it[aria-pressed=true]{border-color:var(--tomato);box-shadow:0 0 0 2px var(--tomato)}
.it canvas{height:52px;width:auto;max-width:96px}
.it .p{font-family:var(--f-lcd);font-size:1.1rem;line-height:1}
.chip{font-family:var(--f-pixel);font-size:.5rem;text-transform:uppercase;color:#fff;padding:2px 4px;line-height:1}
.selbox{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.hint{font-size:.85rem;color:#d9bf8e;margin:10px 2px 0}
</style>
</head>
<body>
<header class="hdr">
  <span class="brand">PIZZA MAGNA</span>
  <span class="crumb" data-i18n="title"></span>
  <button class="btn sm ghost" id="lang"></button>
</header>
<main class="wrap">
  <section>
    <div class="frame"><canvas id="room" width="320" height="272" aria-label="Dining room"></canvas></div>
    <div class="tools" id="tools"></div>
    <p class="hint" id="hint"></p>
  </section>
  <div class="side">
    <div class="card"><div class="lcd" id="lcd"></div><div class="segs" id="segs"></div><div id="sel"></div></div>
    <div class="card"><h2 data-i18n="shop"></h2><div class="tabs" id="tabs"></div><div class="cat" id="cat"></div></div>
  </div>
</main>
<script src="../../sprites.js"></script>
<script>
/* ================= LANGUAGE ================= */
const I18N={
  en:{title:'Dining room · draft',lang:'PT',shop:'Furniture shop',
    'tab.table':'Tables','tab.decor':'Decor','tab.wall':'On the wall','tab.floor':'Floor','tab.walls':'Walls',
    'st.tasca':'Tasca','st.tratt':'Trattoria','st.moder':'Modern','st.luxo':'Luxury',
    guests:'Show customers',empty:'Empty room',examples:'Examples:',stop:'Stop placing',
    'h.idle':'Pick something in the shop and tap the room to place it. Tap a piece to move or sell it.',
    'h.place':'Tap the room to place it (green = fits). Tap again to place another.',
    'h.wall':'Tap a spot on the back wall.',
    lcdRoom:'ROOM',lcdStyle:'STYLE',lcdMix:'MIXED',lcdTables:'TABLES',lcdSeats:'SEATS',lcdSpent:'FURNISHED',lcdFree:'FREE FLOOR',
    atm:'Atmosphere',
    'w.blocked':'% table(s) cannot be reached from the door.','w.kitchen':'The waiters cannot reach the kitchen counter.','w.crowd':'The room is crowded: customers feel squeezed.',

    sell:'Sell (+%)',move:'Move',seats:'% seats',
    'seg.est':'Students','seg.fam':'Families','seg.tur':'Tourists','seg.gou':'Gourmets',

    'i.neon':'Neon sign','i.relogio':'Clock','i.fotos':'Old photographs',

    'h.place':'Toca na sala para a pôr (verde = cabe). Toca outra vez para pôr mais uma.',
    'h.wall':'Toca num lugar da parede do fundo.',
    lcdRoom:'SALA',lcdStyle:'ESTILO',lcdMix:'MISTO',lcdTables:'MESAS',lcdSeats:'LUGARES',lcdSpent:'INVESTIDO',lcdFree:'CHÃO LIVRE',
    atm:'Ambiente',
    'w.blocked':'% mesa(s) sem acesso a partir da porta.','w.kitchen':'Os empregados não chegam ao balcão da cozinha.','w.crowd':'A sala está apinhada: os clientes sentem-se apertados.',
    'w.ok':'Todas as mesas têm acesso.',
    sell:'Vender (+%)',move:'Mudar',seats:'% lugares',
    'seg.est':'Estudantes','seg.fam':'Famílias','seg.tur':'Turistas','seg.gou':'Gourmets',
    'i.xadrez2':'Mesa aos quadrados pequena','i.xadrez4':'Mesa aos quadrados grande','i.redonda':'Mesa redonda de madeira','i.corrida':'Mesa corrida com bancos','i.branca':'Mesa quadrada branca',
    'i.booth':'Cabine de cabedal','i.gala':'Mesa de gala','i.bistro':'Mesa de mármore',
    'i.vaso':'Vaso com planta','i.ficus':'Fícus alto','i.oliveira':'Oliveira em vaso','i.barril':'Pipa de vinho','i.jukebox':'Jukebox','i.aquario':'Aquário',
    'i.candeeiro':'Candeeiro de pé','i.estatua':'Estátua de mármore','i.fonte':'Fonte','i.piano':'Piano de cauda','i.persa':'Tapete persa','i.trapos':'Tapete de trapos',
    'i.garrafeira':'Garrafeira','i.arcade':'Máquina de jogos',
    'i.janela':'Janela','i.quadro':'Quadro','i.giz':'Ardósia com o menu','i.azulejos':'Painel de azulejos','i.prateleira':'Prateleira de garrafas','i.espelho':'Espelho dourado',
    'i.neon':'Néon','i.relogio':'Relógio','i.fotos':'Fotografias antigas',
    'f.check':'Xadrez vermelho e creme','f.planks':'Soalho de madeira','f.hydraulic':'Mosaico hidráulico','f.terrazzo':'Marmorite','f.marble':'Mármore','f.terracotta':'Tijoleira',
    'w.cream':'Creme e madeira','w.azulejo':'Azulejo azul','w.brick':'Tijolo à vista','w.modern':'Branco e carvalho','w.damask':'Damasco verde'}
};
let LANG=(()=>{try{const p=localStorage.getItem('pm-lang');if(p==='en'||p==='pt')return p}catch(_){}return /^pt\b/i.test(navigator.language||'')?'pt':'en'})();
const t=(k,v)=>{const s=(I18N[LANG][k]??I18N.en[k]??k);return v===undefined?s:s.replace('%',v)};

/* ================= PIXEL HELPERS ================= */
const P=SPR.PAL,cache=new Map(),memo=(k,f)=>{if(!cache.has(k))cache.set(k,f());return cache.get(k)};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]};
const R=(x,col,a,b,w=1,h=1)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};
const inE=(i,y,cx,cy,rx,ry)=>{const dx=(i+.5-cx)/rx,dy=(y+.5-cy)/ry;return dx*dx+dy*dy<=1};
function ell(x,cx,cy,rx,ry,col){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let i=Math.floor(cx-rx);i<=Math.ceil(cx+rx);i++)if(inE(i,y,cx,cy,rx,ry))R(x,col,i,y)}
const OL=c=>SPR.outline(c);
const rng=s=>()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
const T=16,COLS=20,ROWS=17,RW=COLS*T,RH=ROWS*T,DOOR=[10,13],PICK=[16,8];
const STYLE_COL={tasca:'#2f5f9e',tratt:'#c4352a',moder:'#2b2b33',luxo:'#a7771f'};

/* ================= FLOORS (16x16) ================= */
const FLOORS={
  check:{style:'tratt',price:0,app:[2,3,1,0],tile:(c,r)=>SPR.floorCheck((c+r)%2)},
  planks:{style:'tasca',price:260,app:[1,2,2,1],tile:(c,r)=>memo('fp'+(r%2)+(c%3),()=>{const [cv,x]=mk(16,16);
    for(let k=0;k<4;k++){const y=k*4,col=['#a8692f','#9a5a2c','#b0723a','#94562a'][(k+r+c)%4];R(x,col,0,y,16,4);R(x,'#c48a52',0,y,16,1);R(x,'#5e3418',0,y+3,16,1);
      const j=((k*7+c*5+r*3)%16);R(x,'#5e3418',j,y,1,3);if((k+c)%3===0)R(x,'#7a4520',(j+6)%16,y+1,2,1)}return cv})},
  hydraulic:{style:'tasca',price:380,app:[0,2,4,2],tile:()=>memo('fh',()=>{const [cv,x]=mk(16,16);R(x,'#efe3c8',0,0,16,16);
    for(const [a,b] of [[0,0],[16,0],[0,16],[16,16]])ell(x,a,b,3,3,'#c98a6a');
    R(x,'#5a7fb8',7,3,2,10);R(x,'#5a7fb8',3,7,10,2);R(x,'#efe3c8',7,7,2,2);R(x,'#8aa8d0',6,6,1,1);R(x,'#8aa8d0',9,6,1,1);R(x,'#8aa8d0',6,9,1,1);R(x,'#8aa8d0',9,9,1,1);
    R(x,'#d8c9a6',0,15,16,1);R(x,'#d8c9a6',15,0,1,16);return cv})},
  terrazzo:{style:'moder',price:320,app:[3,2,1,2],tile:(c,r)=>memo('ft'+((c*7+r*3)%5),()=>{const [cv,x]=mk(16,16);const g=rng(c*31+r*17+3);R(x,'#e6e3dc',0,0,16,16);
    for(let i=0;i<14;i++)R(x,['#b9b3a8','#9a9488','#d6a98a','#8aa0a8','#cfcac0'][Math.floor(g()*5)],Math.floor(g()*15),Math.floor(g()*15),1+Math.floor(g()*2),1);
    R(x,'#d2cec6',0,15,16,1);R(x,'#d2cec6',15,0,1,16);return cv})},
  marble:{style:'luxo',price:620,app:[-1,1,3,6],tile:(c,r)=>memo('fm'+((c+r)%3),()=>{const [cv,x]=mk(16,16);R(x,'#efebe3',0,0,16,16);
    const v=(c+r)%3;for(let i=0;i<16;i++){const y=Math.round(4+v*3+Math.sin(i*.6+v)*2);R(x,'#d8d2c6',i,y,1,1);if(i%3===0)R(x,'#cfc8ba',i,y+1,1,1)}
    for(const [a,b] of [[0,0],[15,0],[0,15],[15,15]])for(let k=0;k<4;k++)R(x,'#2b2b33',a===0?0:16-(4-k),b===0?k:15-k,4-k,1);
    R(x,'#e0b048',0,0,1,1);R(x,'#d8d2c6',0,15,16,1);R(x,'#d8d2c6',15,0,1,16);return cv})},
  terracotta:{style:'tratt',price:200,app:[1,3,2,0],tile:(c,r)=>memo('fc'+((c+r)%2),()=>{const [cv,x]=mk(16,16);R(x,'#8a3e22',0,0,16,16);
    for(const [a,b,k] of [[0,0,0],[8,0,1],[0,8,1],[8,8,0]]){const col=(k+c+r)%2?'#c4643a':'#b85a32';R(x,col,a,b,7,7);R(x,'#d87a4a',a,b,7,1);R(x,'#a04a28',a,b+6,7,1)}return cv})}
};
/* ================= BACK WALLS (16x32) ================= */
const trim=(x)=>{R(x,P.woodDD,0,0,16,3);R(x,P.wood,0,1,16,1)},skirt=(x,col='#3a2014')=>{R(x,col,0,30,16,2)};
const WALLS={
  cream:{style:'tratt',price:0,app:[1,3,1,0],tile:()=>SPR.wallDining()},
  azulejo:{style:'tasca',price:340,app:[0,2,5,2],tile:()=>memo('wa',()=>{const [c,x]=mk(16,32);trim(x);R(x,'#f1e6cf',0,3,16,8);
    for(let ty=11;ty<30;ty+=5)for(let tx=0;tx<16;tx+=5){R(x,'#f4f6f8',tx,ty,5,5);R(x,'#2f5f9e',tx+2,ty+1,1,3);R(x,'#2f5f9e',tx+1,ty+2,3,1);R(x,'#7aa0d0',tx,ty,1,1);R(x,'#c9d4e0',tx+4,ty,1,5);R(x,'#c9d4e0',tx,ty+4,5,1)}
    R(x,'#2f5f9e',0,11,16,1);R(x,'#2f5f9e',0,29,16,1);skirt(x);return c})},
  brick:{style:'tratt',price:220,app:[3,2,2,0],tile:()=>memo('wb',()=>{const [c,x]=mk(16,32);trim(x);R(x,'#d9c3a0',0,3,16,27);
    for(let k=0,y=3;y<30;y+=4,k++)for(let i=(k%2)*-4;i<16;i+=8){const col=[ '#b0503a','#a0462f','#bf5e44','#93402a'][(i+k*3+20)%4];R(x,col,Math.max(0,i),y,Math.min(7,i+7)-Math.max(0,i),3);R(x,'rgba(255,255,255,.15)',Math.max(0,i),y,Math.min(7,i+7)-Math.max(0,i),1)}
    skirt(x);return c})},
  modern:{style:'moder',price:300,app:[3,2,1,3],tile:()=>memo('wm',()=>{const [c,x]=mk(16,32);R(x,'#2b2b33',0,0,16,3);R(x,'#f2f2ee',0,3,16,17);R(x,'#e2e2dc',0,19,16,1);R(x,'#17171c',0,20,16,2);
    for(let i=0;i<16;i++)R(x,i%4===3?'#a88250':i%4===0?'#d8b680':'#c9a46e',i,22,1,8);skirt(x,'#17171c');return c})},
  damask:{style:'luxo',price:560,app:[-1,1,3,6],tile:()=>memo('wd2',()=>{const [c,x]=mk(16,32);trim(x);R(x,'#1f4a3a',0,3,16,17);
    for(let y=4;y<19;y+=6)for(let i=(y%12===4?0:4);i<16;i+=8){R(x,'#c9a24a',i+3,y,1,1);R(x,'#c9a24a',i+2,y+1,3,1);R(x,'#a7771f',i+1,y+2,5,1);R(x,'#c9a24a',i+2,y+3,3,1);R(x,'#c9a24a',i+3,y+4,1,1)}
    R(x,'#e0b048',0,20,16,1);R(x,'#5e2a19',0,21,16,9);R(x,'#7a3a24',2,22,5,7);R(x,'#7a3a24',9,22,5,7);R(x,'#8f4a30',3,23,3,5);R(x,'#8f4a30',10,23,3,5);skirt(x);return c})}

/* ================= ANALYSIS ================= */
function analyse(){
  const g=occupancy(),solid=k=>g.has(k);
  // reachable floor from the door (breadth-first)
  const seen=new Set(),q=[];for(const c of [DOOR[0],DOOR[0]+1]){const k=DOOR[1]*COLS+c;seen.add(k);q.push(k)}
  while(q.length){const k=q.shift(),c=k%COLS,r=(k/COLS)|0;for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+dc,nr=r+dr,nk=nr*COLS+nc;if(!editable(nc,nr)||seen.has(nk)||solid(nk))continue;seen.add(nk);q.push(nk)}}
  const blocked=new Set();let seats=0,tables=0;
  for(const it of room.items){const d=ITEMS[it.id];if(d.cat!=='table')continue;tables++;seats+=d.seats.length;
    // a table works when a waiter can reach at least one tile right next to it
    let ok=false;for(let j=-1;j<=d.h&&!ok;j++)for(let i=-1;i<=d.w&&!ok;i++){const inside=i>=0&&j>=0&&i<d.w&&j<d.h;if(inside&&d.mask[j][i]==='#')continue;if(seen.has((it.r+j)*COLS+it.c+i))ok=true}
    if(!ok)blocked.add(it)}
  const kitchenOk=[[0,1],[1,0],[-1,0]].some(([a,b])=>seen.has((PICK[1]+b)*COLS+PICK[0]+a))||seen.has(PICK[1]*COLS+PICK[0]);
  let total=0,free=0;for(let r=2;r<=13;r++)for(let c=0;c<COLS;c++)if(editable(c,r)){total++;if(!solid(r*COLS+c))free++}
  const freeShare=free/total;
  // atmosphere
  const sum=[0,0,0,0],byStyle={tasca:0,tratt:0,moder:0,luxo:0};let spent=0;
  const addApp=(d,w=1)=>{d.app.forEach((v,i)=>sum[i]+=v*w);byStyle[d.style]+=Math.max(30,d.price);spent+=d.price};
  addApp(FLOORS[room.floor],2);addApp(WALLS[room.wall],2);
  for(const it of room.items)addApp(ITEMS[it.id]);for(const w of room.walls)if(w)addApp(ITEMS[w]);
  const tot=Object.values(byStyle).reduce((a,b)=>a+b,0);const dom=Object.keys(byStyle).sort((a,b)=>byStyle[b]-byStyle[a])[0];const share=byStyle[dom]/tot;
  const bonus=share>=.5?STYLE_BONUS[dom].map(v=>v*(share-.5)*2):[0,0,0,0];
  const crowd=freeShare<.42?Math.round((.42-freeShare)*120):0;
  const atm=sum.map((v,i)=>Math.max(0,Math.min(100,Math.round(20+v*.9+bonus[i]-crowd))));
  return {blocked,kitchenOk,seats,tables,freeShare,atm,dom,share,spent,crowd};
}

  if(ghost&&tool&&ITEMS[tool].cat!=='wall'){const d=ITEMS[tool],ok=fits(tool,ghost.c,ghost.r,moving);
    c.fillStyle=ok?'rgba(80,220,90,.28)':'rgba(230,60,40,.32)';d.mask.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch==='#'||d.rug)c.fillRect((ghost.c+i)*T,(ghost.r+j)*T,T,T)}));
    c.globalAlpha=.75;const tmp={id:tool,c:ghost.c,r:ghost.r};const ps=partsOf(tmp,frame).sort((a,b)=>a.z-b.z);for(const p of ps)c.drawImage(p.img,p.x,p.y);c.globalAlpha=1}
  if(tool&&ITEMS[tool].cat==='wall'){for(let i=0;i<WALL_SLOTS;i++){c.strokeStyle=ghost&&ghost.slot===i?'#ffcf4a':'rgba(255,241,210,.55)';c.lineWidth=1;c.strokeRect(i*32+1.5,3.5,29,24)}}
}
function blit(){
  m.imageSmoothingEnabled=false;m.drawImage(LO,0,0,cv.width,cv.height);const k=cv.width/RW;
  const a=analysis;
  for(const it of a.blocked){const d=ITEMS[it.id];m.strokeStyle='#ff5a3a';m.lineWidth=Math.max(2,k);m.setLineDash([k*3,k*2]);m.strokeRect(it.c*T*k+1,it.r*T*k+1,d.w*T*k-2,d.h*T*k-2);m.setLineDash([])}
  if(sel&&room.items.includes(sel)){const d=ITEMS[sel.id];m.strokeStyle='#120a04';m.lineWidth=Math.max(4,k*2);m.strokeRect(sel.c*T*k,sel.r*T*k,d.w*T*k,d.h*T*k);m.strokeStyle=Math.floor(performance.now()/400)%2?'#ffcf4a':'#fbe39a';m.lineWidth=Math.max(2,k);m.strokeRect(sel.c*T*k,sel.r*T*k,d.w*T*k,d.h*T*k)}
}
let analysis=analyse();
function loop(now){const f=Math.floor(now/180);if(f!==frame){frame=f;drawRoom()}blit();requestAnimationFrame(loop)}
function fit(){const dpr=Math.min(devicePixelRatio||1,3),s=Math.max(1,Math.round(cv.clientWidth*dpr/RW));cv.width=RW*s;cv.height=RH*s}

/* ================= INPUT ================= */
const tileAt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*RW,(e.clientY-r.top)/r.height*RH]};
function ghostAt(x,y){if(!tool)return null;const d=ITEMS[tool];if(d.cat==='wall')return y<34&&x<12*T?{slot:Math.floor(x/32)}:null;return{c:Math.round(x/T-d.w/2),r:Math.round(y/T-d.h/2)}}
cv.addEventListener('pointermove',e=>{const [x,y]=tileAt(e);ghost=ghostAt(x,y);drawRoom()});
cv.addEventListener('pointerleave',()=>{ghost=null;drawRoom()});
cv.addEventListener('pointerdown',e=>{
  const [x,y]=tileAt(e);
  if(tool){const g=ghostAt(x,y);if(!g)return;const d=ITEMS[tool];
    if(d.cat==='wall'){if(g.slot>=0&&g.slot<WALL_SLOTS){room.walls[g.slot]=tool;changed()}return}
    if(fits(tool,g.c,g.r,moving)){if(moving){moving.c=g.c;moving.r=g.r;sel=moving;moving=null;tool=null}else room.items.push({id:tool,c:g.c,r:g.r});ghost=g;changed()}
    return}
  // pick a piece: the one drawn in front wins (furniture before rugs)
  const c=Math.floor(x/T),r=Math.floor(y/T);
  if(y<34&&x<12*T){const i=Math.floor(x/32);sel=room.walls[i]?{wall:i}:null;renderSide();return}
  const hit=room.items.filter(it=>{const d=ITEMS[it.id];return c>=it.c&&c<it.c+d.w&&r>=it.r&&r<it.r+d.h}).sort((a,b)=>(ITEMS[a.id].rug?0:1)-(ITEMS[b.id].rug?0:1)||b.r-a.r);
  sel=hit[hit.length-1]&&!ITEMS[hit[0].id].rug?hit[0]:hit[0]||null;renderSide();
});
addEventListener('keydown',e=>{if(e.key==='Escape'){stopTool()}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();stopTool()});
function stopTool(){if(moving){moving=null}tool=null;ghost=null;changed()}
function changed(){analysis=analyse();if(guests)makePeople();saveRoom();drawRoom();renderSide();renderCat();renderTools()}

/* ================= SIDE PANELS ================= */
const $=q=>document.querySelector(q);
const money=v=>'$'+v.toLocaleString('en-US');
let tab='table';
function thumb(id){const k='th'+id;return memo(k,()=>{const d=ITEMS[id],tmp={id,c:0,r:0};let ps;
  if(d.cat==='wall')ps=d.parts.map(p=>({img:sprOf(p.s,3),x:p.x,y:p.y,z:0}));else ps=partsOf(tmp,3).sort((a,b)=>a.z-b.z);
  if(d.seats&&d.cat==='table'){}
  const x0=Math.min(...ps.map(p=>p.x)),y0=Math.min(...ps.map(p=>p.y)),x1=Math.max(...ps.map(p=>p.x+p.img.width)),y1=Math.max(...ps.map(p=>p.y+p.img.height));
  const [c,x]=mk(x1-x0,y1-y0);for(const p of ps)x.drawImage(p.img,p.x-x0,p.y-y0);return c})}
function finishThumb(kind,key){return memo('ft'+kind+key,()=>{const [c,x]=mk(32,32);if(kind==='floor'){for(let r=0;r<2;r++)for(let i=0;i<2;i++)x.drawImage(FLOORS[key].tile(i,r+2),i*16,r*16)}else{x.drawImage(WALLS[key].tile(0),0,0);x.drawImage(WALLS[key].tile(1),16,0)}return c})}
function renderTabs(){$('#tabs').innerHTML=['table','decor','wall','floor','walls'].map(k=>`<button data-tab="${k}" aria-pressed="${tab===k}">${t('tab.'+k)}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderTabs();renderCat()})}
function card(label,price,style,on,attrs,cvs){return `<button class="it" ${attrs} aria-pressed="${on}"><span data-thumb></span><span>${label}</span><span class="row" style="gap:4px;justify-content:center"><b class="p">${price?money(price):'—'}</b><span class="chip" style="background:${STYLE_COL[style]}">${t('st.'+style)}</span></span></button>`}
function renderCat(){
  const el=$('#cat');let list=[];
  if(tab==='floor'){el.innerHTML=Object.keys(FLOORS).map(k=>card(t('f.'+k),FLOORS[k].price,FLOORS[k].style,room.floor===k,`data-floor="${k}"`)).join('');list=Object.keys(FLOORS).map(k=>finishThumb('floor',k))}
  else if(tab==='walls'){el.innerHTML=Object.keys(WALLS).map(k=>card(t('w.'+k),WALLS[k].price,WALLS[k].style,room.wall===k,`data-wall="${k}"`)).join('');list=Object.keys(WALLS).map(k=>finishThumb('wall',k))}
  else{const ids=Object.keys(ITEMS).filter(k=>ITEMS[k].cat===tab);el.innerHTML=ids.map(k=>card(t('i.'+k)+(ITEMS[k].seats?` · ${ITEMS[k].seats.length}`:''),ITEMS[k].price,ITEMS[k].style,tool===k&&!moving,`data-item="${k}"`)).join('');list=ids.map(thumb)}
  el.querySelectorAll('[data-thumb]').forEach((s,i)=>{const src=list[i],[c,x]=mk(src.width,src.height);x.drawImage(src,0,0);s.replaceWith(c)});
  el.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{const k=b.dataset.item;moving=null;tool=tool===k?null:k;sel=null;changed()});
  el.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{room.floor=b.dataset.floor;changed()});
  el.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>{room.wall=b.dataset.wall;changed()});
}
function renderSide(){
  const a=analysis,st=a.share>=.5?t('st.'+a.dom).toUpperCase()+' '+Math.round(a.share*100)+'%':t('lcdMix');
  const warn=[];if(a.blocked.size)warn.push(t('w.blocked',a.blocked.size));if(!a.kitchenOk)warn.push(t('w.kitchen'));if(a.crowd)warn.push(t('w.crowd'));
  $('#lcd').innerHTML=`<div><span>${t('lcdRoom')}</span><span>${t('lcdStyle')} ${st}</span></div><div class="dim"><span>${'-'.repeat(30)}</span></div>
    <div><span>${t('lcdTables')}</span><span>${a.tables}</span></div><div><span>${t('lcdSeats')}</span><span>${a.seats}</span></div>
    <div><span>${t('lcdFree')}</span><span>${Math.round(a.freeShare*100)}%</span></div><div><span>${t('lcdSpent')}</span><span>${money(a.spent)}</span></div>
    ${warn.length?warn.map(w=>`<div class="warn">! ${w}</div>`).join(''):`<div class="dim"><span>${t('w.ok')}</span></div>`}`;
  $('#segs').innerHTML=`<h3 style="grid-column:1/-1">${t('atm')}</h3>`+SEGS.map(([k,col],i)=>`<span>${t('seg.'+k)}</span><span class="bar"><b style="width:${a.atm[i]}%;background:${col}"></b></span><span class="v">${a.atm[i]}</span>`).join('');
  const el=$('#sel');
  if(sel&&(sel.wall!==undefined?room.walls[sel.wall]:room.items.includes(sel))){
    const id=sel.wall!==undefined?room.walls[sel.wall]:sel.id,d=ITEMS[id],refund=Math.round(d.price*.5);
    el.innerHTML=`<div class="selbox"><div class="row" style="justify-content:space-between"><h3>${t('i.'+id)}</h3><span class="chip" style="background:${STYLE_COL[d.style]}">${t('st.'+d.style)}</span></div>
      ${d.seats?`<p class="sub">${t('seats',d.seats.length)}</p>`:''}<div class="row" style="margin-top:8px">${sel.wall===undefined?`<button class="btn sm" data-move>${t('move')}</button>`:''}<button class="btn sm ghost" data-sell>${t('sell',money(refund))}</button></div></div>`;
    const mv=el.querySelector('[data-move]');if(mv)mv.onclick=()=>{moving=sel;tool=sel.id;changed()};
    el.querySelector('[data-sell]').onclick=()=>{if(sel.wall!==undefined)room.walls[sel.wall]=null;else room.items=room.items.filter(x=>x!==sel);sel=null;changed()};
  }else el.innerHTML='';
  $('#hint').textContent=tool?(ITEMS[tool].cat==='wall'?t('h.wall'):t('h.place')):t('h.idle');
}
function renderTools(){
  $('#tools').innerHTML=`<button class="btn sm" id="guests" aria-pressed="${guests}">${t('guests')}</button>${tool?`<button class="btn sm primary" id="stop">${t('stop')}</button>`:''}
    <span class="lbl">${t('examples')}</span>${['tasca','tratt','moder','luxo'].map(k=>`<button class="btn sm ghost" data-preset="${k}">${t('st.'+k)}</button>`).join('')}
    <button class="btn sm ghost" id="empty">${t('empty')}</button>`;
  $('#guests').onclick=()=>{guests=!guests;if(guests)makePeople();changed()};
  const s=$('#stop');if(s)s.onclick=stopTool;
  $('#empty').onclick=()=>{room=blank();sel=null;tool=null;moving=null;changed()};
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{room=fromPreset(b.dataset.preset);sel=null;tool=null;moving=null;changed()});
}
function texts(){document.documentElement.lang=LANG;document.title='Pizza Magna · '+t('title');document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('#lang').textContent=t('lang');
  cache.forEach((v,k)=>{if(k.startsWith('th'))cache.delete(k)});renderTabs();renderCat();renderSide();renderTools()}
$('#lang').onclick=()=>{LANG=LANG==='pt'?'en':'pt';try{localStorage.setItem('pm-lang',LANG)}catch(_){}texts()};

fit();addEventListener('resize',fit);texts();drawRoom();requestAnimationFrame(loop);
</script>
</body>
</html>
