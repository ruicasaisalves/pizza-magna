<!doctype html>

<title>Pizza Magna · Decor draft</title>
<!-- Draft: decorating the room by spots (see docs/drafts/room.html for the free-placement editor the game uses now).
     Standalone: it does not read or write the game's save (its room is kept under pm-decor-draft).
     The ideas being tried:
     - the floor plan is fixed (tables on fixed spots, aisles always clear); a table spot only changes its model;
     - decoration goes on its own spots (back wall, corners, between tables, on top of the tables), so it never
       blocks a path;
     - decoration works near where it is: each table has its own charm for each customer group, from what is on
       it and around it (close pieces count fully, far ones a little), plus a bonus for a consistent corner;
     - "See as" a group shows how much that group likes each table and each piece;
     - "Open the room" seats customers where they like it most, and some of them comment on the decor;
     - collections: six pieces of a style, all in the room, give a bonus and a title.
     Same room, art and catalogue as the game (assets/room.js, generated by tools/gen_room.py); the table-top
     pieces are drawn here, pixel by pixel. -->
<style>
@font-face{font-family:'Pixelify Sans';font-weight:400 700;src:url(../../assets/fonts/pixelify-latin.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Silkscreen';font-weight:400;src:url(../../assets/fonts/silkscreen-latin.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Silkscreen';font-weight:700;src:url(../../assets/fonts/silkscreen-bold-latin.woff2) format('woff2');font-display:swap}
@font-face{font-family:'VT323';font-weight:400;src:url(../../assets/fonts/vt323-latin.woff2) format('woff2');font-display:swap}
:root{

  --lcd-bg:#081008; --lcd:#8cff73; --lcd-dim:#3f7f33;
  --f-pixel:'Silkscreen','Courier New',monospace;
  --f-lcd:'VT323','Courier New',monospace;
  --f-body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;color:var(--on-wood);font-family:var(--f-body);font-size:15px;line-height:1.4;background-color:#4c2a13;
  background-image:repeating-linear-gradient(0deg,rgba(20,8,2,.55) 0 2px,transparent 2px 44px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 9px),linear-gradient(90deg,#4c2a13,#573117 50%,#4c2a13)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}
h1,h2,h3{font-family:var(--f-pixel);font-weight:700;margin:0;letter-spacing:.01em;line-height:1.15;text-wrap:balance}
h2{font-size:1.05rem}h3{font-size:.86rem}
.sub{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(var(--wood-hi),var(--wood) 30%,var(--wood-lo));border-bottom:4px solid var(--wood-deep);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.brand{font-family:var(--f-pixel);font-weight:700;font-size:1rem;color:var(--brass-ink);background:linear-gradient(var(--brass-hi),var(--brass) 50%,var(--brass-lo));padding:6px 10px;border:2px solid var(--brass-ink);border-radius:3px;white-space:nowrap}
.crumb{font-family:var(--f-pixel);font-size:.8rem;color:var(--brass-hi);flex:1;min-width:0}
.btn{font-family:var(--f-pixel);font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--brass-ink);
  background:linear-gradient(var(--brass-hi),var(--brass) 45%,var(--brass-lo));border:2px solid var(--brass-ink);border-radius:3px;padding:8px 11px;

.btn.primary,.btn[aria-pressed=true]{background:linear-gradient(var(--tomato-hi),var(--tomato) 45%,var(--tomato-lo));color:#fff1d2;border-color:#3a0c06}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:26px;max-width:1320px;margin:22px auto;padding:0 16px;align-items:start}

.frame{border:6px solid var(--wood);background:var(--wood-deep);box-shadow:inset 0 0 0 2px var(--wood-deep),0 0 0 2px var(--wood-hi),0 0 0 5px var(--wood-deep),0 8px 0 5px rgba(0,0,0,.25)}
#room{width:100%;height:auto;touch-action:manipulation}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.tools .lbl{font-family:var(--f-pixel);font-size:.62rem;color:var(--brass-hi);text-transform:uppercase;margin-left:6px}
.side{display:flex;flex-direction:column;gap:26px}

.lcd{background:var(--lcd-bg);border:3px solid #000;padding:8px 10px;box-shadow:inset 0 0 0 2px #1d2a1d;font-family:var(--f-lcd);font-size:1.25rem;line-height:1.05;color:var(--lcd);text-shadow:0 0 5px rgba(140,255,115,.4)}
.lcd div{display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
.lcd .dim{color:var(--lcd-dim)}
.segs{display:grid;grid-template-columns:auto 1fr 2.2em;gap:6px 10px;align-items:center;margin-top:12px;font-size:.85rem}
.segs .bar{height:12px;border:2px solid var(--ink);background:#e6d3a8}
.segs .bar b{display:block;height:100%}
.segs .v{font-family:var(--f-lcd);font-size:1.2rem;text-align:right;line-height:1}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;padding:2px;margin-top:8px}
.it{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);background:#fbf3df;padding:6px 4px 5px;text-align:center;font-size:.78rem;line-height:1.1;position:relative}
.it:hover{border-color:var(--muted)}
.it:focus-visible{outline:3px solid var(--cheese)}
.it[aria-pressed=true]{border-color:var(--tomato);box-shadow:0 0 0 2px var(--tomato)}
.it canvas{height:46px;width:auto;max-width:92px}
.it .p{font-family:var(--f-lcd);font-size:1.1rem;line-height:1}
.it .likes{display:flex;gap:2px;justify-content:center;font-family:var(--f-lcd);font-size:.95rem;line-height:1}
.it .likes i{font-style:normal;padding:0 2px;color:#fff}
.chip{font-family:var(--f-pixel);font-size:.5rem;text-transform:uppercase;color:#fff;padding:2px 4px;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:.85rem;color:#d9bf8e;margin:10px 2px 0}
.sec{margin-top:14px;padding-top:10px;border-top:2px dashed var(--line)}
.sets{display:grid;gap:8px;margin-top:8px}
.set{border:2px solid var(--line);background:#fbf3df;padding:6px 8px;font-size:.82rem}
.set.done{border-color:var(--good);background:#e8f3d9}
.set b{font-family:var(--f-pixel);font-size:.62rem;text-transform:uppercase}
.set ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:2px 10px}
.set li.no{opacity:.45}
.who{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;margin-top:6px}
.who i{font-style:normal}
.who i::before,.dot::before{content:"";display:inline-block;width:10px;height:10px;background:var(--c);border:1px solid var(--wood-deep);margin-right:4px;vertical-align:-1px}
</style>

for(const id in ITEMS){Object.assign(ITEMS[id],LAY.items[id]||{});if(LAY.walls[id])ITEMS[id].art=LAY.walls[id]}
const STYLE_BONUS={tasca:[2,6,12,4],tratt:[6,10,4,0],moder:[10,4,2,4],luxo:[-6,2,6,16]};

/* ================= THE FLOOR PLAN: fixed spots ================= */
// tables (t4: 4x4 tiles, t2: 4x2) and decor spots (s: 1x1, w: 2x1, b: 3x2) placed so that every table keeps its aisle
const PLAN={
  tables:[{c:0,r:2,k:'t4'},{c:5,r:2,k:'t4'},{c:0,r:8,k:'t2'},{c:0,r:11,k:'t2'},{c:5,r:8,k:'t2'},{c:5,r:11,k:'t2'},{c:13,r:9,k:'t4'}],

};

// where each piece stands: its top-left tile (pieces narrower than their spot are centred) and its centre
function tablePos(i){const p=PLAN.tables[i],d=ITEMS[room.tables[i]];return {c:p.c+(4-d.w)/2,r:p.r}}
function spotPos(i){const p=PLAN.spots[i],d=ITEMS[room.spots[i]],[w,h]=SPOT_SIZE[p.k];return d?{c:p.c+(w-d.w)/2,r:p.r+(h-d.h)/2}:{c:p.c,r:p.r}}
const tableCentre=i=>{const p=PLAN.tables[i],h=p.k==='t4'?4:2;return [p.c+2,p.r+h/2]};
const spotCentre=i=>{const p=PLAN.spots[i],[w,h]=SPOT_SIZE[p.k];return [p.c+w/2,p.r+h/2]};
const wallCentre=i=>[i*2+1,1.2];

/* ================= ANALYSIS: each table's charm for each group ================= */
// a piece counts fully within 3 tiles of the table, half within 6, a little beyond (it is still the same room)
const near=d=>d<=3.2?1:d<=6?.45:.12;
function pieces(){   // every decor piece with its centre
  const L=[];room.spots.forEach((id,i)=>{if(id)L.push({id,at:spotCentre(i),kind:'spot',i})});
  room.walls.forEach((id,i)=>{if(id)L.push({id,at:wallCentre(i),kind:'wall',i})});return L}
function sets(){const have=new Set([...room.tables,...room.tops,...room.spots,...room.walls].filter(Boolean));
  const out={};for(const st in SETS){const n=SETS[st].filter(id=>have.has(id)).length;out[st]={n,done:n===SETS[st].length}}return out}
function analyse(){
  const P=pieces(),S=sets();
  const tables=PLAN.tables.map((_,i)=>{
    const [cx,cy]=tableCentre(i),sum=[0,0,0,0],styles={};const why=[];
    const add=(id,w)=>{const d=ITEMS[id];d.app.forEach((v,g)=>sum[g]+=v*w);if(w>=.45)styles[d.style]=(styles[d.style]||0)+(w>=1?1:.5)};
    add(room.tables[i],1.5);if(room.tops[i])add(room.tops[i],1.5);
    for(const p of P){const w=near(Math.hypot(p.at[0]-cx,p.at[1]-cy));add(p.id,w);if(w>=1)why.push(p.id)}
    FLOORS[room.floor].app.forEach((v,g)=>sum[g]+=v*.8);WALLS[room.wall].app.forEach((v,g)=>sum[g]+=v*.8);
    // a consistent corner: most of what is close to the table in one style
    const tot=Object.values(styles).reduce((a,b)=>a+b,0),dom=Object.keys(styles).sort((a,b)=>styles[b]-styles[a])[0];
    const corner=tot>=3&&styles[dom]/tot>=.6?dom:null;if(corner)STYLE_BONUS[corner].forEach((v,g)=>sum[g]+=v*.4);
    for(const st in S)if(S[st].done)STYLE_BONUS[st].forEach((v,g)=>sum[g]+=v*.3);
    return {charm:sum.map(v=>Math.max(0,Math.min(100,Math.round(30+v*2)))),corner,why}});
  const atm=[0,1,2,3].map(g=>Math.round(tables.reduce((a,x)=>a+x.charm[g],0)/tables.length));
  let spent=FLOORS[room.floor].price+WALLS[room.wall].price,seats=0;const byStyle={tasca:0,tratt:0,moder:0,luxo:0};
  for(const id of [...room.tables,...room.tops,...room.spots,...room.walls])if(id){spent+=ITEMS[id].price;byStyle[ITEMS[id].style]+=Math.max(30,ITEMS[id].price)}
  room.tables.forEach(id=>seats+=ITEMS[id].seats.length);
  const tot=Object.values(byStyle).reduce((a,b)=>a+b,0),dom=Object.keys(byStyle).sort((a,b)=>byStyle[b]-byStyle[a])[0];
  return {tables,atm,spent,seats,dom,share:byStyle[dom]/tot,sets:S};
}
// the aisles: every table must stay reachable from the door whatever is on the spots (checked by the test)
function reachable(){
  const solid=new Set(),mark=(c,r,w,h)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)solid.add((r+j)*COLS+c+i)};
  PLAN.tables.forEach(p=>mark(p.c,p.r,4,p.k==='t4'?4:2));PLAN.spots.forEach(p=>mark(p.c,p.r,...SPOT_SIZE[p.k]));
  const ok=(c,r)=>c>=0&&c<COLS&&r>=2&&r<=13&&!(c>=12&&r<=7),seen=new Set(),q=[DOOR[1]*COLS+DOOR[0]];seen.add(q[0]);
  while(q.length){const k=q.shift(),c=k%COLS,r=(k/COLS)|0;for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+a,nr=r+b,nk=nr*COLS+nc;if(ok(nc,nr)&&!seen.has(nk)&&!solid.has(nk)){seen.add(nk);q.push(nk)}}}
  return PLAN.tables.map(p=>{const h=p.k==='t4'?4:2;for(let j=-1;j<=h;j++)for(let i=-1;i<=4;i++)if((i<0||j<0||i>=4||j>=h)&&seen.has((p.r+j)*COLS+p.c+i))return true;return false})}

/* ================= CUSTOMERS ================= */
let people=null,bubbles=[];
function openRoom(){
  const a=analysis,seats=[];room.tables.forEach((id,i)=>ITEMS[id].seats.forEach(s=>seats.push({i,s,taken:false})));
  const n=Math.round(seats.length*.85);people=[];
  for(let k=0;k<n;k++){let x=Math.random(),g=0;while(g<3&&(x-=MIX[g])>0)g++;
    // each one takes the free seat at the table they like most (with a little chance)
    let best=null,bv=-1e9;for(const st of seats)if(!st.taken){const v=a.tables[st.i].charm[g]+Math.random()*14;if(v>bv){bv=v;best=st}}
    if(!best)break;best.taken=true;people.push({i:best.i,s:best.s,g,look:Math.floor(Math.random()*LAY.looks),eat:Math.random()<.6})}
  // some of them say what they think of a piece close to their table
  bubbles=[];const P=pieces().concat(room.tops.map((id,i)=>id&&{id,at:tableCentre(i)}).filter(Boolean)),used=new Set(),talked=new Set();
  for(const p of [...people].sort(()=>Math.random()-.5)){if(bubbles.length>=5)break;if(talked.has(p.i))continue;const [cx,cy]=tableCentre(p.i);
    const close=P.filter(q=>Math.hypot(q.at[0]-cx,q.at[1]-cy)<=3.5&&!used.has(q.id));
    const love=close.filter(q=>ITEMS[q.id].app[p.g]>=4).sort((x,y)=>ITEMS[y.id].app[p.g]-ITEMS[x.id].app[p.g])[0],hate=close.find(q=>ITEMS[q.id].app[p.g]<=-1);
    const q=hate&&Math.random()<.5?hate:love||hate;if(!q)continue;used.add(q.id);talked.add(p.i);bubbles.push({p,txt:t(ITEMS[q.id].app[p.g]>0?'like':'dislike',{x:t('i.'+q.id)})})}
}

    if(room.tops[i]){const d=ITEMS[id],[tx,ty]=d.top,tz=d.parts.find(q=>q[0].startsWith('t_'))[3],im=topSpr(room.tops[i]);
      L.push({z:p.r*T+tz+.3,img:im,x:p.c*T+tx+8-im.width/2,y:p.r*T+ty+2-im.height})}});
  room.spots.forEach((id,i)=>{if(id){const p=spotPos(i);L.push(...partsOf(id,p.c,p.r,frame))}});
  for(const [k,x,y,z,n] of LAY.kitchen)L.push({z,img:spr(frameKey(k,n||1,frame)),x,y});
  if(people){L.push({z:9*T,img:spr('waiter'),x:18*T,y:8*T-34});
    for(const p of people){const id=room.tables[p.i],d=ITEMS[id],pos=tablePos(p.i),s=p.s,x0=pos.c*T,y0=pos.r*T;
      L.push({z:y0+s.p[2],img:spr(`p${p.look}_${s.d}`),x:x0+s.p[0],y:y0+s.p[1]});
      const [tx,ty,rx,ry]=d.top,qx=s.d==='right'?tx-rx+14:s.d==='left'?tx+rx-14:(s.chair?tx:s.p[0]+16),qy=s.d==='down'?ty-ry+9:s.d==='up'?ty+ry-9:ty;
      const tz=d.parts.find(q=>q[0].startsWith('t_'))[3];
      L.push({z:y0+tz+.2,img:spr(p.eat?'pizza':'plate'),x:x0+Math.round(qx)-12,y:y0+Math.round(qy)-8})}}
  for(const p of L.filter(p=>p.rug))c.drawImage(p.img,p.x,p.y);

function blit(){
  m.imageSmoothingEnabled=false;m.drawImage(LO,0,0,cv.width,cv.height);const k=cv.width/RW,a=analysis;
  const box=(x,y,w,h,col,lw,dash)=>{m.strokeStyle=col;m.lineWidth=lw;m.setLineDash(dash||[]);m.strokeRect(x*T*k+1,y*T*k+1,w*T*k-2,h*T*k-2);m.setLineDash([])};

    m.fillStyle='rgba(255,241,210,.9)';m.font=`700 ${Math.round(14*k)}px Silkscreen`;m.textAlign='center';m.textBaseline='middle';m.fillText('+',(p.c+w/2)*T*k,(p.r+h/2)*T*k)});
  if(!people)room.walls.forEach((id,i)=>{if(!id)box(i*2,0.15,2,1.7,'rgba(255,241,210,.7)',Math.max(1.5,k*1.5),[k*4,k*3])});

  if(lens>=0){
    PLAN.tables.forEach((p,i)=>{const v=a.tables[i].charm[lens],[cx]=tableCentre(i),x=cx*T*k,y=(p.r+.55)*T*k,r=13*k;
      m.fillStyle=v>=70?'#2e7b2c':v>=50?'#c99a1a':'#b02a1c';m.strokeStyle='#fff';m.lineWidth=2*k;m.beginPath();m.arc(x,y,r,0,Math.PI*2);m.fill();m.stroke();
      m.fillStyle='#fff';m.font=`${Math.round(17*k)}px VT323`;m.textAlign='center';m.textBaseline='middle';m.fillText(v,x,y+k)});
    const mark=(id,x,y)=>{const v=ITEMS[id].app[lens];if(v>-1&&v<2)return;const up=v>=2,s=6*k;m.fillStyle=up?'#3fbf3a':'#e0402a';m.strokeStyle='#1a0d04';m.lineWidth=k;
      m.beginPath();if(up){m.moveTo(x,y-s);m.lineTo(x+s,y+s*.7);m.lineTo(x-s,y+s*.7)}else{m.moveTo(x,y+s);m.lineTo(x+s,y-s*.7);m.lineTo(x-s,y-s*.7)}m.closePath();m.fill();m.stroke()};

}

// a catalogue card: picture, name, price, style, and how much each group likes it

function renderPanel(){
  const el=$('#panel'),a=analysis;let html='',cats=[];
  const charmBars=i=>`<div class="segs">${[0,1,2,3].map(g=>`<span>${t('seg.'+g)}</span><span class="bar"><b style="width:${a.tables[i].charm[g]}%;background:${SEG_COL[g]}"></b></span><span class="v">${a.tables[i].charm[g]}</span>`).join('')}</div>`;
  if(sel&&sel.t==='table'){const i=sel.i,tb=a.tables[i];
    html+=`<h2>${t('table',{n:i+1})}</h2><p class="sub">${t('charm')}</p>${charmBars(i)}${tb.corner?`<p class="sub" style="color:${STYLE_COL[tb.corner]};font-weight:700">${t('styleCorner',{s:t('st.'+tb.corner)})}</p>`:''}`;
    if(people){const here=people.filter(p=>p.i===i),cnt=[0,1,2,3].map(g=>here.filter(p=>p.g===g).length);
      html+=`<p class="sub" style="margin-top:10px">${here.length?t('sat'):t('nobodySat')}</p>${here.length?`<div class="who">${cnt.map((n,g)=>n?`<i style="--c:${SEG_COL[g]}">${t('seg.'+g)} ${n}</i>`:'').join('')}</div>`:''}`}
    const c1=catalogue(PLAN.tables[i].k,room.tables[i],'table'),c2=catalogue('top',room.tops[i],'top');
    html+=`<div class="sec"><h3>${t('model')}</h3>${c1.html}</div><div class="sec"><div class="row" style="justify-content:space-between"><h3>${t('top')}</h3>${room.tops[i]?`<button class="btn sm ghost" data-rm="top">${t('remove')}</button>`:''}</div>${c2.html}</div>`;cats=[c1,c2]}
  else if(sel&&(sel.t==='spot'||sel.t==='wall')){const isWall=sel.t==='wall',cur=isWall?room.walls[sel.i]:room.spots[sel.i],kind=isWall?'wall':PLAN.spots[sel.i].k;
    const c=catalogue(kind,cur,sel.t);cats=[c];
    html+=`<div class="row" style="justify-content:space-between"><h2>${isWall?t('wall'):t('corner')} · ${isWall?'':t('k.'+kind)}</h2>${cur?`<button class="btn sm ghost" data-rm="${sel.t}">${t('remove')}</button>`:''}</div><p class="sub">${cur?t('i.'+cur):t('empty')}</p>${c.html}`}
  else{html+=`<h2>${t('finish')}</h2><div class="sec" style="border:0;margin-top:4px;padding-top:0"><h3>${t('floor')}</h3><div class="cat" data-fin="floor">${Object.keys(FLOORS).map(k=>card(t('f.'+k),FLOORS[k],room.floor===k,`data-id="${k}"`)).join('')}</div></div>
    <div class="sec"><h3>${t('walls')}</h3><div class="cat" data-fin="wall">${Object.keys(WALLS).map(k=>card(t('w.'+k),WALLS[k],room.wall===k,`data-id="${k}"`)).join('')}</div></div>`}
  el.innerHTML=html;
  const grids=el.querySelectorAll('.cat');
  if(cats.length)cats.forEach((c,j)=>fillThumbs(grids[j],c.thumbs));
  else{fillThumbs(grids[0],Object.keys(FLOORS).map(k=>finishThumb('floor',k)));fillThumbs(grids[1],Object.keys(WALLS).map(k=>finishThumb('wall',k)))}
  el.querySelectorAll('[data-slot] [data-id]').forEach(b=>b.onclick=()=>{const id=b.dataset.id,slot=b.closest('[data-slot]').dataset.slot;
    if(slot==='table')room.tables[sel.i]=id;else if(slot==='top')room.tops[sel.i]=id;else if(slot==='spot')room.spots[sel.i]=id;else room.walls[sel.i]=id;changed()});
  el.querySelectorAll('[data-fin] [data-id]').forEach(b=>b.onclick=()=>{if(b.closest('[data-fin]').dataset.fin==='floor')room.floor=b.dataset.id;else room.wall=b.dataset.id;changed()});
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const k=b.dataset.rm;if(k==='top')room.tops[sel.i]=null;else if(k==='spot')room.spots[sel.i]=null;else room.walls[sel.i]=null;changed()});
}
function renderSide(){
  const a=analysis,st=a.share>=.5?t('st.'+a.dom).toUpperCase()+' '+Math.round(a.share*100)+'%':t('lcdMix');
  $('#lcd').innerHTML=`<div><span>${t('lcdStyle')}</span><span>${st}</span></div><div class="dim"><span>${'-'.repeat(30)}</span></div>
    <div><span>${t('lcdTables')}</span><span>${room.tables.length}</span></div><div><span>${t('lcdSeats')}</span><span>${a.seats}</span></div>
    <div><span>${t('lcdSpent')}</span><span>${money(a.spent)}</span></div>${people?`<div><span>${t('lcdSat')}</span><span>${people.length} / ${a.seats}</span></div>`:''}`;
  $('#segs').innerHTML=`<p class="sub" style="grid-column:1/-1;margin:0">${t('atm')}</p>`+[0,1,2,3].map(g=>`<span>${t('seg.'+g)}</span><span class="bar"><b style="width:${a.atm[g]}%;background:${SEG_COL[g]}"></b></span><span class="v">${a.atm[g]}</span>`).join('');
  $('#sets').innerHTML=Object.keys(SETS).map(st=>{const s=a.sets[st],have=new Set([...room.tables,...room.tops,...room.spots,...room.walls]);
    return `<div class="set ${s.done?'done':''}"><div class="row" style="justify-content:space-between"><b style="color:${STYLE_COL[st]}">${t('st.'+st)} ${s.n}/${SETS[st].length}</b>${s.done?`<b>★ ${t('set.title.'+st)}</b>`:''}</div>
      <ul>${SETS[st].map(id=>`<li class="${have.has(id)?'':'no'}">${have.has(id)?'✓':'·'} ${t('i.'+id)}</li>`).join('')}</ul></div>`}).join('');
  $('#hint').textContent=lens>=0?t('h.lens',{g:t('seg.'+lens).toLowerCase()}):people?t('h.open'):t('h.idle');
}
function renderTools(){
  $('#tools').innerHTML=`<button class="btn sm ${people?'':'primary'}" id="open">${people?t('close'):t('open')}</button>
    <span class="lbl">${t('seeAs')}</span>${[0,1,2,3].map(g=>`<button class="btn sm ghost" data-lens="${g}" aria-pressed="${lens===g}">${t('seg.'+g)}</button>`).join('')}
    <button class="btn sm ghost" id="reset">${t('reset')}</button>`;
  $('#open').onclick=()=>{if(people){people=null;bubbles=[]}else openRoom();drawRoom();renderAll()};
  document.querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{const g=+b.dataset.lens;lens=lens===g?-1:g;renderAll()});
  $('#reset').onclick=()=>{room=JSON.parse(JSON.stringify(START));sel=null;people=null;changed()};
}
function renderAll(){renderSide();renderTools();renderPanel()}
function texts(){document.documentElement.lang=LANG;document.title='Pizza Magna · '+t('title');document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('#lang').textContent=t('lang');
  if(people)openRoom();renderAll()}
$('#lang').onclick=()=>{LANG=LANG==='pt'?'en':'pt';try{localStorage.setItem('pm-lang',LANG)}catch(_){}texts()};

fit();addEventListener('resize',fit);
SHEET.onload=()=>{texts();drawRoom();requestAnimationFrame(loop)};SHEET.src=A.src;
</script>
</body>
</html>
